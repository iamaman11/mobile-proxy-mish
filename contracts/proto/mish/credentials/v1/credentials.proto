syntax = "proto3";

package mish.credentials.v1;

// Durable non-secret owner state protected by the Android application sandbox.
// The non-exportable Keystore root is deliberately not part of this message.
message ExternalCredentialState {
  uint64 version = 1;
  bool revoked = 2;
}

// Plaintext contract inside the RSA-OAEP provisioning envelope and the Windows
// DPAPI store. Secret fields must never be logged, rendered, or persisted
// outside the encrypted/DPAPI-protected boundary.
message ExternalProxyProvisioningEnvelope {
  uint32 schema_version = 1;
  uint64 credential_version = 2;
  string credential_id = 3;
  bytes challenge = 4;
  string username = 5;
  string password = 6;
}
