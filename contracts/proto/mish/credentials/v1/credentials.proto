syntax = "proto3";

package mish.credentials.v1;

// Durable non-secret owner state protected by the Android application sandbox.
// The non-exportable Keystore root is deliberately not part of this message.
message ExternalCredentialState {
  uint64 version = 1;
  bool revoked = 2;
}

// Plaintext contract inside the RSA-OAEP provisioning envelope and the Windows
// DPAPI store. Secret fields must never be logged or persisted as ordinary
// plaintext. Plaintext exposure is limited to an explicit sensitive reveal or
// provisioning-consumer operation.
message ExternalProxyProvisioningEnvelope {
  uint32 schema_version = 1;
  uint64 credential_version = 2;
  string credential_id = 3;
  bytes challenge = 4;
  string username = 5;
  string password = 6;
}

// Non-secret, single optional temporary proxy grant. The Rust Credentials owner validates
 // canonical encoding, strict field presence, one-day interval and irreversible terminal state.
 // Secret username/password bytes MUST NOT be persisted in this message; protect them separately
 // with Android Keystore and commit the related generation atomically.
 // status: 1 = active; 2 = expired; 3 = revoked. Zero is invalid.
message TemporaryProxyCredentialLease {
  uint64 generation = 1;
  uint64 activated_at_unix_seconds = 2;
  uint64 expires_at_unix_seconds = 3;
  uint64 last_observed_unix_seconds = 4;
  uint32 status = 5;
}
