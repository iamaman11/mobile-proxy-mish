[workspace]
resolver = "3"
members = [
    "crates/transport",
    "crates/proxy",
    "crates/cellular",
    "crates/rotation",
    "crates/runtime",
    "crates/identity",
    "crates/configuration",
    "crates/control",
    "crates/credentials",
    "crates/readiness",
    "crates/application",
    "crates/android-network",
    "crates/android-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
repository = "https://github.com/iamaman11/mobile-proxy-mish"

[workspace.dependencies]
futures-util = { version = "=0.3.32", default-features = false, features = ["sink", "std"] }
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
webpki-roots = "=1.0.9"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
