[package]
name = "mish-android-ffi"
description = "Narrow Rust to Kotlin and Android platform boundary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
mish-android-network = { path = "../android-network" }
mish-cellular = { path = "../cellular" }
uniffi = { version = "=0.32.0", features = ["cli"] }

[lints]
workspace = true
