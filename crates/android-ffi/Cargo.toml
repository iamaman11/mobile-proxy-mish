[package]
name = "mish-android-ffi"
description = "Narrow Rust to Kotlin and Android platform boundary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/entry.rs"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
mish-android-network = { path = "../android-network" }
mish-application = { path = "../application" }
mish-cellular = { path = "../cellular" }
mish-cellular-egress-bridge = { path = "../cellular-egress-bridge" }
mish-configuration = { path = "../configuration" }
mish-credentials = { path = "../credentials" }
mish-proxy = { path = "../proxy" }
mish-readiness = { path = "../readiness" }
mish-runtime = { path = "../runtime" }
mish-sing-box-adapter = { path = "../sing-box-adapter" }
mish-transport = { path = "../transport" }
uniffi = { version = "=0.32.0", features = ["cli"] }

[lints]
workspace = true
