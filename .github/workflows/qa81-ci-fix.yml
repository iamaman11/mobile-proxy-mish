name: QA81 CI Regression Fix

on:
  push:
    branches: [qa/81-remediation]
    paths:
      - tools/qa81_ci_fix.py
      - .github/workflows/qa81-ci-fix.yml

permissions:
  contents: write

concurrency:
  group: qa81-ci-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: qa/81-remediation
          fetch-depth: 0
      - name: Apply exact regression patch
        run: |
          set -euo pipefail
          python3 tools/qa81_ci_fix.py
          changed="$(git status --short)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | wc -l)" -eq 2
          printf '%s\n' "$changed" | grep -Fq 'android/app/src/main/java/com/mobileproxymish/app/cellular/CellularRootPolicy.kt'
          printf '%s\n' "$changed" | grep -Fq 'android/app/src/test/java/com/mobileproxymish/app/MainUiStateTest.kt'
      - name: Commit bounded patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/com/mobileproxymish/app/cellular/CellularRootPolicy.kt \
                  android/app/src/test/java/com/mobileproxymish/app/MainUiStateTest.kt
          git commit -m 'Root policy: preserve detached partial publication repair'
          git push origin HEAD:qa/81-remediation
