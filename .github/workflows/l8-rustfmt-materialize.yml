name: L8 Rustfmt Materialization

on:
  pull_request:
    branches: [fix/root-policy-reconciliation]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/l8-rustfmt-materialize.yml'
      - 'crates/**/*.rs'

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Set up exact Rust formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          rustup override set 1.98.1

      - name: Materialize canonical formatting
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          cargo fmt --all
          if git diff --quiet -- 'crates/**/*.rs'; then
            echo 'MISH_RUSTFMT_CURRENT=YES'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'crates/**/*.rs'
          git commit -m 'Apply canonical Rust formatting for L8'
          git push origin "HEAD:$HEAD_REF"
