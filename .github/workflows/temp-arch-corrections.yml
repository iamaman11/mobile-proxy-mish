name: Temporary Architecture Corrections

on:
  push:
    branches: [m1/arch-final-corrections]

permissions:
  contents: write

jobs:
  correct:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: m1/arch-final-corrections
          fetch-depth: 0

      - name: Apply exact reviewed corrections
        shell: python
        run: |
          from pathlib import Path

          lifecycle = Path('crates/runtime/src/lifecycle.rs')
          text = lifecycle.read_text(encoding='utf-8')
          old = '    pub const fn can_mutate_stopped_generation(self) -> bool {\n'
          new = '    pub fn can_mutate_stopped_generation(self) -> bool {\n'
          if text.count(old) != 1:
              raise SystemExit('unexpected RuntimeLifecycle predicate shape')
          lifecycle.write_text(text.replace(old, new), encoding='utf-8')

          guard = Path('tools/check_architecture.py')
          text = guard.read_text(encoding='utf-8')
          anchor = '''    # Proxy Serving is the sole product listener-fact owner.\n'''
          block = '''    # Mesh Transport runtime/lifecycle state belongs to crates/transport, never the FFI seam.\n    mesh_ffi = "crates/android-ffi/src/transport_ffi.rs"\n    require(\n        mesh_ffi,\n        "MeshTransportCoordinator",\n        "Mesh FFI must delegate runtime coordination to the Transport owner",\n    )\n    for symbol in (\n        "struct MeshTransportState",\n        "MeshEndpointOwner",\n        "MeshIngressRuntime",\n        "ingress_epoch",\n        "cleanup_failed",\n    ):\n        forbid(\n            mesh_ffi,\n            symbol,\n            "Mesh admission/ingress lifecycle state must not drift back into android-ffi",\n        )\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('unexpected architecture guard insertion point')
          if 'Mesh Transport runtime/lifecycle state belongs to crates/transport' in text:
              raise SystemExit('Mesh FFI guard already exists')
          guard.write_text(text.replace(anchor, block + anchor), encoding='utf-8')

      - name: Validate correction locally
        run: |
          set -euo pipefail
          python3 tools/check_architecture.py
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          rustup override set 1.98.1
          cargo fmt --all --check

      - name: Commit correction and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/temp-arch-corrections.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'M1 architecture: close final owner and pinned-Rust guard gaps'
          git push origin HEAD:m1/arch-final-corrections
