name: E3 Physical Cellular

on:
  pull_request:
    paths:
      - '.github/workflows/e3-physical-cellular.yml'
      - 'lab/windows/E3Harness.psm1'
      - 'lab/windows/Labctl.psm1'
      - 'lab/windows/labctl.ps1'
      - 'lab/windows/test-e3-harness.ps1'
      - 'lab/windows/test-e3-zero-input.ps1'
      - 'scripts/release/android_release.py'
      - 'scripts/release/e3_harness.py'
      - 'docs/lab/LABCTL.md'
      - 'docs/testing/E3_PHYSICAL_CELLULAR.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/e3-physical-cellular.yml'
      - 'lab/windows/E3Harness.psm1'
      - 'lab/windows/Labctl.psm1'
      - 'lab/windows/labctl.ps1'
      - 'lab/windows/test-e3-harness.ps1'
      - 'lab/windows/test-e3-zero-input.ps1'
      - 'scripts/release/android_release.py'
      - 'scripts/release/e3_harness.py'
      - 'docs/lab/LABCTL.md'
      - 'docs/testing/E3_PHYSICAL_CELLULAR.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: e3-physical-cellular
  cancel-in-progress: false

env:
  TRUSTED_RELEASE_SIGNING_CERT_SHA256: 1958d474069ce0f8b8e5390c9c4ebecd6e306fb4e0f0f6e12d35c9b91cc67803

jobs:
  contract:
    name: E3 Windows Artifact Contract
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test exact harness, Windows trust boundary, readiness projection, and zero-input selection
        shell: pwsh
        run: |
          ./lab/windows/test-e3-harness.ps1
          ./lab/windows/test-e3-zero-input.ps1

  resolve-rc:
    name: Resolve current immutable E3 RC
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected == true }}
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rc_tag: ${{ steps.release-meta.outputs.rc_tag }}
      source_sha: ${{ steps.release-meta.outputs.source_sha }}
      apk_sha256: ${{ steps.release-meta.outputs.apk_sha256 }}
      signing_cert_sha256: ${{ steps.release-bytes.outputs.signing_cert_sha256 }}
      harness_run_id: ${{ steps.harness-meta.outputs.run_id }}
      harness_artifact_id: ${{ steps.harness-meta.outputs.artifact_id }}
      harness_artifact_name: ${{ steps.harness-meta.outputs.artifact_name }}
      harness_zip_sha256: ${{ steps.harness-meta.outputs.zip_sha256 }}
      test_apk_sha256: ${{ steps.harness-bytes.outputs.test_apk_sha256 }}
    steps:
      - name: Checkout accepted main resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve current tag, source, immutable release, and GitHub asset digest
        id: release-meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/e3-resolve"
          mkdir -p "$ROOT/release"

          git fetch --force --tags origin
          git fetch origin main
          git tag --list 'v*-rc.*' --sort=version:refname > "$ROOT/tags.txt"
          python3 scripts/release/android_release.py next-rc \
            --tags-file "$ROOT/tags.txt" \
            --github-output "$ROOT/lineage.out"

          RC_TAG="$(python3 - "$ROOT/lineage.out" <<'PY'
          import sys
          values = {}
          for raw in open(sys.argv[1], encoding="utf-8"):
              key, sep, value = raw.rstrip("\n").partition("=")
              if not sep or key in values:
                  raise SystemExit("invalid machine-owned RC lineage projection")
              values[key] = value
          tag = values.get("previous_tag", "")
          if not tag:
              raise SystemExit("no current RC exists for the active Android release lineage; create an RC first")
          print(tag)
          PY
          )"
          python3 scripts/release/android_release.py derive --tag "$RC_TAG" >/dev/null

          SOURCE_SHA="$(git rev-parse "$RC_TAG^{commit}")"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main

          git diff --name-only --diff-filter=ACDMRTUXB "$SOURCE_SHA" origin/main > "$ROOT/post-rc-paths.txt"
          while IFS= read -r path; do
            case "$path" in
              android/*|crates/*|Cargo.toml|Cargo.lock|rust-toolchain.toml|vendor/sing-box/release.toml|.github/actions/*)
                echo "current RC is stale after product-impacting main change: $path" >&2
                exit 2
                ;;
            esac
          done < "$ROOT/post-rc-paths.txt"

          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RC_TAG" > "$ROOT/release.json"

          python3 - "$ROOT/release.json" "$RC_TAG" "$SOURCE_SHA" "$GITHUB_OUTPUT" <<'PY'
          import json
          import re
          import sys

          path, tag, source, output = sys.argv[1:]
          release = json.load(open(path, encoding="utf-8"))
          if release.get("tag_name") != tag or release.get("draft") is not False or release.get("prerelease") is not True:
              raise SystemExit("current tag is not a published RC prerelease")
          if release.get("immutable") is not True:
              raise SystemExit("exact RC is mutable; GitHub release immutability is required before physical acceptance")
          apk_name = f"mobile-proxy-mish-{tag}.apk"
          manifest_name = f"mobile-proxy-mish-{tag}.release.json"
          assets = release.get("assets") or []
          if len(assets) != 2:
              raise SystemExit("RC release must contain exactly product APK + release manifest")
          by_name = {asset.get("name"): asset for asset in assets}
          if set(by_name) != {apk_name, manifest_name}:
              raise SystemExit("RC release asset set is not canonical")
          digest = str(by_name[apk_name].get("digest") or "")
          match = re.fullmatch(r"sha256:([0-9a-f]{64})", digest)
          if not match:
              raise SystemExit("GitHub Release APK digest is unavailable or malformed")
          with open(output, "a", encoding="utf-8", newline="\n") as handle:
              handle.write(f"rc_tag={tag}\n")
              handle.write(f"source_sha={source}\n")
              handle.write(f"apk_name={apk_name}\n")
              handle.write(f"manifest_name={manifest_name}\n")
              handle.write(f"apk_sha256={match.group(1)}\n")
          PY

      - name: Download and verify exact immutable release bytes
        id: release-bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RC_TAG: ${{ steps.release-meta.outputs.rc_tag }}
          SOURCE_SHA: ${{ steps.release-meta.outputs.source_sha }}
          APK_NAME: ${{ steps.release-meta.outputs.apk_name }}
          MANIFEST_NAME: ${{ steps.release-meta.outputs.manifest_name }}
          APK_SHA256: ${{ steps.release-meta.outputs.apk_sha256 }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/e3-resolve/release"
          gh release download "$RC_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$APK_NAME" \
            --pattern "$MANIFEST_NAME" \
            --dir "$ROOT"

          APK="$ROOT/$APK_NAME"
          MANIFEST="$ROOT/$MANIFEST_NAME"
          test -f "$APK"
          test -f "$MANIFEST"
          [[ "$(sha256sum "$APK" | awk '{print $1}')" == "$APK_SHA256" ]]
          gh release verify "$RC_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release verify-asset "$RC_TAG" "$APK" --repo "$GITHUB_REPOSITORY" >/dev/null
          python3 scripts/release/android_release.py verify \
            --tag "$RC_TAG" \
            --manifest "$MANIFEST" \
            --apk "$APK" \
            --expected-source-commit "$SOURCE_SHA" >/dev/null

          CERT="$(python3 - "$MANIFEST" "$TRUSTED_RELEASE_SIGNING_CERT_SHA256" <<'PY'
          import json
          import re
          import sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = sys.argv[2]
          cert = str((manifest.get("artifact") or {}).get("signing_certificate_sha256") or "").lower()
          if not re.fullmatch(r"[0-9a-f]{64}", cert) or cert != expected:
              raise SystemExit("release signing certificate does not match reviewed trust anchor")
          print(cert)
          PY
          )"
          echo "signing_cert_sha256=$CERT" >> "$GITHUB_OUTPUT"

      - name: Resolve unique successful harness run and artifact
        id: harness-meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RC_TAG: ${{ steps.release-meta.outputs.rc_tag }}
          SOURCE_SHA: ${{ steps.release-meta.outputs.source_sha }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/e3-resolve"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/android-release.yml/runs?event=workflow_dispatch&status=completed&head_sha=$SOURCE_SHA&per_page=100" > "$ROOT/runs.json"
          RUN_ID="$(python3 - "$ROOT/runs.json" "$RC_TAG" "$SOURCE_SHA" <<'PY'
          import json
          import sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          tag, source = sys.argv[2], sys.argv[3]
          if int(data.get("total_count", -1)) > 100:
              raise SystemExit("harness workflow-run search exceeded bounded result set")
          matches = [
              run for run in data.get("workflow_runs", [])
              if run.get("name") == "Android Release Candidate"
              and run.get("path") == ".github/workflows/android-release.yml"
              and run.get("head_branch") == tag
              and run.get("head_sha") == source
              and run.get("event") == "workflow_dispatch"
              and run.get("status") == "completed"
              and run.get("conclusion") == "success"
              and (run.get("actor") or {}).get("login") == "github-actions[bot]"
          ]
          if len(matches) != 1:
              raise SystemExit("exact RC must have exactly one successful machine-owned release run")
          print(matches[0]["id"])
          PY
          )"
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" > "$ROOT/artifacts.json"
          python3 - "$ROOT/artifacts.json" "$RC_TAG" "$SOURCE_SHA" "$RUN_ID" "$GITHUB_OUTPUT" <<'PY'
          import json
          import re
          import sys
          path, tag, source, run_id, output = sys.argv[1:]
          data = json.load(open(path, encoding="utf-8"))
          if int(data.get("total_count", -1)) > 100:
              raise SystemExit("harness artifact search exceeded bounded result set")
          name = f"e3-harness-{tag}"
          matches = [artifact for artifact in data.get("artifacts", []) if artifact.get("name") == name]
          if len(matches) != 1:
              raise SystemExit("exact RC must have exactly one named E3 harness artifact")
          artifact = matches[0]
          workflow_run = artifact.get("workflow_run") or {}
          digest = str(artifact.get("digest") or "")
          digest_match = re.fullmatch(r"sha256:([0-9a-f]{64})", digest)
          if artifact.get("expired") is not False or not digest_match:
              raise SystemExit("E3 harness artifact is expired or lacks canonical digest")
          if str(workflow_run.get("id")) != run_id or workflow_run.get("head_branch") != tag or workflow_run.get("head_sha") != source:
              raise SystemExit("E3 harness artifact workflow identity mismatch")
          artifact_id = artifact.get("id")
          if not isinstance(artifact_id, int) or artifact_id <= 0:
              raise SystemExit("E3 harness artifact ID is invalid")
          with open(output, "a", encoding="utf-8", newline="\n") as handle:
              handle.write(f"run_id={run_id}\n")
              handle.write(f"artifact_id={artifact_id}\n")
              handle.write(f"artifact_name={name}\n")
              handle.write(f"zip_sha256={digest_match.group(1)}\n")
          PY

      - name: Download exact harness projection for hosted identity verification
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.harness-meta.outputs.artifact_id }}
          path: ${{ runner.temp }}/e3-resolve/harness
          github-token: ${{ github.token }}
          repository: iamaman11/mobile-proxy-mish
          run-id: ${{ steps.harness-meta.outputs.run_id }}

      - name: Verify harness manifest/bytes and project test APK digest
        id: harness-bytes
        shell: bash
        env:
          RC_TAG: ${{ steps.release-meta.outputs.rc_tag }}
          SOURCE_SHA: ${{ steps.release-meta.outputs.source_sha }}
          APK_NAME: ${{ steps.release-meta.outputs.apk_name }}
          SIGNING_CERT_SHA256: ${{ steps.release-bytes.outputs.signing_cert_sha256 }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/e3-resolve/harness"
          mapfile -t MANIFESTS < <(find "$ROOT" -type f -name "mobile-proxy-mish-$RC_TAG-e3-harness.json" -print)
          mapfile -t TEST_APKS < <(find "$ROOT" -type f -name "mobile-proxy-mish-$RC_TAG-e3-androidTest.apk" -print)
          mapfile -t HARNESS_FILES < <(find "$ROOT" -type f -print)
          [[ "${#MANIFESTS[@]}" -eq 1 ]]
          [[ "${#TEST_APKS[@]}" -eq 1 ]]
          [[ "${#HARNESS_FILES[@]}" -eq 2 ]]
          python3 scripts/release/e3_harness.py verify \
            --manifest "${MANIFESTS[0]}" \
            --tag "$RC_TAG" \
            --source-commit "$SOURCE_SHA" \
            --signing-cert-sha256 "$SIGNING_CERT_SHA256" \
            --product-apk "$RUNNER_TEMP/e3-resolve/release/$APK_NAME" \
            --test-apk "${TEST_APKS[0]}"
          TEST_SHA="$(sha256sum "${TEST_APKS[0]}" | awk '{print $1}')"
          [[ "$TEST_SHA" =~ ^[0-9a-f]{64}$ ]]
          echo "test_apk_sha256=$TEST_SHA" >> "$GITHUB_OUTPUT"

      - name: Publish machine-owned E3 identity projection
        shell: bash
        env:
          RC_TAG: ${{ steps.release-meta.outputs.rc_tag }}
          SOURCE_SHA: ${{ steps.release-meta.outputs.source_sha }}
          APK_SHA256: ${{ steps.release-meta.outputs.apk_sha256 }}
          HARNESS_RUN_ID: ${{ steps.harness-meta.outputs.run_id }}
          HARNESS_ARTIFACT_ID: ${{ steps.harness-meta.outputs.artifact_id }}
          TEST_APK_SHA256: ${{ steps.harness-bytes.outputs.test_apk_sha256 }}
        run: |
          {
            echo '### E3 current RC projection'
            echo "- RC tag: \`$RC_TAG\`"
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Product APK SHA-256: \`$APK_SHA256\`"
            echo "- Harness run/artifact: \`$HARNESS_RUN_ID\` / \`$HARNESS_ARTIFACT_ID\`"
            echo "- Test APK SHA-256: \`$TEST_APK_SHA256\`"
            echo '- Selection: **machine-owned active RC lineage; no human tag input**'
            echo '- Projection source: **native immutable GitHub Release + verified GitHub release attestation + exact successful release run/artifact**'
            echo '- Human-copied source/digest/artifact tuple: **NO**'
          } >> "$GITHUB_STEP_SUMMARY"

  physical-cellular:
    name: E3 Physical Cellular Windows LAB
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected == true }}
    needs: [contract, resolve-rc]
    runs-on: [self-hosted, windows, x64, mobile-proxy-mish-lab]
    timeout-minutes: 30
    env:
      LAB_POWERSHELL_EXE: C:\mish-lab\tools\powershell-7.6.6\pwsh.exe
      ADB_EXE: C:\mish-lab\tools\android-sdk\platform-tools\adb.exe
      RC_TAG: ${{ needs.resolve-rc.outputs.rc_tag }}
      RC_SOURCE: ${{ needs.resolve-rc.outputs.source_sha }}
      RC_APK_SHA256: ${{ needs.resolve-rc.outputs.apk_sha256 }}
      RC_SIGNING_CERT_SHA256: ${{ needs.resolve-rc.outputs.signing_cert_sha256 }}
      HARNESS_RUN_ID: ${{ needs.resolve-rc.outputs.harness_run_id }}
      HARNESS_ARTIFACT_ID: ${{ needs.resolve-rc.outputs.harness_artifact_id }}
      HARNESS_ARTIFACT_NAME: ${{ needs.resolve-rc.outputs.harness_artifact_name }}
      HARNESS_ZIP_SHA256: ${{ needs.resolve-rc.outputs.harness_zip_sha256 }}
      HARNESS_TEST_APK_SHA256: ${{ needs.resolve-rc.outputs.test_apk_sha256 }}
      E3_HOST: checkip.amazonaws.com
      E3_PORT: '80'
      E3_PATH: '/'
      RUN_MODE: full-root-toggle

    steps:
      - name: Checkout accepted main execution adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true

      - name: Verify physical host identity
        shell: cmd
        run: |
          if not exist "%LAB_POWERSHELL_EXE%" exit /b 2
          if not exist "%ADB_EXE%" exit /b 2
          "%LAB_POWERSHELL_EXE%" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\lab\windows\labctl.ps1" host inspect -PhysicalLab
          exit /b %ERRORLEVEL%

      - name: Resolve exact accepted RC product bytes
        shell: cmd
        run: |
          if not exist "%RUNNER_TEMP%\mish-e3\product" mkdir "%RUNNER_TEMP%\mish-e3\product"
          "%LAB_POWERSHELL_EXE%" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\lab\windows\labctl.ps1" release resolve -Tag "%RC_TAG%" -ExpectedSourceCommit "%RC_SOURCE%" -ExpectedApkSha256 "%RC_APK_SHA256%" -ExpectedSigningCertificateSha256 "%RC_SIGNING_CERT_SHA256%" -Directory "%RUNNER_TEMP%\mish-e3\product" -ReceiptPath "%RUNNER_TEMP%\mish-e3\resolution.json"
          exit /b %ERRORLEVEL%

      - name: Verify exact downloaded RC product bytes
        shell: cmd
        run: |
          "%LAB_POWERSHELL_EXE%" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\lab\windows\labctl.ps1" release verify -Tag "%RC_TAG%" -ExpectedSourceCommit "%RC_SOURCE%" -ExpectedApkSha256 "%RC_APK_SHA256%" -ExpectedSigningCertificateSha256 "%RC_SIGNING_CERT_SHA256%" -Directory "%RUNNER_TEMP%\mish-e3\product" -ReceiptPath "%RUNNER_TEMP%\mish-e3\verification.json"
          exit /b %ERRORLEVEL%

      - name: Download exact accepted E3 harness artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ env.HARNESS_ARTIFACT_ID }}
          path: ${{ runner.temp }}\mish-e3\harness
          github-token: ${{ github.token }}
          repository: iamaman11/mobile-proxy-mish
          run-id: ${{ env.HARNESS_RUN_ID }}

      - name: Verify exact harness run, artifact, manifest, and bytes
        shell: cmd
        run: |
          "%LAB_POWERSHELL_EXE%" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\lab\windows\labctl.ps1" e3 verify -VerificationReceipt "%RUNNER_TEMP%\mish-e3\verification.json" -HarnessRunId "%HARNESS_RUN_ID%" -HarnessArtifactId "%HARNESS_ARTIFACT_ID%" -ExpectedHarnessZipSha256 "%HARNESS_ZIP_SHA256%" -ExpectedTestApkSha256 "%HARNESS_TEST_APK_SHA256%" -HarnessDirectory "%RUNNER_TEMP%\mish-e3\harness\%HARNESS_ARTIFACT_NAME%" -ReceiptPath "%RUNNER_TEMP%\mish-e3\harness-verification.json"
          exit /b %ERRORLEVEL%

      - name: Prove zero-device PHONE-ON boundary
        if: ${{ env.RUN_MODE == 'pre-device-dry' }}
        shell: cmd
        run: |
          "%LAB_POWERSHELL_EXE%" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\lab\windows\labctl.ps1" android inspect -AdbPath "%ADB_EXE%" -RequireNoDevice -TimeoutSeconds 30 > "%RUNNER_TEMP%\mish-e3\android-observation.json"
          exit /b %ERRORLEVEL%

      - name: Emit typed E3 readiness receipt
        if: ${{ env.RUN_MODE == 'pre-device-dry' }}
        shell: cmd
        run: |
          "%LAB_POWERSHELL_EXE%" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\lab\windows\labctl.ps1" e3 ready -VerificationReceipt "%RUNNER_TEMP%\mish-e3\verification.json" -HarnessVerificationReceipt "%RUNNER_TEMP%\mish-e3\harness-verification.json" -AndroidObservationPath "%RUNNER_TEMP%\mish-e3\android-observation.json" -EvidencePath "%RUNNER_TEMP%\mish-e3\readiness.json"
          exit /b %ERRORLEVEL%

      - name: Project readiness into durable LAB evidence
        if: ${{ env.RUN_MODE == 'pre-device-dry' }}
        shell: cmd
        run: |
          "%LAB_POWERSHELL_EXE%" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\lab\windows\labctl.ps1" evidence collect -InputPath "%RUNNER_TEMP%\mish-e3\readiness.json" -EvidencePath "%RUNNER_TEMP%\mish-e3\evidence.json"
          exit /b %ERRORLEVEL%

      - name: Publish pre-device boundary summary
        if: ${{ env.RUN_MODE == 'pre-device-dry' }}
        shell: cmd
        run: |
          >>"%GITHUB_STEP_SUMMARY%" echo ### LAB-3B E3 pre-device Windows proof
          >>"%GITHUB_STEP_SUMMARY%" echo - RC: `%RC_TAG%` / `%RC_SOURCE%`
          >>"%GITHUB_STEP_SUMMARY%" echo - Product APK SHA-256: `%RC_APK_SHA256%`
          >>"%GITHUB_STEP_SUMMARY%" echo - Harness run/artifact: `%HARNESS_RUN_ID%` / `%HARNESS_ARTIFACT_ID%`
          >>"%GITHUB_STEP_SUMMARY%" echo - Test APK SHA-256: `%HARNESS_TEST_APK_SHA256%`
          >>"%GITHUB_STEP_SUMMARY%" echo - RC identity source: **native immutable GitHub Release + verified release attestation**
          >>"%GITHUB_STEP_SUMMARY%" echo - Android product/test build on physical runner: **NO**
          >>"%GITHUB_STEP_SUMMARY%" echo - APK installation: **NO**
          >>"%GITHUB_STEP_SUMMARY%" echo - Durable evidence schema: `mish.lab.evidence/v1`
          >>"%GITHUB_STEP_SUMMARY%" echo - PHONE-ON READY
          >>"%GITHUB_STEP_SUMMARY%" echo - E3_PASS=NO
          >>"%GITHUB_STEP_SUMMARY%" echo - NO_EVIDENCE_ESCALATION=PASS

      - name: Upload typed LAB-3B readiness evidence
        if: ${{ env.RUN_MODE == 'pre-device-dry' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lab3-e3-pre-device-evidence
          path: ${{ runner.temp }}\mish-e3\evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Execute original E3 positive-negative-recovery ceremony
        if: ${{ env.RUN_MODE == 'full-root-toggle' }}
        shell: cmd
        run: |
          "%LAB_POWERSHELL_EXE%" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\lab\windows\labctl.ps1" e3 execute -VerificationReceipt "%RUNNER_TEMP%\mish-e3\verification.json" -HarnessVerificationReceipt "%RUNNER_TEMP%\mish-e3\harness-verification.json" -AdbPath "%ADB_EXE%" -E3Host "%E3_HOST%" -E3Port "%E3_PORT%" -E3Path "%E3_PATH%" -TimeoutSeconds 300
          exit /b %ERRORLEVEL%

      - name: Publish E3 execution summary
        if: ${{ env.RUN_MODE == 'full-root-toggle' && success() }}
        shell: cmd
        run: |
          >>"%GITHUB_STEP_SUMMARY%" echo ### E3 physical cellular accepted ceremony
          >>"%GITHUB_STEP_SUMMARY%" echo - Exact product/harness bytes verified before installation.
          >>"%GITHUB_STEP_SUMMARY%" echo - Positive -^> negative -^> recovery positive completed.
          >>"%GITHUB_STEP_SUMMARY%" echo - Device-side public carrier IP is intentionally not persisted.
          >>"%GITHUB_STEP_SUMMARY%" echo - E3_PASS=YES
