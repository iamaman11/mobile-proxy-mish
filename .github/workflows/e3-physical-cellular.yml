name: E3 Physical Cellular

on:
  pull_request:
    paths:
      - '.github/workflows/e3-physical-cellular.yml'
      - 'lab/windows/E3Harness.psm1'
      - 'lab/windows/Labctl.psm1'
      - 'lab/windows/labctl.ps1'
      - 'lab/windows/test-e3-harness.ps1'
      - 'docs/lab/LABCTL.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/e3-physical-cellular.yml'
      - 'lab/windows/E3Harness.psm1'
      - 'lab/windows/Labctl.psm1'
      - 'lab/windows/labctl.ps1'
      - 'lab/windows/test-e3-harness.ps1'
      - 'docs/lab/LABCTL.md'
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution boundary"
        required: true
        default: pre-device-dry
        type: choice
        options:
          - pre-device-dry
          - full-root-toggle

permissions:
  contents: read
  actions: read

concurrency:
  group: e3-physical-cellular
  cancel-in-progress: false

jobs:
  contract:
    name: E3 Windows Artifact Contract
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test exact harness, Windows trust boundary, and readiness projection
        shell: pwsh
        run: ./lab/windows/test-e3-harness.ps1

  physical-cellular:
    name: E3 Physical Cellular Windows LAB
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected == true }}
    needs: contract
    runs-on: [self-hosted, windows, x64, mobile-proxy-mish-lab]
    timeout-minutes: 30
    env:
      LAB_POWERSHELL_EXE: C:\mish-lab\tools\powershell-7.6.6\pwsh.exe
      ADB_EXE: C:\mish-lab\tools\android-sdk\platform-tools\adb.exe
      RC_TAG: v0.1.0-rc.3
      RC_SOURCE: d057f267ffac5cbeca40839778783d462a51b7a0
      RC_APK_SHA256: 84d8a53857a20a5d55093604324770d00fdbd8a187a69c524e88920d00b323f0
      RC_SIGNING_CERT_SHA256: 1958d474069ce0f8b8e5390c9c4ebecd6e306fb4e0f0f6e12d35c9b91cc67803
      HARNESS_RUN_ID: 34498778808
      HARNESS_ARTIFACT_ID: 10161372180
      HARNESS_ARTIFACT_NAME: e3-harness-v0.1.0-rc.3
      HARNESS_ZIP_SHA256: 1c1758a5ce3672db76952627e4b1a61ac4e2e73744957f8c8b1f80b5efc01d36
      HARNESS_TEST_APK_SHA256: 2d377cfce3f0827d6bc4efda313d6ebaeb6dac148303bb1eaff9a0b60c860c9c
      E3_HOST: checkip.amazonaws.com
      E3_PORT: '80'
      E3_PATH: '/'
      RUN_MODE: ${{ inputs.mode }}

    steps:
      - name: Checkout accepted main execution adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true

      - name: Verify physical host identity
        shell: cmd
        run: |
          if not exist "%LAB_POWERSHELL_EXE%" exit /b 2
          if not exist "%ADB_EXE%" exit /b 2
          "%LAB_POWERSHELL_EXE%" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\lab\windows\labctl.ps1" host inspect -PhysicalLab
          exit /b %ERRORLEVEL%

      - name: Resolve exact accepted RC product bytes
        shell: cmd
        run: |
          if not exist "%RUNNER_TEMP%\mish-e3\product" mkdir "%RUNNER_TEMP%\mish-e3\product"
          "%LAB_POWERSHELL_EXE%" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\lab\windows\labctl.ps1" release resolve -Tag "%RC_TAG%" -ExpectedSourceCommit "%RC_SOURCE%" -ExpectedApkSha256 "%RC_APK_SHA256%" -ExpectedSigningCertificateSha256 "%RC_SIGNING_CERT_SHA256%" -Directory "%RUNNER_TEMP%\mish-e3\product" -ReceiptPath "%RUNNER_TEMP%\mish-e3\resolution.json"
          exit /b %ERRORLEVEL%

      - name: Verify exact downloaded RC product bytes
        shell: cmd
        run: |
          "%LAB_POWERSHELL_EXE%" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\lab\windows\labctl.ps1" release verify -Tag "%RC_TAG%" -ExpectedSourceCommit "%RC_SOURCE%" -ExpectedApkSha256 "%RC_APK_SHA256%" -ExpectedSigningCertificateSha256 "%RC_SIGNING_CERT_SHA256%" -Directory "%RUNNER_TEMP%\mish-e3\product" -ReceiptPath "%RUNNER_TEMP%\mish-e3\verification.json"
          exit /b %ERRORLEVEL%

      - name: Download exact accepted E3 harness artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ env.HARNESS_ARTIFACT_ID }}
          path: ${{ runner.temp }}\mish-e3\harness
          github-token: ${{ github.token }}
          repository: iamaman11/mobile-proxy-mish
          run-id: ${{ env.HARNESS_RUN_ID }}

      - name: Verify exact harness run, artifact, manifest, and bytes
        shell: cmd
        run: |
          "%LAB_POWERSHELL_EXE%" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\lab\windows\labctl.ps1" e3 verify -VerificationReceipt "%RUNNER_TEMP%\mish-e3\verification.json" -HarnessRunId "%HARNESS_RUN_ID%" -HarnessArtifactId "%HARNESS_ARTIFACT_ID%" -ExpectedHarnessZipSha256 "%HARNESS_ZIP_SHA256%" -ExpectedTestApkSha256 "%HARNESS_TEST_APK_SHA256%" -HarnessDirectory "%RUNNER_TEMP%\mish-e3\harness\%HARNESS_ARTIFACT_NAME%" -ReceiptPath "%RUNNER_TEMP%\mish-e3\harness-verification.json"
          exit /b %ERRORLEVEL%

      - name: Prove zero-device PHONE-ON boundary
        if: ${{ env.RUN_MODE == 'pre-device-dry' }}
        shell: cmd
        run: |
          "%LAB_POWERSHELL_EXE%" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\lab\windows\labctl.ps1" android inspect -AdbPath "%ADB_EXE%" -RequireNoDevice -TimeoutSeconds 30 > "%RUNNER_TEMP%\mish-e3\android-observation.json"
          exit /b %ERRORLEVEL%

      - name: Emit typed E3 readiness receipt
        if: ${{ env.RUN_MODE == 'pre-device-dry' }}
        shell: cmd
        run: |
          "%LAB_POWERSHELL_EXE%" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\lab\windows\labctl.ps1" e3 ready -VerificationReceipt "%RUNNER_TEMP%\mish-e3\verification.json" -HarnessVerificationReceipt "%RUNNER_TEMP%\mish-e3\harness-verification.json" -AndroidObservationPath "%RUNNER_TEMP%\mish-e3\android-observation.json" -EvidencePath "%RUNNER_TEMP%\mish-e3\readiness.json"
          exit /b %ERRORLEVEL%

      - name: Project readiness into durable LAB evidence
        if: ${{ env.RUN_MODE == 'pre-device-dry' }}
        shell: cmd
        run: |
          "%LAB_POWERSHELL_EXE%" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\lab\windows\labctl.ps1" evidence collect -InputPath "%RUNNER_TEMP%\mish-e3\readiness.json" -EvidencePath "%RUNNER_TEMP%\mish-e3\evidence.json"
          exit /b %ERRORLEVEL%

      - name: Publish pre-device boundary summary
        if: ${{ env.RUN_MODE == 'pre-device-dry' }}
        shell: cmd
        run: |
          >>"%GITHUB_STEP_SUMMARY%" echo ### LAB-3B E3 pre-device Windows proof
          >>"%GITHUB_STEP_SUMMARY%" echo - RC: `%RC_TAG%` / `%RC_SOURCE%`
          >>"%GITHUB_STEP_SUMMARY%" echo - Product APK SHA-256: `%RC_APK_SHA256%`
          >>"%GITHUB_STEP_SUMMARY%" echo - Harness run/artifact: `%HARNESS_RUN_ID%` / `%HARNESS_ARTIFACT_ID%`
          >>"%GITHUB_STEP_SUMMARY%" echo - Test APK SHA-256: `%HARNESS_TEST_APK_SHA256%`
          >>"%GITHUB_STEP_SUMMARY%" echo - Android product/test build on physical runner: **NO**
          >>"%GITHUB_STEP_SUMMARY%" echo - APK installation: **NO**
          >>"%GITHUB_STEP_SUMMARY%" echo - Durable evidence schema: `mish.lab.evidence/v1`
          >>"%GITHUB_STEP_SUMMARY%" echo - PHONE-ON READY
          >>"%GITHUB_STEP_SUMMARY%" echo - E3_PASS=NO
          >>"%GITHUB_STEP_SUMMARY%" echo - NO_EVIDENCE_ESCALATION=PASS

      - name: Upload typed LAB-3B readiness evidence
        if: ${{ env.RUN_MODE == 'pre-device-dry' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lab3-e3-pre-device-evidence
          path: ${{ runner.temp }}\mish-e3\evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Execute original E3 positive-negative-recovery ceremony
        if: ${{ env.RUN_MODE == 'full-root-toggle' }}
        shell: cmd
        run: |
          "%LAB_POWERSHELL_EXE%" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\lab\windows\labctl.ps1" e3 execute -VerificationReceipt "%RUNNER_TEMP%\mish-e3\verification.json" -HarnessVerificationReceipt "%RUNNER_TEMP%\mish-e3\harness-verification.json" -AdbPath "%ADB_EXE%" -E3Host "%E3_HOST%" -E3Port "%E3_PORT%" -E3Path "%E3_PATH%" -TimeoutSeconds 300
          exit /b %ERRORLEVEL%

      - name: Publish E3 execution summary
        if: ${{ env.RUN_MODE == 'full-root-toggle' && success() }}
        shell: cmd
        run: |
          >>"%GITHUB_STEP_SUMMARY%" echo ### E3 physical cellular accepted ceremony
          >>"%GITHUB_STEP_SUMMARY%" echo - Exact product/harness bytes verified before installation.
          >>"%GITHUB_STEP_SUMMARY%" echo - Positive -^> negative -^> recovery positive completed.
          >>"%GITHUB_STEP_SUMMARY%" echo - Device-side public carrier IP is intentionally not persisted.
          >>"%GITHUB_STEP_SUMMARY%" echo - E3_PASS=YES
