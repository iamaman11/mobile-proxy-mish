name: LAB Host Static

on:
  pull_request:
    paths:
      - 'lab/windows/**'
      - 'docs/lab/WINDOWS_HOST.md'
      - '.github/workflows/lab-host-static.yml'
      - '.github/workflows/lab-host-preflight.yml'
  push:
    branches: [main]
    paths:
      - 'lab/windows/**'
      - 'docs/lab/WINDOWS_HOST.md'
      - '.github/workflows/lab-host-static.yml'
      - '.github/workflows/lab-host-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: LAB Host Static
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate LAB-1 manifest and PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content -Raw -LiteralPath 'lab/windows/toolchain.json' | ConvertFrom-Json
          if ($manifest.schema -ne 'mish.lab.windows-toolchain/v1') {
            throw 'Unexpected LAB-1 toolchain manifest schema.'
          }
          if ($manifest.host.runner_root -ne 'C:\mish-lab\runner') {
            throw 'Runner root contract drifted.'
          }
          if ($manifest.host.runner_custom_label -ne 'mobile-proxy-mish-lab') {
            throw 'Runner custom label contract drifted.'
          }
          if ($manifest.runner.sha256 -notmatch '^[0-9a-f]{64}$') {
            throw 'Runner SHA-256 is invalid.'
          }

          if ([string]$manifest.powershell.version -notmatch '^\d+\.\d+\.\d+$') {
            throw 'Portable PowerShell exact version is invalid.'
          }
          $expectedPowerShellAsset = 'PowerShell-{0}-win-x64.zip' -f [string]$manifest.powershell.version
          if ([string]$manifest.powershell.asset -ne $expectedPowerShellAsset) {
            throw 'Portable PowerShell asset does not match the exact version/x64 contract.'
          }
          $expectedPowerShellUrl = 'https://github.com/PowerShell/PowerShell/releases/download/v{0}/{1}' -f `
            [string]$manifest.powershell.version, [string]$manifest.powershell.asset
          if ([string]$manifest.powershell.url -ne $expectedPowerShellUrl) {
            throw 'Portable PowerShell URL does not match the official release coordinate.'
          }
          if ([string]$manifest.powershell.sha256 -notmatch '^[0-9a-f]{64}$') {
            throw 'Portable PowerShell SHA-256 is invalid.'
          }

          $expectedPlatformDir = 'android-{0}.{1}' -f [int]$manifest.android.compile_sdk, [int]$manifest.android.compile_sdk_minor
          if ([string]$manifest.android.platform_dir -ne $expectedPlatformDir) {
            throw 'Android platform directory does not match compile SDK + minor API.'
          }
          if ([string]$manifest.android.platform_package -ne ('platforms;' + $expectedPlatformDir)) {
            throw 'Android platform package does not match compile SDK + minor API.'
          }
          $sdkPackages = @($manifest.android.packages | ForEach-Object { [string]$_ })
          if (-not ($sdkPackages -contains [string]$manifest.android.platform_package)) {
            throw 'Android platform package is missing from the bootstrap install set.'
          }
          if ([int]$manifest.android.compile_sdk_minor -ne 0) {
            throw 'Current product build uses base compileSdk and therefore requires minor API 0.'
          }
          $appBuildText = Get-Content -Raw -LiteralPath 'android/app/build.gradle.kts'
          $compileSdkPattern = 'compileSdk\s*=\s*' + [regex]::Escape([string]$manifest.android.compile_sdk) + '\b'
          if ($appBuildText -notmatch $compileSdkPattern) {
            throw 'LAB Android platform coordinate drifted from the product compileSdk owner.'
          }

          foreach ($path in @(
            'lab/windows/bootstrap-windows.ps1',
            'lab/windows/host-preflight.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error "${path}: $($_.Message)" }
              throw "PowerShell parse failed for $path."
            }
          }

          $bootstrapText = Get-Content -Raw -LiteralPath 'lab/windows/bootstrap-windows.ps1'
          foreach ($required in @(
            'RunnerTokenProviderExecutable',
            'RunnerTokenProviderArgumentsJson',
            'Get-RunnerRegistrationSecureToken',
            'Runner token provider executable must be an absolute Windows path.',
            'Provider output is intentionally suppressed.',
            'Read-Host ''GitHub runner registration token'' -AsSecureString',
            'Ensure-WingetPackage',
            'required capability postcondition is not satisfied',
            'Ensure-PortablePowerShell',
            'Get-ConfiguredRunnerService',
            'Existing repository runner registration detected',
            'skipping token retrieval',
            'Restart-Service',
            'Bootstrap host dependency self-test passed.'
          )) {
            if (-not $bootstrapText.Contains($required)) {
              throw "LAB-1 bootstrap contract drifted: $required"
            }
          }
          if ($bootstrapText -match '(?i)Write-(Host|Output|Verbose|Debug).*plain(Token|ProviderToken)') {
            throw 'Bootstrap must never write plaintext runner token variables.'
          }
          if ($bootstrapText -match 'manifest\.powershell\.winget_id') {
            throw 'LAB-1 must not use WinGet/MSIX as the PowerShell service capability owner.'
          }

      - name: Verify pinned PowerShell artifact metadata upstream
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content -Raw -LiteralPath 'lab/windows/toolchain.json' | ConvertFrom-Json
          $version = [string]$manifest.powershell.version
          $assetName = [string]$manifest.powershell.asset
          $releaseUri = "https://api.github.com/repos/PowerShell/PowerShell/releases/tags/v$version"
          $headers = @{ 'User-Agent' = 'mobile-proxy-mish-lab-static' }
          $release = Invoke-RestMethod -Headers $headers -Uri $releaseUri
          $asset = @($release.assets | Where-Object { $_.name -eq $assetName })
          if ($asset.Count -ne 1) {
            throw "Pinned PowerShell asset is absent or ambiguous upstream: $assetName"
          }
          if ([string]$asset[0].browser_download_url -ne [string]$manifest.powershell.url) {
            throw 'Pinned PowerShell release URL disagrees with upstream metadata.'
          }
          $expectedDigest = 'sha256:' + ([string]$manifest.powershell.sha256).ToLowerInvariant()
          if ([string]$asset[0].digest -ne $expectedDigest) {
            throw "Pinned PowerShell SHA-256 disagrees with upstream asset digest: $($asset[0].digest)"
          }

      - name: Verify pinned Android platform exists upstream
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content -Raw -LiteralPath 'lab/windows/toolchain.json' | ConvertFrom-Json
          $package = [string]$manifest.android.platform_package
          $metadata = Join-Path $env:RUNNER_TEMP 'android-repository2-3.xml'
          $curl = Get-Command curl.exe -ErrorAction Stop
          & $curl.Source --fail --silent --show-error --location --retry 3 --retry-delay 2 `
            --output $metadata 'https://dl.google.com/android/repository/repository2-3.xml'
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to read live Android SDK repository metadata (curl exit $LASTEXITCODE)."
          }
          $repositoryText = Get-Content -Raw -LiteralPath $metadata
          $packagePattern = '<remotePackage\s+path="' + [regex]::Escape($package) + '"'
          if ($repositoryText -notmatch $packagePattern) {
            throw "Pinned Android SDK package is absent from live Google repository metadata: $package"
          }

      - name: Exercise bootstrap host dependency idempotency contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dummySha = '0' * 40
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
            -File 'lab/windows/bootstrap-windows.ps1' `
            -RepositoryCommit $dummySha `
            -SelfTest
          if ($LASTEXITCODE -ne 0) {
            throw "Bootstrap host dependency self-test failed with exit code $LASTEXITCODE."
          }

      - name: Validate physical-workflow trust and launcher boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $text = Get-Content -Raw -LiteralPath '.github/workflows/lab-host-preflight.yml'

          foreach ($forbidden in @(
            '(?m)^\s*pull_request\s*:',
            '(?m)^\s*push\s*:',
            '(?m)^\s*shell:\s*pwsh\s*$'
          )) {
            if ($text -match $forbidden) {
              throw 'Physical LAB-1 workflow violates trigger or service-PATH independence.'
            }
          }

          foreach ($required in @(
            'workflow_dispatch:',
            "github.ref == 'refs/heads/main'",
            'github.ref_protected == true',
            'runs-on: [self-hosted, windows, x64, mobile-proxy-mish-lab]',
            'persist-credentials: false',
            'shell: powershell',
            "('powershell-' + [string]$manifest.powershell.version)",
            "Join-Path $powerShellHome 'pwsh.exe'",
            "-File './lab/windows/host-preflight.ps1'"
          )) {
            if (-not $text.Contains($required)) {
              throw "Physical LAB-1 workflow is missing required trust/launcher text: $required"
            }
          }

          if ($text -match '(?i)CLOUDFLARE_API_TOKEN|R2_ACCESS_KEY|R2_SECRET|terraform\s+apply') {
            throw 'Physical LAB-1 workflow must not receive provider/R2/apply authority.'
          }
