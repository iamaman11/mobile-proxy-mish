name: Android Release Candidate

on:
  pull_request:
    paths:
      - '.github/workflows/android-release.yml'
      - 'scripts/release/**'
      - 'android/app/build.gradle.kts'
      - 'android/build.gradle.kts'
      - 'android/gradle.properties'
      - 'rust-toolchain.toml'
      - 'vendor/sing-box/release.toml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && 'rc-publish' || github.event_name == 'workflow_dispatch' && 'rc-activate' || github.ref }}
  cancel-in-progress: false

env:
  ANDROID_BUILD_TOOLS: '36.0.0'
  ANDROID_NDK_VERSION: '29.0.14206865'
  GRADLE_VERSION: '9.6.0'
  JDK_MAJOR: '17'
  RUST_TOOLCHAIN: '1.98.1'
  CARGO_NDK_VERSION: '4.1.2'

jobs:
  contract:
    name: Android Release Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test release, failed-reservation, and E3 harness identity contracts
        run: |
          python3 scripts/release/test_android_release.py
          python3 scripts/release/test_failed_rc_reservation.py
          python3 scripts/release/test_e3_harness.py

      - name: Validate pinned Android release build-tools contract
        run: |
          set -euo pipefail
          grep -Fq 'buildToolsVersion = "36.0.0"' android/app/build.gradle.kts
          grep -Fq 'ndkVersion = "29.0.14206865"' android/app/build.gradle.kts
          grep -Fq 'testBuildType = if (releaseSigningRequested) "release" else "debug"' android/app/build.gradle.kts
          grep -Eq '^mishTargetAbi=(armeabi-v7a|arm64-v8a)$' android/gradle.properties
          grep -Fq 'channel = "1.98.1"' rust-toolchain.toml

  harness-signing-contract:
    name: E3 Harness Signing Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.6.0'

      - name: Install pinned Rust Android tooling for target ABI
        shell: bash
        run: |
          set -euo pipefail
          TARGET_ABI="$(sed -n 's/^mishTargetAbi=//p' android/gradle.properties)"
          case "$TARGET_ABI" in
            armeabi-v7a) RUST_TARGET='armv7-linux-androideabi' ;;
            arm64-v8a) RUST_TARGET='aarch64-linux-android' ;;
            *) echo "Unsupported mishTargetAbi: $TARGET_ABI" >&2; exit 1 ;;
          esac
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"
          rustup target add "$RUST_TARGET"
          cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
          echo "MISH_TARGET_ABI=$TARGET_ABI" >> "$GITHUB_ENV"
          echo "MISH_RUST_TARGET=$RUST_TARGET" >> "$GITHUB_ENV"

      - name: Install pinned Android test tooling
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK root is not configured}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "build-tools;$ANDROID_BUILD_TOOLS" "ndk;$ANDROID_NDK_VERSION"
          test -x "$SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS/apksigner"
          test -d "$SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Create ephemeral non-production signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/lab3-contract.keystore"
          KEY_PASSWORD='lab3-ephemeral-contract-only'
          keytool -genkeypair \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEY_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias lab3-contract \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname 'CN=MISH LAB-3 Ephemeral Contract,O=CI,C=ZZ' \
            -noprompt
          chmod 600 "$KEYSTORE_PATH"
          echo "MISH_RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "MISH_RELEASE_STORE_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "MISH_RELEASE_KEY_ALIAS=lab3-contract" >> "$GITHUB_ENV"
          echo "MISH_RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo 'MISH_RELEASE_VERSION_NAME=0.1.0' >> "$GITHUB_ENV"
          echo 'MISH_RELEASE_VERSION_CODE=1000003' >> "$GITHUB_ENV"

      - name: Prove release variant, unit tests, target ABI, and same-certificate E3 harness
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache -p android \
            :app:testReleaseUnitTest \
            :app:assembleRelease \
            :app:assembleReleaseAndroidTest

          PRODUCT_APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$PRODUCT_APK"
          mapfile -t TEST_APKS < <(find android/app/build/outputs/apk/androidTest -type f -name '*-androidTest.apk' -print)
          [[ "${#TEST_APKS[@]}" -eq 1 ]]
          TEST_APK="${TEST_APKS[0]}"
          unzip -l "$PRODUCT_APK" | grep -Fq "lib/$MISH_TARGET_ABI/libmish_android_ffi.so"
          unzip -l "$PRODUCT_APK" | grep -Fq "lib/$MISH_TARGET_ABI/libjnidispatch.so"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK root is not configured}}"
          APKSIGNER="$SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS/apksigner"
          product_cert="$($APKSIGNER verify --print-certs "$PRODUCT_APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test_cert="$($APKSIGNER verify --print-certs "$TEST_APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$product_cert" =~ ^[0-9a-f]{64}$ ]]
          [[ "$test_cert" == "$product_cert" ]]

          python3 scripts/release/e3_harness.py manifest \
            --tag v0.1.0-rc.3 \
            --source-commit aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --product-apk "$PRODUCT_APK" \
            --test-apk "$TEST_APK" \
            --product-cert-sha256 "$product_cert" \
            --test-cert-sha256 "$test_cert" \
            --output "$RUNNER_TEMP/e3-harness-contract.json"
          python3 scripts/release/e3_harness.py verify \
            --manifest "$RUNNER_TEMP/e3-harness-contract.json" \
            --tag v0.1.0-rc.3 \
            --source-commit aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --signing-cert-sha256 "$product_cert" \
            --product-apk "$PRODUCT_APK" \
            --test-apk "$TEST_APK"

      - name: Remove ephemeral signing key
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/lab3-contract.keystore"

  prepare-rc:
    name: Prepare zero-input Android RC
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs: [contract, harness-signing-contract]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      rc_tag: ${{ steps.candidate.outputs.tag }}
      source_sha: ${{ steps.candidate.outputs.source_sha }}
      previous_tag: ${{ steps.candidate.outputs.previous_tag }}
    steps:
      - name: Checkout exact authorized main candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate main and allocate machine-owned RC identity
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]]

          git fetch --tags origin
          git tag --list 'v*-rc.*' > "$RUNNER_TEMP/rc-tags.txt"
          python3 scripts/release/android_release.py next-rc \
            --tags-file "$RUNNER_TEMP/rc-tags.txt" \
            --github-output "$GITHUB_OUTPUT"
          echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Validate previous immutable RC reservation and target absence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RC_TAG: ${{ steps.candidate.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.candidate.outputs.previous_tag }}
        run: |
          set -euo pipefail
          if [[ -n "$PREVIOUS_TAG" ]]; then
            if RELEASE_META="$(gh release view "$PREVIOUS_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json tagName,isDraft,isPrerelease \
              --jq '[.tagName, .isDraft, .isPrerelease] | @tsv' 2>/dev/null)"; then
              IFS=$'\t' read -r RELEASE_TAG IS_DRAFT IS_PRERELEASE <<< "$RELEASE_META"
              [[ "$RELEASE_TAG" == "$PREVIOUS_TAG" ]]
              [[ "$IS_DRAFT" == "false" ]]
              [[ "$IS_PRERELEASE" == "true" ]]
              echo "Previous RC is a published immutable prerelease: $PREVIOUS_TAG"
            else
              PREVIOUS_REF="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$PREVIOUS_TAG" \
                --jq '[.object.type, .object.sha] | @tsv')"
              IFS=$'\t' read -r PREVIOUS_TYPE PREVIOUS_SHA <<< "$PREVIOUS_REF"
              [[ "$PREVIOUS_TYPE" == "commit" ]]
              [[ "$PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ ]]
              git merge-base --is-ancestor "$PREVIOUS_SHA" origin/main

              RUNS_JSON="$RUNNER_TEMP/previous-rc-runs.json"
              JOBS_JSON="$RUNNER_TEMP/previous-rc-jobs.json"
              gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/android-release.yml/runs?event=workflow_dispatch&status=completed&head_sha=$PREVIOUS_SHA&per_page=100" \
                > "$RUNS_JSON"

              RUN_TOTAL="$(python3 - "$RUNS_JSON" <<'PY'
          import json
          import sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          print(data.get("total_count", -1))
          PY
              )"
              [[ "$RUN_TOTAL" =~ ^[0-9]+$ ]]
              (( RUN_TOTAL <= 100 ))

              FAILED_RUN_ID="$(python3 - "$RUNS_JSON" "$PREVIOUS_TAG" "$PREVIOUS_SHA" <<'PY'
          import json
          import sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          tag, sha = sys.argv[2], sys.argv[3]
          matches = [
              run for run in data.get("workflow_runs", [])
              if run.get("name") == "Android Release Candidate"
              and run.get("path") == ".github/workflows/android-release.yml"
              and run.get("head_branch") == tag
              and run.get("head_sha") == sha
              and run.get("event") == "workflow_dispatch"
              and run.get("status") == "completed"
              and run.get("conclusion") == "failure"
              and (run.get("actor") or {}).get("login") == "github-actions[bot]"
          ]
          if len(matches) != 1:
              raise SystemExit(1)
          print(matches[0]["id"])
          PY
              )"
              [[ "$FAILED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RUN_ID/jobs?per_page=100" > "$JOBS_JSON"

              python3 scripts/release/failed_rc_reservation.py \
                --tag "$PREVIOUS_TAG" \
                --tag-sha "$PREVIOUS_SHA" \
                --runs-json "$RUNS_JSON" \
                --jobs-json "$JOBS_JSON"

              echo "Previous RC is a verified failed machine-owned unpublished reservation: $PREVIOUS_TAG"
            fi
          fi

          if git show-ref --verify --quiet "refs/tags/$RC_TAG"; then
            echo "Target RC tag already exists: $RC_TAG" >&2
            exit 1
          fi
          if gh release view "$RC_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Target RC Release already exists: $RC_TAG" >&2
            exit 1
          fi

      - name: Publish read-only READY projection
        shell: bash
        env:
          RC_TAG: ${{ steps.candidate.outputs.tag }}
          SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
          PREVIOUS_TAG: ${{ steps.candidate.outputs.previous_tag }}
        run: |
          {
            echo '### Android RC READY'
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Machine-owned RC tag: \`$RC_TAG\`"
            echo "- Previous RC reservation: \`${PREVIOUS_TAG:-NONE}\`"
            echo '- Authorization: **zero-input workflow dispatch on protected main**'
            echo '- Production signing key: **not materialized in READY projection**'
          } >> "$GITHUB_STEP_SUMMARY"

  activate-rc:
    name: Activate machine-owned Android RC tag
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs: prepare-rc
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      RC_TAG: ${{ needs.prepare-rc.outputs.rc_tag }}
      SOURCE_SHA: ${{ needs.prepare-rc.outputs.source_sha }}
    steps:
      - name: Checkout exact authorized main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-rc.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Freeze machine-owned tag and dispatch tag-scoped release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]

          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "$SOURCE_SHA" ]]

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RC_TAG" >/dev/null 2>&1; then
            echo "Target RC tag already exists: $RC_TAG" >&2
            exit 1
          fi
          if gh release view "$RC_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Target RC Release already exists: $RC_TAG" >&2
            exit 1
          fi

          created=0
          rollback_tag() {
            if [[ "$created" == "1" ]]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$RC_TAG" >/dev/null || true
            fi
          }
          trap rollback_tag ERR

          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RC_TAG" \
            -f "sha=$SOURCE_SHA" > "$RUNNER_TEMP/created-rc-ref.json"
          created=1

          TAG_META="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RC_TAG" \
            --jq '[.object.type, .object.sha] | @tsv')"
          IFS=$'\t' read -r TAG_TYPE TAG_SHA <<< "$TAG_META"
          [[ "$TAG_TYPE" == "commit" ]]
          [[ "$TAG_SHA" == "$SOURCE_SHA" ]]

          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/android-release.yml/dispatches" \
            -f "ref=$RC_TAG"

          trap - ERR

          {
            echo '### Android RC ACTIVATED'
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Machine-owned RC tag: \`$RC_TAG\`"
            echo '- Next execution: **automatic tag-scoped workflow_dispatch**'
            echo '- Production signing key on activation job: **NO**'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-rc:
    name: Publish immutable Android RC
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' }}
    needs: [contract, harness-signing-contract]
    runs-on: ubuntu-latest
    environment: android-release
    permissions:
      contents: write
    env:
      RC_TAG: ${{ github.ref_name }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact machine-owned tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate exact tag candidate and release identity
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$GITHUB_REF" == "refs/tags/$RC_TAG" ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          python3 scripts/release/android_release.py derive \
            --tag "$RC_TAG" \
            --github-output "$GITHUB_OUTPUT"

          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main

          TAG_META="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RC_TAG" \
            --jq '[.object.type, .object.sha] | @tsv')"
          IFS=$'\t' read -r TAG_TYPE TAG_SHA <<< "$TAG_META"
          [[ "$TAG_TYPE" == "commit" ]]
          [[ "$TAG_SHA" == "$SOURCE_SHA" ]]

          if gh release view "$RC_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Target RC Release already exists: $RC_TAG" >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.6.0'

      - name: Install pinned Rust Android tooling for target ABI
        shell: bash
        run: |
          set -euo pipefail
          TARGET_ABI="$(sed -n 's/^mishTargetAbi=//p' android/gradle.properties)"
          case "$TARGET_ABI" in
            armeabi-v7a) RUST_TARGET='armv7-linux-androideabi' ;;
            arm64-v8a) RUST_TARGET='aarch64-linux-android' ;;
            *) echo "Unsupported mishTargetAbi: $TARGET_ABI" >&2; exit 1 ;;
          esac
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"
          rustup target add "$RUST_TARGET"
          cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
          echo "MISH_TARGET_ABI=$TARGET_ABI" >> "$GITHUB_ENV"
          echo "MISH_RUST_TARGET=$RUST_TARGET" >> "$GITHUB_ENV"

      - name: Install pinned Android release tooling
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK root is not configured}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" \
            "build-tools;$ANDROID_BUILD_TOOLS" \
            "ndk;$ANDROID_NDK_VERSION"
          test -x "$SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS/apksigner"
          test -x "$SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS/aapt"
          test -d "$SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Materialize restricted release signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.MISH_ANDROID_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.MISH_ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MISH_ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MISH_ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$KEYSTORE_B64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [[ -z "$value" ]]; then
              echo 'Android release signing secrets are incomplete.' >&2
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/mish-android-release.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "MISH_RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build and sign release candidate once with matching E3 harness
        shell: bash
        env:
          MISH_RELEASE_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          MISH_RELEASE_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          MISH_RELEASE_STORE_PASSWORD: ${{ secrets.MISH_ANDROID_RELEASE_STORE_PASSWORD }}
          MISH_RELEASE_KEY_ALIAS: ${{ secrets.MISH_ANDROID_RELEASE_KEY_ALIAS }}
          MISH_RELEASE_KEY_PASSWORD: ${{ secrets.MISH_ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache -p android \
            :app:lintRelease \
            :app:testReleaseUnitTest \
            :app:assembleRelease \
            :app:assembleReleaseAndroidTest

      - name: Verify exact signed APKs and generate manifests
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK root is not configured}}"
          APKSIGNER="$SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS/apksigner"
          AAPT="$SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS/aapt"
          BUILT_APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$BUILT_APK"
          mapfile -t TEST_APKS < <(find android/app/build/outputs/apk/androidTest -type f -name '*-androidTest.apk' -print)
          [[ "${#TEST_APKS[@]}" -eq 1 ]]
          BUILT_TEST_APK="${TEST_APKS[0]}"
          unzip -l "$BUILT_APK" | grep -Fq "lib/$MISH_TARGET_ABI/libmish_android_ffi.so"
          unzip -l "$BUILT_APK" | grep -Fq "lib/$MISH_TARGET_ABI/libjnidispatch.so"

          PRODUCT_CERTS="$RUNNER_TEMP/product-apk-certs.txt"
          TEST_CERTS="$RUNNER_TEMP/test-apk-certs.txt"
          "$APKSIGNER" verify --verbose --print-certs "$BUILT_APK" > "$PRODUCT_CERTS"
          "$APKSIGNER" verify --verbose --print-certs "$BUILT_TEST_APK" > "$TEST_CERTS"
          CERT_SHA256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$PRODUCT_CERTS" | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          TEST_CERT_SHA256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$TEST_CERTS" | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$CERT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$TEST_CERT_SHA256" == "$CERT_SHA256" ]]

          BADGING="$("$AAPT" dump badging "$BUILT_APK" | head -n 1)"
          grep -Fq "versionName='${{ steps.version.outputs.version_name }}'" <<< "$BADGING"
          grep -Fq "versionCode='${{ steps.version.outputs.version_code }}'" <<< "$BADGING"

          mkdir -p dist "$RUNNER_TEMP/e3-harness"
          APK_NAME="mobile-proxy-mish-${RC_TAG}.apk"
          MANIFEST_NAME="mobile-proxy-mish-${RC_TAG}.release.json"
          TEST_APK_NAME="mobile-proxy-mish-${RC_TAG}-e3-androidTest.apk"
          HARNESS_MANIFEST_NAME="mobile-proxy-mish-${RC_TAG}-e3-harness.json"
          cp "$BUILT_APK" "dist/$APK_NAME"
          cp "$BUILT_TEST_APK" "$RUNNER_TEMP/e3-harness/$TEST_APK_NAME"

          python3 scripts/release/android_release.py manifest \
            --tag "$RC_TAG" \
            --source-commit "$SOURCE_SHA" \
            --apk "dist/$APK_NAME" \
            --signing-cert-sha256 "$CERT_SHA256" \
            --jdk-major "$JDK_MAJOR" \
            --gradle "$GRADLE_VERSION" \
            --android-build-tools "$ANDROID_BUILD_TOOLS" \
            --android-ndk "$ANDROID_NDK_VERSION" \
            --rust "$RUST_TOOLCHAIN" \
            --cargo-ndk "$CARGO_NDK_VERSION" \
            --output "dist/$MANIFEST_NAME"

          python3 scripts/release/android_release.py verify \
            --tag "$RC_TAG" \
            --manifest "dist/$MANIFEST_NAME" \
            --apk "dist/$APK_NAME" \
            --expected-source-commit "$SOURCE_SHA"

          python3 scripts/release/e3_harness.py manifest \
            --tag "$RC_TAG" \
            --source-commit "$SOURCE_SHA" \
            --product-apk "dist/$APK_NAME" \
            --test-apk "$RUNNER_TEMP/e3-harness/$TEST_APK_NAME" \
            --product-cert-sha256 "$CERT_SHA256" \
            --test-cert-sha256 "$TEST_CERT_SHA256" \
            --output "$RUNNER_TEMP/e3-harness/$HARNESS_MANIFEST_NAME"
          python3 scripts/release/e3_harness.py verify \
            --manifest "$RUNNER_TEMP/e3-harness/$HARNESS_MANIFEST_NAME" \
            --tag "$RC_TAG" \
            --source-commit "$SOURCE_SHA" \
            --signing-cert-sha256 "$CERT_SHA256" \
            --product-apk "dist/$APK_NAME" \
            --test-apk "$RUNNER_TEMP/e3-harness/$TEST_APK_NAME"

          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "manifest_name=$MANIFEST_NAME" >> "$GITHUB_OUTPUT"
          echo "test_apk_name=$TEST_APK_NAME" >> "$GITHUB_OUTPUT"
          echo "harness_manifest_name=$HARNESS_MANIFEST_NAME" >> "$GITHUB_OUTPUT"
          echo "product_cert_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Publish immutable versioned prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RC_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists for $RC_TAG; refusing mutable replacement." >&2
            exit 1
          fi
          gh release create "$RC_TAG" \
            "dist/${{ steps.artifact.outputs.apk_name }}" \
            "dist/${{ steps.artifact.outputs.manifest_name }}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "$RC_TAG" \
            --notes "Immutable Android release candidate. Physical acceptance must reference this exact tag and APK digest; stable promotion must reuse the same signed product bytes. E3 harness is separate test-only Actions evidence."

      - name: Read back exact published RC bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_META="$(gh release view "$RC_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease \
            --jq '[.tagName, .isDraft, .isPrerelease] | @tsv')"
          IFS=$'\t' read -r RELEASE_TAG IS_DRAFT IS_PRERELEASE <<< "$RELEASE_META"
          [[ "$RELEASE_TAG" == "$RC_TAG" ]]
          [[ "$IS_DRAFT" == "false" ]]
          [[ "$IS_PRERELEASE" == "true" ]]

          TAG_META="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RC_TAG" \
            --jq '[.object.type, .object.sha] | @tsv')"
          IFS=$'\t' read -r TAG_TYPE TAG_SHA <<< "$TAG_META"
          [[ "$TAG_TYPE" == "commit" ]]
          [[ "$TAG_SHA" == "$SOURCE_SHA" ]]

          READBACK="$RUNNER_TEMP/android-release-readback"
          mkdir -p "$READBACK"
          gh release download "$RC_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "${{ steps.artifact.outputs.apk_name }}" \
            --dir "$READBACK"
          gh release download "$RC_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "${{ steps.artifact.outputs.manifest_name }}" \
            --dir "$READBACK"

          cmp "dist/${{ steps.artifact.outputs.apk_name }}" \
            "$READBACK/${{ steps.artifact.outputs.apk_name }}"
          cmp "dist/${{ steps.artifact.outputs.manifest_name }}" \
            "$READBACK/${{ steps.artifact.outputs.manifest_name }}"

          python3 scripts/release/android_release.py verify \
            --tag "$RC_TAG" \
            --manifest "$READBACK/${{ steps.artifact.outputs.manifest_name }}" \
            --apk "$READBACK/${{ steps.artifact.outputs.apk_name }}" \
            --expected-source-commit "$SOURCE_SHA"

      - name: Upload bounded same-certificate E3 harness
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e3-harness-${{ github.ref_name }}
          path: ${{ runner.temp }}/e3-harness
          if-no-files-found: error
          retention-days: 7

      - name: Publish bounded release summary
        shell: bash
        run: |
          {
            echo '### Android RC + E3 harness'
            echo "- RC tag: \`$RC_TAG\`"
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Product ABI: \`$MISH_TARGET_ABI\`"
            echo "- Product signing cert SHA-256: \`${{ steps.artifact.outputs.product_cert_sha256 }}\`"
            echo '- Authorization: **one zero-input main dispatch; tag transition is machine-owned**'
            echo '- Protected release execution: **automatic tag-scoped workflow_dispatch**'
            echo '- Product Release assets: **APK + release manifest only**'
            echo '- E3 harness: **separate test-only Actions artifact, 7-day retention**'
            echo '- E3 harness signing certificate: **same as product APK**'
            echo '- Physical Windows release build/signing: **NO**'
          } >> "$GITHUB_STEP_SUMMARY"
