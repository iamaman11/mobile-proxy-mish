name: Temporary Rustfmt Cleanup

on:
  push:
    branches: [m1/arch-rustfmt-cleanup]

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout formatting branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: m1/arch-rustfmt-cleanup
          fetch-depth: 0

      - name: Install exact Rust formatter
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          rustup override set 1.98.1

      - name: Format and remove temporary workflow
        run: |
          set -euo pipefail
          cargo fmt --all
          rm .github/workflows/temp-rustfmt-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'M1 architecture: apply pinned rustfmt cleanup'
          git push origin HEAD:m1/arch-rustfmt-cleanup
