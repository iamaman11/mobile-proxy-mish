name: Temporary Access Isolated Instrumentation Fixture

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
    paths:
      - 'android/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/temporary-access-isolated-build.yml'

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: temporary-isolated-fixture-${{ github.event.pull_request.number }}
  # A newer PR event must not kill on-device cleanup/final integrity checks.
  cancel-in-progress: false

jobs:
  fixture:
    name: Build isolated on-device test APKs (NO install)
    if: >-
      ${{ github.event.pull_request.number == 464 &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.base.ref == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RUST_TOOLCHAIN: '1.98.1'
      CARGO_NDK_VERSION: '4.1.2'
      ANDROID_NDK_VERSION: '29.0.14206865'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Pinned Gradle 9.6
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.6.0'
      - name: Restore narrow Rust/NDK build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-ndk
            target
          key: temp-fixture-${{ runner.os }}-android-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/**/*.rs', 'android/**/*.gradle.kts') }}
          restore-keys: |
            pr-validation-${{ runner.os }}-full-android-29.0.14206865-1.98.1-
      - name: Rust host + Android ABI tools
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"
          ABI="$(sed -n 's/^mishTargetAbi=//p' android/gradle.properties)"
          test "$ABI" = 'armeabi-v7a'
          rustup target add armv7-linux-androideabi --toolchain "$RUST_TOOLCHAIN"
          if ! cargo ndk --version 2>/dev/null | grep -Fq "$CARGO_NDK_VERSION"; then
            cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
          fi
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK root is not configured}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          NDK_PATH="$SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          test -x "$SDKMANAGER"
          if [[ ! -d "$NDK_PATH" ]]; then
            "$SDKMANAGER" "ndk;$ANDROID_NDK_VERSION"
          fi
          test -d "$NDK_PATH"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK_PATH" >> "$GITHUB_ENV"
      - name: Build disposable app and isolated instrumentation APK
        run: >-
          gradle --no-daemon -p android -PmishIsolatedInstrumentedTest=true
          :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Refuse shipping application ID; verify exact candidate artifact hashes
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          TEST="android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          test -s "$APK" && test -s "$TEST"
          AAPT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/36.0.0/aapt"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.mobileproxymish.app.isolated.debug'"
          "$AAPT" dump badging "$TEST" | grep -F "package: name='com.mobileproxymish.app.isolated.debug.test'"
          mkdir -p "$RUNNER_TEMP/isolated"
          cp "$APK" "$RUNNER_TEMP/isolated/disposable-app.apk"
          cp "$TEST" "$RUNNER_TEMP/isolated/disposable-androidTest.apk"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'isolated'
          fields = {name:hashlib.sha256((root/name).read_bytes()).hexdigest()
                    for name in ('disposable-app.apk','disposable-androidTest.apk')}
          data = {'schema':'mish-temporary-isolated-fixture-v1',
                  'source_sha':os.environ['SOURCE_SHA'],
                  'pr_number':int(os.environ['PR_NUMBER']),
                  'application_id':'com.mobileproxymish.app.isolated.debug',
                  'no_production_install':True, 'sha256':fields}
          (root/'manifest.json').write_text(json.dumps(data,sort_keys=True),encoding='utf-8')
          PY
      - name: Publish disposable test fixture only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: temporary-isolated-fixture-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/isolated
          if-no-files-found: error
          retention-days: 3

  static-physical-harness:
    name: Parse bounded physical test harness (NO device)
    if: ${{ github.event.pull_request.number == 464 }}
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Parse PowerShell harness before any physical opt-in
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $PWD 'lab/windows/test-temporary-isolated-physical.ps1'
          $tokens = $null
          $parseErrors = $null
          [void][Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors)
          if (@($parseErrors).Count -gt 0) {
            throw 'Isolated harness has a PowerShell parse failure.'
          }
          $content = Get-Content -Raw -LiteralPath $path
          if ($content -notmatch "com\.mobileproxymish\.app\.isolated\.debug" -or
              $content -notmatch "collect-device-diagnostic.ps1" -or
              $content -notmatch "TEMP_ISOLATED_PHYSICAL=PASS") {
            throw 'Isolated harness must contain unique package and pre/post diagnostic checks.'
          }

  device-isolated:
    name: DEVICE-1 isolated temporary access tests (EXPLICIT opt-in)
    needs: [fixture, static-physical-harness]
    if: >-
      ${{ needs.fixture.result == 'success' &&
          needs.static-physical-harness.result == 'success' &&
          github.event.pull_request.number == 464 &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          contains(github.event.pull_request.body,
            format('[physical-isolated:{0}]', github.event.pull_request.head.sha)) }}
    runs-on: [self-hosted, windows, x64, mobile-proxy-mish-lab]
    timeout-minutes: 25
    concurrency:
      group: device-cycle
      cancel-in-progress: false
    steps:
      - name: Checkout exact candidate harness (no PRODUCT install)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Revalidate ready PR and successful exact-head full CI
        shell: 'C:\mish-lab\tools\powershell-7.6.6\pwsh.exe -NoLogo -NoProfile -NonInteractive -Command "& ([ScriptBlock]::Create((Get-Content -Raw -LiteralPath ''{0}'')))"'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $pr = Invoke-RestMethod -Headers $headers -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/pulls/464"
          if ([string]$pr.state -cne 'open' -or [bool]$pr.draft -or
              [string]$pr.head.sha -cne $env:EXPECTED_SHA -or
              [string]$pr.base.ref -cne 'main' -or
              [string]$pr.head.repo.full_name -cne $env:GITHUB_REPOSITORY) {
            throw 'TEMP_ISOLATED|PR_PROVENANCE_CHANGED'
          }
          $ci = Invoke-RestMethod -Headers $headers -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/runs?event=pull_request&head_sha=$env:EXPECTED_SHA&per_page=100"
          $passed = @($ci.workflow_runs | Where-Object {
            $_.name -ceq 'PR Validation + PRODUCT Candidate' -and
            $_.head_sha -ceq $env:EXPECTED_SHA -and
            $_.status -ceq 'completed' -and
            $_.conclusion -ceq 'success'
          })
          if ($passed.Count -lt 1) {
            throw 'TEMP_ISOLATED|FULL_EXACT_HEAD_CI_NOT_GREEN'
          }
          Write-Host 'TEMP_ISOLATED|EXACT_HEAD_HOSTED_PREREQS=PASS'
      - name: Download only disposable test APKs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: temporary-isolated-fixture-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}\mish-isolated-fixture
      - name: Install and execute disposable test UID; verify original PRODUCT before/after
        shell: 'C:\mish-lab\tools\powershell-7.6.6\pwsh.exe -NoLogo -NoProfile -NonInteractive -Command "& ([ScriptBlock]::Create((Get-Content -Raw -LiteralPath ''{0}'')))"'
        run: |
          $ErrorActionPreference = 'Stop'
          .\lab\windows\test-temporary-isolated-physical.ps1 -FixtureDirectory "$env:RUNNER_TEMP\mish-isolated-fixture" -ExpectedPrNumber 464 -ExpectedSourceSha '${{ github.event.pull_request.head.sha }}'
