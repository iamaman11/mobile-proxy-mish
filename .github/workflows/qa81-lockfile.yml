name: QA81 Lockfile Regeneration

on:
  push:
    branches: [qa/81-remediation]
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/android-ffi/Cargo.toml
      - .github/workflows/qa81-lockfile.yml

permissions:
  contents: write

concurrency:
  group: qa81-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: qa/81-remediation
          fetch-depth: 0

      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup override set 1.98.1

      - name: Regenerate and commit only Cargo.lock
        run: |
          set -euo pipefail
          before="$(git rev-parse HEAD)"
          cargo generate-lockfile
          changed="$(git status --short)"
          if [[ -z "$changed" ]]; then
            echo 'Cargo.lock already current.'
            exit 0
          fi
          if [[ "$changed" != ' M Cargo.lock' ]]; then
            echo "Unexpected generated changes:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'Regenerate Cargo.lock for Android runtime composition'
          git push origin HEAD:qa/81-remediation
          echo "QA81_LOCK_BASE=$before"
          echo "QA81_LOCK_HEAD=$(git rev-parse HEAD)"
