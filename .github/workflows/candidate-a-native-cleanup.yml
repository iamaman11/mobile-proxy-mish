name: Candidate A Native Cleanup

on:
  push:
    branches:
      - rotation/candidate-a-product
    paths:
      - .github/workflows/candidate-a-native-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: rotation/candidate-a-product
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.98.1

      - name: Apply exact asserted cleanup
        run: python3 tools/apply_candidate_a_native_cleanup.py

      - name: Format Rust
        run: cargo fmt --all

      - name: Verify architecture
        run: python3 tools/check_architecture.py

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Verify clean patch
        run: |
          git diff --check
          git status --short
          test ! -e crates/runtime/src/airplane_effect.rs
          test ! -e tools/check_architecture_legacy.py
          test ! -e tools/apply_candidate_a_native_cleanup.py
          test ! -e .github/workflows/candidate-a-native-cleanup.yml

      - name: Commit validated cleanup
        run: |
          git config user.name "iamaman11"
          git config user.email "44100369+iamaman11@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'cleanup produced no changes' >&2; exit 1; }
          git commit -m "Rotation: tighten Candidate A native restore semantics"
          git push origin HEAD:rotation/candidate-a-product
