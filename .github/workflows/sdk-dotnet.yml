name: SDK .NET

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'sdk/dotnet/**'
      - '.github/workflows/sdk-dotnet.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-dotnet-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  contract:
    name: .NET Consumer Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Build SDK
        shell: bash
        run: |
          set -euo pipefail
          dotnet build \
            sdk/dotnet/Mish.Control/Mish.Control.csproj \
            --configuration Release

      - name: Run SDK contract tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet run \
            --project sdk/dotnet/Mish.Control.ContractTests/Mish.Control.ContractTests.csproj \
            --configuration Release
