name: QA81 Bridge Claim Field Repair

on:
  push:
    branches: [qa/81-remediation]

permissions:
  contents: write

concurrency:
  group: qa81-bridge-claim-field-repair
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: qa/81-remediation
          fetch-depth: 0
      - name: Repair claim ownership placement
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/android-ffi/src/lib.rs')
          text = path.read_text()
          controller = "pub struct CellularController {\n    owner: Arc<Mutex<CellularEgress>>,\n    bridge_claimed: Arc<AtomicBool>,\n    claim_released: AtomicBool,\n}"
          fixed_controller = "pub struct CellularController {\n    owner: Arc<Mutex<CellularEgress>>,\n    bridge_claimed: Arc<AtomicBool>,\n}"
          runtime = "pub struct CellularBridgeRuntime {\n    port: u16,\n    wake_address: SocketAddr,\n    stop_requested: Arc<AtomicBool>,\n    healthy: Arc<AtomicBool>,\n    active_sessions: Arc<AtomicUsize>,\n    clients: Arc<Mutex<HashMap<u64, TcpStream>>>,\n    accept_thread: Mutex<Option<JoinHandle<()>>>,\n    bridge_claimed: Arc<AtomicBool>,\n}"
          fixed_runtime = "pub struct CellularBridgeRuntime {\n    port: u16,\n    wake_address: SocketAddr,\n    stop_requested: Arc<AtomicBool>,\n    healthy: Arc<AtomicBool>,\n    active_sessions: Arc<AtomicUsize>,\n    clients: Arc<Mutex<HashMap<u64, TcpStream>>>,\n    accept_thread: Mutex<Option<JoinHandle<()>>>,\n    bridge_claimed: Arc<AtomicBool>,\n    claim_released: AtomicBool,\n}"
          assert controller in text, 'misplaced controller field not found'
          assert runtime in text, 'runtime struct anchor not found'
          text = text.replace(controller, fixed_controller, 1)
          text = text.replace(runtime, fixed_runtime, 1)
          assert text.count('claim_released: AtomicBool,') == 1
          assert 'claim_released: AtomicBool::new(false),' in text
          assert 'stopped_bridge_drop_cannot_release_replacement_claim' in text
          path.write_text(text)
          PY
          cargo fmt --all --check
          cargo check -p mish-android-ffi --locked
          cargo test -p mish-android-ffi --locked
          git diff --check
          test "$(git status --short | wc -l)" -eq 1
          git status --short | grep -Fq 'crates/android-ffi/src/lib.rs'
      - name: Commit source fix only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/android-ffi/src/lib.rs
          git commit -m 'Runtime: bind bridge claim release to runtime instance'
          git push origin HEAD:qa/81-remediation
