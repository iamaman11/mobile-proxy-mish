name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: '1.98.1'
  CARGO_NDK_VERSION: '4.1.2'
  ANDROID_NDK_VERSION: '29.0.14206865'
  GRADLE_VERSION: '9.6.0'

jobs:
  architecture:
    name: Architecture + Delivery Guards
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.base.ref == 'main' && github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify accepted architecture invariants
        run: python3 tools/check_architecture.py

      - name: Verify delivery and CI invariants
        run: python3 tools/check_delivery_contract.py

      - name: Verify capacity probe held-session contract
        shell: pwsh
        run: ./lab/windows/test-capacity-probe-contract.ps1

      - name: Verify diagnostic protocol probe helpers
        shell: pwsh
        run: ./lab/windows/test-diagnostic-connect-probe.ps1

      - name: Verify physical protocol parity contract
        shell: pwsh
        run: ./lab/windows/test-protocol-parity-probe-contract.ps1

  changes:
    name: PRODUCT Change Classification
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.base.ref == 'main' && github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    outputs:
      product_changed: ${{ steps.classify.outputs.product_changed }}
    steps:
      - name: Checkout exact PR head and history
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify PRODUCT/build changes
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != 'pull_request' ]]; then
            echo 'product_changed=true' >> "$GITHUB_OUTPUT"
            echo 'PRODUCT_CHANGED=true (explicit workflow_dispatch)'
            exit 0
          fi

          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"

          product_changed=false
          while IFS= read -r path; do
            case "$path" in
              android/*|crates/*|config/*|contracts/*|Cargo.toml|Cargo.lock|rust-toolchain.toml)
                product_changed=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          echo "product_changed=$product_changed" >> "$GITHUB_OUTPUT"
          echo "PRODUCT_CHANGED=$product_changed"

  rust:
    name: Rust Workspace
    needs: [architecture, changes]
    if: ${{ needs.architecture.result == 'success' && needs.changes.outputs.product_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup override set "$RUST_TOOLCHAIN"

      - name: Rust format, lint and tests
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Generate and verify native UniFFI contract
        run: |
          set -euo pipefail
          cargo build -p mish-android-ffi --locked
          rm -rf target/uniffi-kotlin
          cargo run -p mish-android-ffi --bin uniffi-bindgen --locked -- \
            generate --library target/debug/libmish_android_ffi.so \
            --language kotlin --out-dir target/uniffi-kotlin --no-format
          GENERATED="target/uniffi-kotlin/com/mobileproxymish/ffi/mish_android_ffi.kt"
          test -f "$GENERATED"
          grep -q '^package com.mobileproxymish.ffi$' "$GENERATED"
          for symbol in \
            NativeProductRuntime \
            NativeCellularPolicyObserver \
            NativeReadinessObserver \
            NativeProxyRuntimeObserver \
            RuntimeLifecycleSnapshotView \
            ProxyRuntimePublicationView; do
            grep -Fq "$symbol" "$GENERATED"
          done
          for forbidden in \
            CellularController \
            MeshTransportController \
            RuntimeLifecycleController \
            startNativeProxyRuntime \
            proxyServingFailureRecoverable \
            proxyListenerPorts \
            CellularNetworkLease \
            admittedNetworkLease \
            bindSocket \
            resolveHost \
            RuntimeProcessLifecycleController \
            ProxyServingLifecycleController \
            PrivateBridge; do
            if grep -Fq "$forbidden" "$GENERATED"; then
              echo "obsolete or uncontrolled API leaked into UniFFI surface: $forbidden" >&2
              exit 1
            fi
          done
          if grep -Eq '(^|[^[:alnum:]_])NativeProxyRuntime([^[:alnum:]_]|$)' "$GENERATED"; then
            echo 'obsolete NativeProxyRuntime control object leaked into UniFFI surface' >&2
            exit 1
          fi

  android:
    name: Android Compose Shell
    needs: [architecture, changes]
    if: ${{ needs.architecture.result == 'success' && needs.changes.outputs.product_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Install pinned Rust Android tooling for target ABI
        run: |
          set -euo pipefail
          TARGET_ABI="$(sed -n 's/^mishTargetAbi=//p' android/gradle.properties)"
          case "$TARGET_ABI" in
            armeabi-v7a) RUST_TARGET='armv7-linux-androideabi' ;;
            arm64-v8a) RUST_TARGET='aarch64-linux-android' ;;
            *) echo "Unsupported mishTargetAbi: $TARGET_ABI" >&2; exit 1 ;;
          esac
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"
          rustup target add "$RUST_TARGET"
          cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
          echo "MISH_TARGET_ABI=$TARGET_ABI" >> "$GITHUB_ENV"

      - name: Install pinned Android NDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK root is not configured}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          NDK_PATH="$SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          test -x "$SDKMANAGER"
          if [[ ! -d "$NDK_PATH" ]]; then
            "$SDKMANAGER" "ndk;$ANDROID_NDK_VERSION"
          fi
          test -d "$NDK_PATH"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Lint, unit test and assemble Android shell + physical test APK
        run: |
          gradle --no-daemon -p android \
            :app:lintDebug \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest

      - name: Verify packaged native runtime and narrow UniFFI surface
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          TEST_APK="android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          NATIVE="android/app/build/generated/rust-jni/$MISH_TARGET_ABI/libmish_android_ffi.so"
          GENERATED="android/app/build/generated/uniffi/kotlin/com/mobileproxymish/ffi/mish_android_ffi.kt"
          test -f "$APK"
          test -f "$TEST_APK"
          test -f "$NATIVE"
          test -f "$GENERATED"
          unzip -l "$APK" | grep -q "lib/$MISH_TARGET_ABI/libmish_android_ffi.so"
          unzip -l "$APK" | grep -q "lib/$MISH_TARGET_ABI/libjnidispatch.so"
          if unzip -l "$APK" | grep -Fq 'libsingbox.so'; then
            echo 'obsolete sing-box binary leaked into native PRODUCT APK' >&2
            exit 1
          fi

          SYMBOLS="$RUNNER_TEMP/mish-android-ffi.symbols"
          readelf -Ws "$NATIVE" > "$SYMBOLS"
          grep -Fq 'android_getaddrinfofornetwork' "$SYMBOLS"
          if grep -Fq 'android_setsocknetwork' "$SYMBOLS"; then
            echo 'superseded android_setsocknetwork leaked into PRODUCT FFI library' >&2
            exit 1
          fi

          for symbol in \
            NativeProductRuntime \
            NativeCellularPolicyObserver \
            NativeReadinessObserver \
            NativeProxyRuntimeObserver \
            RuntimeLifecycleSnapshotView \
            ProxyRuntimePublicationView; do
            grep -Fq "$symbol" "$GENERATED"
          done
          for forbidden in \
            CellularController \
            MeshTransportController \
            RuntimeLifecycleController \
            startNativeProxyRuntime \
            proxyServingFailureRecoverable \
            proxyListenerPorts \
            CellularNetworkLease \
            admittedNetworkLease \
            bindSocket \
            resolveHost \
            RuntimeProcessLifecycleController \
            ProxyServingLifecycleController \
            PrivateBridge; do
            if grep -Fq "$forbidden" "$GENERATED"; then
              echo "obsolete or uncontrolled API leaked into UniFFI surface: $forbidden" >&2
              exit 1
            fi
          done
          if grep -Eq '(^|[^[:alnum:]_])NativeProxyRuntime([^[:alnum:]_]|$)' "$GENERATED"; then
            echo 'obsolete NativeProxyRuntime control object leaked into UniFFI surface' >&2
            exit 1
          fi
