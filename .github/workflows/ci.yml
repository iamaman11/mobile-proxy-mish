name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust Workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
          rustup override set 1.98.1

      # Temporary branch-only bootstrap step. It is removed before merge after the
      # exact Cargo.lock bytes are committed, so protected main keeps --locked CI.
      - name: Resolve B2b lockfile bootstrap
        run: |
          cargo generate-lockfile
          echo 'B2B_CARGO_LOCK_BASE64_BEGIN'
          base64 -w0 Cargo.lock
          echo
          echo 'B2B_CARGO_LOCK_BASE64_END'

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Generate UniFFI Kotlin contract
        run: |
          cargo build -p mish-android-ffi --locked
          rm -rf target/uniffi-kotlin
          cargo run -p mish-android-ffi --bin uniffi-bindgen --locked -- \
            generate --library target/debug/libmish_android_ffi.so \
            --language kotlin --out-dir target/uniffi-kotlin

  android:
    name: Android Compose Shell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.6.0'

      - name: Lint, unit test, and assemble Android shell
        run: gradle --no-daemon -p android :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
