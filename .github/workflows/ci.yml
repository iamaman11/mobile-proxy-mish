name: QA81 Final Branch Transaction

on:
  push:
    branches: [qa/81-remediation]

permissions:
  contents: write

concurrency:
  group: qa81-final-branch-transaction
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: qa/81-remediation
          fetch-depth: 0
      - name: Apply bounded non-workflow patch
        run: |
          set -euo pipefail
          cp .github/workflows/ci.yml "$RUNNER_TEMP/qa81-transaction-ci.yml"
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          python3 tools/qa81_final_ci_patch.py
          cp "$RUNNER_TEMP/qa81-transaction-ci.yml" .github/workflows/ci.yml
          rm -f tools/qa81_final_ci_patch.py
          changed="$(git status --short)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | wc -l)" -eq 3
          printf '%s\n' "$changed" | grep -Fq 'android/app/src/main/AndroidManifest.xml'
          printf '%s\n' "$changed" | grep -Fq 'crates/android-ffi/src/lib.rs'
          printf '%s\n' "$changed" | grep -Fq 'tools/qa81_final_ci_patch.py'
      - name: Commit and push only non-workflow files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/AndroidManifest.xml crates/android-ffi/src/lib.rs tools/qa81_final_ci_patch.py
          git commit -m 'Runtime: satisfy Clippy and canonical Android packaging'
          git push origin HEAD:qa/81-remediation
