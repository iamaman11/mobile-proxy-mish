name: QA81 Root Policy Effect Gate Repair

on:
  push:
    branches: [qa/81-remediation]

permissions:
  contents: write

concurrency:
  group: qa81-root-effect-gate-repair
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: qa/81-remediation
          fetch-depth: 0
      - name: Apply and validate source patch
        run: |
          set -euo pipefail
          python3 tools/qa81_effect_gate_patch.py
          cargo fmt --all --check
          cargo test --workspace --locked
          git diff --check
          test "$(git status --short | wc -l)" -eq 4
      - name: Commit source changes and remove helper
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm tools/qa81_effect_gate_patch.py
          git add -A \
            crates/android-ffi/src/lib.rs \
            android/app/src/main/java/com/mobileproxymish/app/cellular/CellularRuntimeBridge.kt \
            android/app/src/main/java/com/mobileproxymish/app/cellular/CellularRootPolicy.kt \
            android/app/src/test/java/com/mobileproxymish/app/cellular/CellularRootPolicyTest.kt \
            tools/qa81_effect_gate_patch.py
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git commit -m 'Runtime: gate outbound effects on proven root policy'
          git push origin HEAD:qa/81-remediation
