name: QA81 Bridge Claim Fix

on:
  push:
    branches: [qa/81-remediation]

permissions:
  contents: write

concurrency:
  group: qa81-bridge-claim-fix
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: qa/81-remediation
          fetch-depth: 0
      - name: Apply one-shot claim release and regression test
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/android-ffi/src/lib.rs')
          text = path.read_text()
          old = "    bridge_claimed: Arc<AtomicBool>,\n}"
          new = "    bridge_claimed: Arc<AtomicBool>,\n    claim_released: AtomicBool,\n}"
          assert old in text
          text = text.replace(old, new, 1)
          old = "                accept_thread: Mutex::new(Some(accept_thread)),\n                bridge_claimed: Arc::clone(&bridge_claimed),\n            }))"
          new = "                accept_thread: Mutex::new(Some(accept_thread)),\n                bridge_claimed: Arc::clone(&bridge_claimed),\n                claim_released: AtomicBool::new(false),\n            }))"
          assert old in text
          text = text.replace(old, new, 1)
          old = "        self.healthy.store(false, Ordering::Release);\n        self.bridge_claimed.store(false, Ordering::Release);\n        Ok(())"
          new = "        self.healthy.store(false, Ordering::Release);\n        if self\n            .claim_released\n            .compare_exchange(false, true, Ordering::AcqRel, Ordering::Acquire)\n            .is_ok()\n        {\n            self.bridge_claimed.store(false, Ordering::Release);\n        }\n        Ok(())"
          assert old in text
          text = text.replace(old, new, 1)
          anchor = "    #[test]\n    fn rendered_proxy_runtime_is_loopback_only_and_has_no_direct_fallback() {"
          test = "    #[test]\n    fn stopped_bridge_drop_cannot_release_replacement_claim() {\n        let controller = CellularController::new();\n        let stopped = controller\n            .start_bridge(\"first\".into(), \"first-secret\".into(), 1_000)\n            .expect(\"start first bridge\");\n        stopped.stop().expect(\"stop first bridge\");\n\n        let replacement = controller\n            .start_bridge(\"replacement\".into(), \"replacement-secret\".into(), 1_000)\n            .expect(\"start replacement bridge\");\n\n        drop(stopped);\n        assert!(matches!(\n            controller.start_bridge(\"third\".into(), \"third-secret\".into(), 1_000),\n            Err(AndroidRuntimeError::BridgeAlreadyRunning)\n        ));\n\n        replacement.stop().expect(\"stop replacement bridge\");\n    }\n\n"
          assert anchor in text
          text = text.replace(anchor, test + anchor, 1)
          path.write_text(text)
          PY
          git diff --check
          test "$(git status --short | wc -l)" -eq 1
          git status --short | grep -Fq 'crates/android-ffi/src/lib.rs'
      - name: Commit ordinary source file only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/android-ffi/src/lib.rs
          git commit -m 'Runtime: make private bridge claim release one-shot'
          git push origin HEAD:qa/81-remediation
