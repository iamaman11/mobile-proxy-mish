name: CI

on:
  pull_request:
    branches: [main]
    types: [ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: Architecture Guards
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'integration/m1' && github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify accepted architecture invariants
        run: python3 tools/check_architecture.py

  rust:
    name: Rust Workspace
    needs: architecture
    if: ${{ needs.architecture.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
          rustup override set 1.98.1

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Generate and verify narrow UniFFI Kotlin contract
        run: |
          set -euo pipefail
          cargo build -p mish-android-ffi --locked
          rm -rf target/uniffi-kotlin
          cargo run -p mish-android-ffi --bin uniffi-bindgen --locked -- \
            generate --library target/debug/libmish_android_ffi.so \
            --language kotlin --out-dir target/uniffi-kotlin --no-format
          GENERATED="target/uniffi-kotlin/com/mobileproxymish/ffi/mish_android_ffi.kt"
          test -f "$GENERATED"
          grep -q '^package com.mobileproxymish.ffi$' "$GENERATED"
          for symbol in \
            CellularController \
            MeshTransportController \
            RuntimeLifecycleController \
            RuntimeProcessLifecycleController \
            proxyListenerPorts \
            externalCredentialInitialState \
            renderProxyRuntimeConfig; do
            grep -q "$symbol" "$GENERATED"
          done
          for forbidden in CellularNetworkLease admittedNetworkLease bindSocket resolveHost; do
            if grep -q "$forbidden" "$GENERATED"; then
              echo "superseded Android network mechanism leaked into UniFFI surface: $forbidden" >&2
              exit 1
            fi
          done

      - name: Load pinned sing-box release manifest
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("vendor/sing-box/release.toml").read_text())
          version = data["version"]
          linux = data["linux_amd64_ci"]
          props = {}
          for raw in Path("android/gradle.properties").read_text().splitlines():
              if "=" in raw and not raw.lstrip().startswith("#"):
                  key, value = raw.split("=", 1)
                  props[key.strip()] = value.strip()
          target_abi = props.get("mishTargetAbi")
          vendor_key = {"armeabi-v7a": "android_arm", "arm64-v8a": "android_arm64"}.get(target_abi)
          assert vendor_key is not None, "unsupported mishTargetAbi"
          android = data[vendor_key]

          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version)
          for artifact in (linux, android):
              assert artifact["url"].startswith(
                  f"https://github.com/SagerNet/sing-box/releases/download/v{version}/"
              )
              assert re.fullmatch(r"[0-9a-f]{64}", artifact["sha256"])
              assert artifact["url"].endswith("/" + artifact["asset"])

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"SB_VERSION={version}\n")
              env.write(f"SB_LINUX_ASSET={linux['asset']}\n")
              env.write(f"SB_LINUX_URL={linux['url']}\n")
              env.write(f"SB_LINUX_SHA256={linux['sha256']}\n")
              env.write(f"SB_ANDROID_ASSET={android['asset']}\n")
              env.write(f"SB_ANDROID_URL={android['url']}\n")
              env.write(f"SB_ANDROID_SHA256={android['sha256']}\n")
          PY

      - name: Verify pinned sing-box artifacts and product configuration
        run: |
          set -euo pipefail
          SB_ROOT="$RUNNER_TEMP/sing-box"
          mkdir -p "$SB_ROOT"

          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "$SB_LINUX_URL" -o "$SB_ROOT/$SB_LINUX_ASSET"
          echo "$SB_LINUX_SHA256  $SB_ROOT/$SB_LINUX_ASSET" | sha256sum -c -

          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "$SB_ANDROID_URL" -o "$SB_ROOT/$SB_ANDROID_ASSET"
          echo "$SB_ANDROID_SHA256  $SB_ROOT/$SB_ANDROID_ASSET" | sha256sum -c -

          tar -xzf "$SB_ROOT/$SB_LINUX_ASSET" -C "$SB_ROOT"
          SB="$SB_ROOT/sing-box-$SB_VERSION-linux-amd64/sing-box"
          test -x "$SB"
          "$SB" version | grep -Fq "sing-box version $SB_VERSION"

          PRODUCT_CONFIG="$RUNNER_TEMP/product-sing-box.json"
          cargo run --quiet --locked -p mish-sing-box-adapter --example render_product_config \
            > "$PRODUCT_CONFIG"
          "$SB" check -c "$PRODUCT_CONFIG"
          if grep -q '"type": "direct"' "$PRODUCT_CONFIG"; then
            echo "product config must never contain a direct outbound before #64 closes DNS ownership" >&2
            exit 1
          fi

          echo "SB=$SB" >> "$GITHUB_ENV"
          echo "PRODUCT_CONFIG=$PRODUCT_CONFIG" >> "$GITHUB_ENV"

      - name: Exercise hosted sing-box proxy and auth matrix
        run: |
          set -euo pipefail
          FIXTURE_CONFIG="$RUNNER_TEMP/sing-box-egress-fixture.json"
          HTTP_ROOT="$RUNNER_TEMP/proxy-target"
          mkdir -p "$HTTP_ROOT"
          printf 'mish-proxy-ok\n' > "$HTTP_ROOT/probe.txt"

          cat > "$FIXTURE_CONFIG" <<'JSON'
          {
            "inbounds": [
              {
                "type": "socks",
                "tag": "fixture-socks-in",
                "listen": "127.0.0.1",
                "listen_port": 19080,
                "users": [
                  {"username": "ci-egress", "password": "ci-egress-password"}
                ]
              }
            ],
            "outbounds": [
              {"type": "direct", "tag": "fixture-direct"}
            ],
            "route": {"final": "fixture-direct"}
          }
          JSON

          "$SB" check -c "$FIXTURE_CONFIG"

          HTTP_PID=""
          EGRESS_PID=""
          PRODUCT_PID=""
          cleanup() {
            for pid in "$PRODUCT_PID" "$EGRESS_PID" "$HTTP_PID"; do
              if [[ -n "$pid" ]]; then
                kill "$pid" >/dev/null 2>&1 || true
              fi
            done
          }
          trap cleanup EXIT

          python3 -m http.server 18080 --bind 127.0.0.1 --directory "$HTTP_ROOT" \
            >"$RUNNER_TEMP/http-target.log" 2>&1 &
          HTTP_PID=$!
          "$SB" run -c "$FIXTURE_CONFIG" >"$RUNNER_TEMP/egress-fixture.log" 2>&1 &
          EGRESS_PID=$!
          "$SB" run -c "$PRODUCT_CONFIG" >"$RUNNER_TEMP/product-sing-box.log" 2>&1 &
          PRODUCT_PID=$!

          wait_port() {
            local port="$1"
            python3 - "$port" <<'PY'
          import socket
          import sys
          import time

          port = int(sys.argv[1])
          deadline = time.monotonic() + 10
          while time.monotonic() < deadline:
              try:
                  with socket.create_connection(("127.0.0.1", port), timeout=0.25):
                      raise SystemExit(0)
              except OSError:
                  time.sleep(0.1)
          raise SystemExit(f"port {port} did not become ready")
          PY
          }

          for port in 18080 19080 1080 1081 3128; do
            wait_port "$port"
          done

          TARGET="http://127.0.0.1:18080/probe.txt"
          expect_body() {
            local body
            body="$("$@")"
            [[ "$body" == "mish-proxy-ok" ]]
          }
          expect_failure() {
            if "$@" >/dev/null 2>&1; then
              echo "command unexpectedly succeeded: $*" >&2
              return 1
            fi
          }

          expect_body curl --fail --silent --show-error --max-time 10 --noproxy "" \
            --proxy http://127.0.0.1:1080 --proxy-user ci-public:ci-public-password "$TARGET"
          expect_body curl --fail --silent --show-error --max-time 10 --noproxy "" \
            --proxy socks5h://127.0.0.1:1080 --proxy-user ci-public:ci-public-password "$TARGET"
          expect_body curl --fail --silent --show-error --max-time 10 --noproxy "" \
            --proxy socks5h://127.0.0.1:1081 --proxy-user ci-public:ci-public-password "$TARGET"
          expect_body curl --fail --silent --show-error --max-time 10 --noproxy "" \
            --proxy http://127.0.0.1:3128 --proxy-user ci-public:ci-public-password "$TARGET"
          expect_body curl --fail --silent --show-error --max-time 10 --noproxy "" \
            --proxytunnel --proxy http://127.0.0.1:3128 \
            --proxy-user ci-public:ci-public-password "$TARGET"

          expect_failure curl --fail --silent --max-time 5 --noproxy "" \
            --proxy http://127.0.0.1:1080 "$TARGET"
          expect_failure curl --fail --silent --max-time 5 --noproxy "" \
            --proxy socks5h://127.0.0.1:1081 --proxy-user wrong:wrong "$TARGET"
          expect_failure curl --fail --silent --max-time 5 --noproxy "" \
            --proxy http://127.0.0.1:3128 "$TARGET"

  android:
    name: Android Compose Shell
    needs: architecture
    if: ${{ needs.architecture.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.6.0'

      - name: Install pinned Rust Android tooling for target ABI
        run: |
          set -euo pipefail
          TARGET_ABI="$(sed -n 's/^mishTargetAbi=//p' android/gradle.properties)"
          case "$TARGET_ABI" in
            armeabi-v7a) RUST_TARGET='armv7-linux-androideabi' ;;
            arm64-v8a) RUST_TARGET='aarch64-linux-android' ;;
            *) echo "Unsupported mishTargetAbi: $TARGET_ABI" >&2; exit 1 ;;
          esac
          rustup toolchain install 1.98.1 --profile minimal
          rustup override set 1.98.1
          rustup target add "$RUST_TARGET"
          cargo install cargo-ndk --version 4.1.2 --locked
          echo "MISH_TARGET_ABI=$TARGET_ABI" >> "$GITHUB_ENV"

      - name: Install pinned Android NDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK root is not configured}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          NDK_PATH="$SDK_ROOT/ndk/29.0.14206865"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "ndk;29.0.14206865"
          test -d "$NDK_PATH"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Lint, unit test, and assemble Android shell + physical test APK
        run: |
          gradle --no-daemon -p android \
            :app:lintDebug \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest

      - name: Verify packaged native runtime and narrow UniFFI surface
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          TEST_APK="android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          NATIVE="android/app/build/generated/rust-jni/$MISH_TARGET_ABI/libmish_android_ffi.so"
          GENERATED="android/app/build/generated/uniffi/kotlin/com/mobileproxymish/ffi/mish_android_ffi.kt"
          test -f "$APK"
          test -f "$TEST_APK"
          test -f "$NATIVE"
          test -f "$GENERATED"
          unzip -l "$APK" | grep -q "lib/$MISH_TARGET_ABI/libmish_android_ffi.so"
          unzip -l "$APK" | grep -q "lib/$MISH_TARGET_ABI/libjnidispatch.so"

          SYMBOLS="$RUNNER_TEMP/mish-android-ffi.symbols"
          readelf -Ws "$NATIVE" > "$SYMBOLS"
          grep -Fq 'android_getaddrinfofornetwork' "$SYMBOLS"
          if grep -Fq 'android_setsocknetwork' "$SYMBOLS"; then
            echo 'superseded android_setsocknetwork leaked into PRODUCT FFI library' >&2
            exit 1
          fi

          for symbol in \
            CellularController \
            MeshTransportController \
            RuntimeLifecycleController \
            RuntimeProcessLifecycleController \
            proxyListenerPorts; do
            grep -Fq "$symbol" "$GENERATED"
          done
          for forbidden in CellularNetworkLease admittedNetworkLease bindSocket resolveHost; do
            if grep -Fq "$forbidden" "$GENERATED"; then
              echo "network-scoped Android mechanism leaked into UniFFI surface: $forbidden" >&2
              exit 1
            fi
          done
