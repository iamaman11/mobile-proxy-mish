name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust Workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
          rustup override set 1.98.1

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Generate UniFFI Kotlin contract
        run: |
          cargo build -p mish-android-ffi --locked
          rm -rf target/uniffi-kotlin
          cargo run -p mish-android-ffi --bin uniffi-bindgen --locked -- \
            generate --library target/debug/libmish_android_ffi.so \
            --language kotlin --out-dir target/uniffi-kotlin --no-format

  android:
    name: Android Compose Shell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.6.0'

      - name: Install pinned Rust Android tooling
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup override set 1.98.1
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Install pinned Android NDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK root is not configured}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Lint, unit test, and assemble Android shell
        run: gradle --no-daemon -p android :app:lintDebug :app:testDebugUnitTest :app:assembleDebug

      - name: Verify packaged native runtime
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libmish_android_ffi.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libjnidispatch.so'
