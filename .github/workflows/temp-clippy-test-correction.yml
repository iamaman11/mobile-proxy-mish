name: Temporary Clippy Test Correction

on:
  push:
    branches: [m1/arch-clippy-test-resolver]

permissions:
  contents: write

jobs:
  correct:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: m1/arch-clippy-test-resolver
          fetch-depth: 0

      - name: Apply exact test-only Clippy corrections
        shell: python
        run: |
          from pathlib import Path

          runtime = Path('crates/runtime/src/cellular_runtime.rs')
          text = runtime.read_text(encoding='utf-8')
          old_import = '    use mish_cellular::{CellularAdmissionReason, NetworkObservation};\n'
          new_import = '    use mish_cellular::{CellularAdmissionReason, CellularNetworkAuthority, NetworkObservation};\n'
          old_block = '''    fn coordinator() -> Arc<CellularRuntimeCoordinator> {\n        CellularRuntimeCoordinator::new(Arc::new(|_, _| {\n            Ok(vec![IpAddr::V4(Ipv4Addr::new(203, 0, 113, 9))])\n        }))\n    }\n'''
          new_block = '''    struct StaticResolver;\n\n    impl CellularDnsResolver for StaticResolver {\n        fn resolve(\n            &self,\n            _authority: CellularNetworkAuthority,\n            _hostname: &str,\n        ) -> Result<Vec<IpAddr>, OutboundConnectError> {\n            Ok(vec![IpAddr::V4(Ipv4Addr::new(203, 0, 113, 9))])\n        }\n    }\n\n    fn coordinator() -> Arc<CellularRuntimeCoordinator> {\n        CellularRuntimeCoordinator::new(Arc::new(StaticResolver))\n    }\n'''
          if text.count(old_import) != 1 or text.count(old_block) != 1:
              raise SystemExit('unexpected cellular runtime test shape')
          runtime.write_text(
              text.replace(old_import, new_import).replace(old_block, new_block),
              encoding='utf-8',
          )

          lifecycle = Path('crates/runtime/src/lifecycle.rs')
          text = lifecycle.read_text(encoding='utf-8')
          old_assert = '''        assert!(\n            owner\n                .complete_start(true, true)\n                .install_fresh_generation_now()\n                == false\n        );\n'''
          new_assert = '''        assert!(\n            !owner\n                .complete_start(true, true)\n                .install_fresh_generation_now()\n        );\n'''
          if text.count(old_assert) != 2:
              raise SystemExit('unexpected lifecycle boolean assertion shape')
          lifecycle.write_text(text.replace(old_assert, new_assert), encoding='utf-8')

      - name: Validate pinned Rust all-targets gate
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
          rustup override set 1.98.1
          cargo fmt --all
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Commit correction and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/temp-clippy-test-correction.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'M1 architecture: satisfy pinned all-target Clippy tests'
          git push origin HEAD:m1/arch-clippy-test-resolver
