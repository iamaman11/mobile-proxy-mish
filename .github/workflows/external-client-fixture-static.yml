name: D3 External Client Fixture Static

on:
  pull_request:
    paths:
      - 'lab/windows/external-client-fixture.json'
      - 'lab/windows/test-external-client-fixture.ps1'
      - 'lab/windows/u8g-camoufox-toolchain.json'
      - 'lab/windows/diagnose-u8-external-privacy-preflight.ps1'
      - 'lab/windows/test-u8-external-privacy-preflight-contract.ps1'
      - 'lab/windows/diagnose-u8-camoufox-python-runtime.ps1'
      - 'lab/windows/test-u8-camoufox-python-runtime-contract.ps1'
      - 'lab/windows/resolve-u8g-camoufox-dependencies.ps1'
      - 'lab/windows/test-u8g-camoufox-resolution-contract.ps1'
      - 'lab/windows/materialize-u8g-camoufox-toolchain.ps1'
      - 'lab/windows/verify-u8g-camoufox-toolchain.ps1'
      - 'lab/windows/test-u8g-camoufox-materialization-contract.ps1'
      - 'lab/windows/diagnose-u8g-final-clean-client.ps1'
      - 'lab/windows/test-u8g-final-clean-client-contract.ps1'
      - 'lab/windows/DiagnosticConnectProbe.psm1'
      - 'lab/windows/CredentialProvisioning.psm1'
      - 'docs/lab/EXTERNAL_CLIENT_FIXTURE.md'
      - '.github/workflows/external-client-fixture-static.yml'
  push:
    branches: [main]
    paths:
      - 'lab/windows/external-client-fixture.json'
      - 'lab/windows/test-external-client-fixture.ps1'
      - 'lab/windows/u8g-camoufox-toolchain.json'
      - 'lab/windows/diagnose-u8-external-privacy-preflight.ps1'
      - 'lab/windows/test-u8-external-privacy-preflight-contract.ps1'
      - 'lab/windows/diagnose-u8-camoufox-python-runtime.ps1'
      - 'lab/windows/test-u8-camoufox-python-runtime-contract.ps1'
      - 'lab/windows/resolve-u8g-camoufox-dependencies.ps1'
      - 'lab/windows/test-u8g-camoufox-resolution-contract.ps1'
      - 'lab/windows/materialize-u8g-camoufox-toolchain.ps1'
      - 'lab/windows/verify-u8g-camoufox-toolchain.ps1'
      - 'lab/windows/test-u8g-camoufox-materialization-contract.ps1'
      - 'lab/windows/diagnose-u8g-final-clean-client.ps1'
      - 'lab/windows/test-u8g-final-clean-client-contract.ps1'
      - 'lab/windows/DiagnosticConnectProbe.psm1'
      - 'lab/windows/CredentialProvisioning.psm1'
      - 'docs/lab/EXTERNAL_CLIENT_FIXTURE.md'
      - '.github/workflows/external-client-fixture-static.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture:
    name: D3 External Client Fixture Static
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse fixture validator
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'lab/windows/test-external-client-fixture.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'External client fixture validator parse failed.'
          }

      - name: Validate pinned TCP-only browser fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & 'lab/windows/test-external-client-fixture.ps1'

      - name: Validate U8-G external-client PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            'lab/windows/diagnose-u8-external-privacy-preflight.ps1',
            'lab/windows/test-u8-external-privacy-preflight-contract.ps1',
            'lab/windows/diagnose-u8-camoufox-python-runtime.ps1',
            'lab/windows/test-u8-camoufox-python-runtime-contract.ps1',
            'lab/windows/resolve-u8g-camoufox-dependencies.ps1',
            'lab/windows/test-u8g-camoufox-resolution-contract.ps1',
            'lab/windows/materialize-u8g-camoufox-toolchain.ps1',
            'lab/windows/verify-u8g-camoufox-toolchain.ps1',
            'lab/windows/test-u8g-camoufox-materialization-contract.ps1',
            'lab/windows/diagnose-u8g-final-clean-client.ps1',
            'lab/windows/test-u8g-final-clean-client-contract.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error "${path}:$($_.Message)" }
              throw "U8-G PowerShell parse failed for $path."
            }
          }

      - name: Run U8-G external-client contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($test in @(
            'lab/windows/test-u8-external-privacy-preflight-contract.ps1',
            'lab/windows/test-u8-camoufox-python-runtime-contract.ps1',
            'lab/windows/test-u8g-camoufox-resolution-contract.ps1',
            'lab/windows/test-u8g-camoufox-materialization-contract.ps1',
            'lab/windows/test-u8g-final-clean-client-contract.ps1'
          )) {
            & $test
          }

      - name: Verify pinned Camoufox release still exists upstream
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = Get-Content -Raw -LiteralPath 'lab/windows/external-client-fixture.json' | ConvertFrom-Json
          $tag = [string]$fixture.camoufox.browser_version
          $headers = @{
            'User-Agent' = 'mobile-proxy-mish-d3-fixture'
            'Authorization' = "Bearer $env:GITHUB_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/daijro/camoufox/releases/tags/$tag"
          if ([string]$release.tag_name -ne $tag) {
            throw "Pinned Camoufox release metadata drifted: expected $tag, got $($release.tag_name)"
          }
