name: L8 Lockfile Materialization

on:
  pull_request:
    branches: [fix/root-policy-reconciliation]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/l8-lockfile-materialize.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**/Cargo.toml'

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Set up exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          rustup override set 1.98.1

      - name: Generate and commit exact lockfile when stale
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          cargo generate-lockfile
          if git diff --quiet -- Cargo.lock; then
            echo 'MISH_CARGO_LOCK_CURRENT=YES'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'Regenerate Cargo.lock for L8 native runtime'
          git push origin "HEAD:$HEAD_REF"
