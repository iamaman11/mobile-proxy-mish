name: MISH WARP State Static

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'lab/windows/CloudflareProbe.psm1'
      - 'lab/windows/test-cloudflare-probe.ps1'
      - 'lab/windows/collect-warp-state-diagnostic.ps1'
      - '.github/workflows/mish-warp-state-diagnostic.yml'
      - '.github/workflows/mish-warp-state-static.yml'
  push:
    branches: [main]
    paths:
      - 'lab/windows/CloudflareProbe.psm1'
      - 'lab/windows/test-cloudflare-probe.ps1'
      - 'lab/windows/collect-warp-state-diagnostic.ps1'
      - '.github/workflows/mish-warp-state-diagnostic.yml'
      - '.github/workflows/mish-warp-state-static.yml'

permissions:
  contents: read

concurrency:
  group: mish-warp-state-static-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: WARP State Read-only Contract
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse diagnostic PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            'lab/windows/CloudflareProbe.psm1',
            'lab/windows/collect-warp-state-diagnostic.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error "${path}: $($_.Message)" }
              throw "PowerShell parse failed for $path."
            }
          }

      - name: Verify read-only trust boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptPath = 'lab/windows/collect-warp-state-diagnostic.ps1'
          $workflowPath = '.github/workflows/mish-warp-state-diagnostic.yml'
          $script = Get-Content -Raw -LiteralPath $scriptPath
          $workflow = Get-Content -Raw -LiteralPath $workflowPath

          foreach ($required in @(
            'Get-MishWarpStateClassification',
            "Import-Module $modulePath -Force",
            'Resolve-WarpCli',
            'Get-WarpVersion',
            'Assert-WarpRegistration',
            'Get-WarpSettingsProjection',
            'Get-WarpConnected',
            'Get-WarpAdapter',
            'Get-SelectedRouteProjection',
            'provider_write_attempted = $false',
            'mutation_performed = $false',
            'raw_registration_persisted = $false',
            'raw_settings_persisted = $false'
          )) {
            if (-not $script.Contains($required)) {
              throw "WARP-state diagnostic contract drifted: $required"
            }
          }

          foreach ($forbidden in @(
            '(?i)Invoke-WarpAction',
            "(?i)@\('connect'\)",
            "(?i)@\('disconnect'\)",
            '(?i)registration\s+(new|token|delete)',
            '(?i)tunnel\s+protocol\s+set',
            '(?i)tunnel\s+ip\s+(add|remove)',
            '(?i)Invoke-(RestMethod|WebRequest)',
            '(?i)CLOUDFLARE_API_TOKEN',
            '(?i)adb(?:\.exe)?\s+install',
            '(?i)force-stop',
            '(?i)\bam\s+start\b',
            '(?i)Set-NetAdapter',
            '(?i)(New|Remove|Set)-NetRoute'
          )) {
            if ($script -match $forbidden) {
              throw "WARP-state diagnostic introduced a mutation/recovery path: $forbidden"
            }
          }

          foreach ($required in @(
            "github.event.issue.number == 163",
            "github.event.comment.user.login == 'iamaman11'",
            "github.event.comment.body == '/mish-diag warp-state'",
            'runs-on: [self-hosted, windows, x64, mobile-proxy-mish-lab]',
            'ref: main',
            'persist-credentials: false',
            '-PhysicalLab',
            'Read-only only: no WARP connect/disconnect'
          )) {
            if (-not $workflow.Contains($required)) {
              throw "WARP-state physical workflow trust contract drifted: $required"
            }
          }

      - name: Run existing Cloudflare parser contracts
        shell: pwsh
        run: ./lab/windows/test-cloudflare-probe.ps1

      - name: Run WARP-state classification contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./lab/windows/collect-warp-state-diagnostic.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) {
            throw "WARP-state self-test failed with exit code $LASTEXITCODE."
          }
