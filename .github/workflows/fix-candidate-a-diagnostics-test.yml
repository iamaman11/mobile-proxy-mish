name: Fix Candidate A Diagnostics Test

on:
  push:
    branches:
      - rotation/candidate-a-product
    paths:
      - .github/workflows/fix-candidate-a-diagnostics-test.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: rotation/candidate-a-product
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.6.0'

      - name: Apply exact test migration
        run: python3 tools/fix_candidate_a_diagnostics_test.py

      - name: Verify affected unit test compiles and passes
        run: >-
          gradle --no-daemon -p android
          :app:testDebugUnitTest
          --tests com.mobileproxymish.app.MishDiagnosticsSerializationTest

      - name: Remove one-shot dev machinery
        run: |
          rm tools/fix_candidate_a_diagnostics_test.py
          rm .github/workflows/fix-candidate-a-diagnostics-test.yml

      - name: Verify patch
        run: |
          git diff --check
          if grep -n -E 'airplaneEnable|radioPowerOff|cellularRequestRearm|firstPlatformCellularObservation|platformCellularObservationsAfterRearm|radio_power_off|cellular_request_rearm|first_platform_cellular_observation|platform_cellular_observations_after_rearm' android/app/src/test/java/com/mobileproxymish/app/MishDiagnosticsSerializationTest.kt; then
            echo 'stale airplane/rearm diagnostics fixture remains' >&2
            exit 1
          fi

      - name: Commit validated test update
        run: |
          git config user.name "iamaman11"
          git config user.email "44100369+iamaman11@users.noreply.github.com"
          git add -A
          git commit -m "Tests: align diagnostics with Candidate A timing"
          git push origin HEAD:rotation/candidate-a-product
