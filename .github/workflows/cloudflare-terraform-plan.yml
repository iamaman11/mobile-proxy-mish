name: Cloudflare Terraform Verify

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-terraform-provider-state
  cancel-in-progress: false

jobs:
  verify:
    name: Cloudflare Terraform Verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: cloudflare-plan
    env:
      TF_VERSION: '1.16.2'
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_windows_profile_match: ${{ secrets.CLOUDFLARE_WINDOWS_PROFILE_MATCH }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout accepted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify accepted-main execution boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Install pinned Terraform
        shell: bash
        run: |
          set -euo pipefail
          base="https://releases.hashicorp.com/terraform/${TF_VERSION}"
          asset="terraform_${TF_VERSION}_linux_amd64.zip"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "${base}/${asset}" -o "$RUNNER_TEMP/$asset"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "${base}/terraform_${TF_VERSION}_SHA256SUMS" \
            -o "$RUNNER_TEMP/terraform_SHA256SUMS"
          grep " ${asset}$" "$RUNNER_TEMP/terraform_SHA256SUMS" \
            | (cd "$RUNNER_TEMP" && sha256sum -c -)
          unzip -q "$RUNNER_TEMP/$asset" -d "$RUNNER_TEMP/terraform-bin"
          sudo install -m 0755 "$RUNNER_TEMP/terraform-bin/terraform" /usr/local/bin/terraform
          terraform version | grep -F "Terraform v${TF_VERSION}"

      - name: Validate protected environment inputs
        shell: bash
        env:
          R2_STATE_BUCKET: ${{ vars.R2_STATE_BUCKET }}
        run: |
          set -euo pipefail
          test -n "$TF_VAR_windows_profile_match"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$R2_STATE_BUCKET"
          test "$R2_STATE_BUCKET" = 'mobile-proxy-mish-terraform-state'

      - name: Resolve and mask Cloudflare account from token scope
        shell: bash
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/cloudflare-accounts.json"
          trap 'rm -f "$response"' EXIT

          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            'https://api.cloudflare.com/client/v4/accounts?per_page=50&page=1' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Accept: application/json' \
            -o "$response"

          if ! jq -e '.success == true and (.result | type == "array")' "$response" >/dev/null; then
            echo '::error::Cloudflare account scope could not be resolved from the protected token. No provider operation was attempted.'
            exit 1
          fi

          returned="$(jq -r '.result | length' "$response")"
          total="$(jq -r '.result_info.total_count // (.result | length)' "$response")"
          if [[ "$returned" != '1' || "$total" != '1' ]]; then
            echo "::error::Expected the protected Cloudflare token to resolve exactly one account; returned=${returned}, total=${total}. No provider operation was attempted."
            exit 1
          fi

          account_id="$(jq -r '.result[0].id // empty' "$response")"
          if [[ ! "$account_id" =~ ^[0-9A-Fa-f]{32}$ ]]; then
            echo '::error::Resolved Cloudflare account identifier has an unexpected shape. No provider operation was attempted.'
            exit 1
          fi

          echo "::add-mask::$account_id"
          echo "TF_VAR_cloudflare_account_id=$account_id" >> "$GITHUB_ENV"

      - name: Initialize dedicated R2 remote state
        shell: bash
        env:
          R2_STATE_BUCKET: ${{ vars.R2_STATE_BUCKET }}
        run: |
          set -euo pipefail
          backend="$RUNNER_TEMP/backend.r2.hcl"
          trap 'rm -f "$backend"' EXIT
          cat > "$backend" <<EOF
          bucket = "$R2_STATE_BUCKET"
          key    = "mobile-proxy-mish/cloudflare/terraform.tfstate"
          region = "auto"
          skip_credentials_validation = true
          skip_metadata_api_check     = true
          skip_region_validation      = true
          skip_requesting_account_id  = true
          skip_s3_checksum            = true
          use_path_style              = true
          endpoints = {
            s3 = "https://${TF_VAR_cloudflare_account_id}.r2.cloudflarestorage.com"
          }
          EOF
          terraform -chdir=infra/cloudflare init -input=false -backend-config="$backend"

      - name: Ensure existing adds profile is adopted
        shell: bash
        run: |
          set -euo pipefail
          address='cloudflare_zero_trust_device_custom_profile.adds'

          if terraform -chdir=infra/cloudflare state show "$address" >/dev/null 2>&1; then
            {
              echo '### Cloudflare Terraform adoption: ALREADY PRESENT'
              echo '- Existing adds profile is already present in dedicated R2 state.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          response="$RUNNER_TEMP/cloudflare-device-policies.json"
          trap 'rm -f "$response"' EXIT

          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${TF_VAR_cloudflare_account_id}/devices/policies?per_page=100&page=1" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Accept: application/json' \
            -o "$response"

          if ! jq -e '.success == true and (.result | type == "array")' "$response" >/dev/null; then
            echo '::error::Cloudflare device-profile list could not be verified. No import was attempted.'
            exit 1
          fi

          returned="$(jq -r '.result | length' "$response")"
          total="$(jq -r '.result_info.total_count // (.result | length)' "$response")"
          if (( total > returned )); then
            echo '::error::Cloudflare device-profile response is paginated beyond the bounded first page. No import was attempted.'
            exit 1
          fi

          match_count="$(jq -r --arg expected "$TF_VAR_windows_profile_match" '
            [.result[] |
              select(
                .name == "adds" and
                .match == $expected and
                ((.default // false) == false)
              )
            ] | length
          ' "$response")"

          if [[ "$match_count" != '1' ]]; then
            echo "::error::Expected exactly one non-default Cloudflare profile named adds with the protected exact match expression; found ${match_count}. No import was attempted."
            exit 1
          fi

          policy_id="$(jq -r --arg expected "$TF_VAR_windows_profile_match" '
            [.result[] |
              select(
                .name == "adds" and
                .match == $expected and
                ((.default // false) == false)
              )
            ][0].policy_id // empty
          ' "$response")"
          test -n "$policy_id"
          echo "::add-mask::$policy_id"
          import_id="${TF_VAR_cloudflare_account_id}/${policy_id}"
          echo "::add-mask::$import_id"

          terraform -chdir=infra/cloudflare import \
            -input=false \
            "$address" \
            "$import_id"

          terraform -chdir=infra/cloudflare state show "$address" >/dev/null

          {
            echo '### Cloudflare Terraform adoption: SUCCESS'
            echo '- Existing adds profile uniquely matched by protected name + match expression.'
            echo '- Resource adopted into dedicated R2 state.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assert Mesh connectivity settings through official Cloudflare API
        shell: bash
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/cloudflare-connectivity-settings.json"
          trap 'rm -f "$response"' EXIT

          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${TF_VAR_cloudflare_account_id}/zerotrust/connectivity_settings" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Accept: application/json' \
            -o "$response"

          if ! jq -e '
            .success == true and
            .result.offramp_warp_enabled == true and
            (
              ((.result | has("icmp_proxy_enabled")) == false) or
              .result.icmp_proxy_enabled == true
            )
          ' "$response" >/dev/null; then
            offramp="$(jq -r '.result.offramp_warp_enabled // "missing"' "$response")"
            icmp="$(jq -r 'if (.result | has("icmp_proxy_enabled")) then (.result.icmp_proxy_enabled | tostring) else "not-exposed" end' "$response")"
            echo "::error::Cloudflare Mesh connectivity invariant failed: WARP-to-WARP=${offramp}, ICMP proxy field=${icmp}. No provider apply is allowed."
            exit 1
          fi

          icmp="$(jq -r 'if (.result | has("icmp_proxy_enabled")) then (.result.icmp_proxy_enabled | tostring) else "not-exposed" end' "$response")"
          {
            echo '### Cloudflare Mesh connectivity read-back'
            echo '- WARP-to-WARP/off-ramp: ENABLED'
            if [[ "$icmp" == 'true' ]]; then
              echo '- ICMP proxy API field: ENABLED'
            else
              echo '- ICMP proxy API field: NOT EXPOSED (optional in the current Cloudflare response)'
              echo '- CF-1 retains provider Gateway TCP/UDP assertions plus accepted bootstrap evidence; absence is not interpreted as false.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify adopted state before plan
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infra/cloudflare state show \
            cloudflare_zero_trust_device_custom_profile.adds >/dev/null

      - name: Provider plan and live read-back assertions
        shell: bash
        run: |
          set -euo pipefail
          set +e
          terraform -chdir=infra/cloudflare plan \
            -input=false \
            -detailed-exitcode \
            -no-color \
            -out="$RUNNER_TEMP/cloudflare.tfplan"
          code=$?
          set -e

          case "$code" in
            0)
              echo '### Cloudflare Terraform plan: NO CHANGES' >> "$GITHUB_STEP_SUMMARY"
              ;;
            2)
              echo '### Cloudflare Terraform plan: CHANGES REQUIRE REVIEW' >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo '### Cloudflare Terraform plan: FAILED' >> "$GITHUB_STEP_SUMMARY"
              exit "$code"
              ;;
          esac

          terraform -chdir=infra/cloudflare show -no-color \
            "$RUNNER_TEMP/cloudflare.tfplan"

          exit 0
