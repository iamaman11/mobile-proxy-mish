name: Integration Full CI Trigger

on:
  push:
    branches: [integration/m1]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch deliberate full CI
    if: ${{ contains(github.event.head_commit.message, '[full-ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch CI on exact integration branch head
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          payload='{"ref":"integration/m1"}'
          curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/ci.yml/dispatches" \
            --data "$payload"
          echo 'FULL_CI_DISPATCH=REQUESTED' >> "$GITHUB_STEP_SUMMARY"
