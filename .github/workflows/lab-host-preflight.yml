name: LAB Host Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-host-preflight
  cancel-in-progress: false

jobs:
  host-preflight:
    name: LAB Host Preflight
    if: ${{ github.ref == 'refs/heads/main' && github.ref_protected == true }}
    runs-on: [self-hosted, windows, x64, mobile-proxy-mish-lab]
    timeout-minutes: 45
    env:
      LAB_POWERSHELL_EXE: C:\mish-lab\tools\powershell-7.6.6\pwsh.exe
    steps:
      - name: Checkout accepted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true

      - name: Execute host-only preflight
        shell: cmd
        run: |
          if not exist "%LAB_POWERSHELL_EXE%" (
            echo Pinned LAB PowerShell executable is absent: %LAB_POWERSHELL_EXE%
            exit /b 2
          )
          "%LAB_POWERSHELL_EXE%" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\lab\windows\host-preflight.ps1" -RepositoryRoot "%GITHUB_WORKSPACE%" -EvidencePath "%RUNNER_TEMP%\mish-lab-host-preflight.json"
          exit /b %ERRORLEVEL%

      - name: Publish redacted run summary
        if: ${{ always() }}
        shell: cmd
        run: |
          >>"%GITHUB_STEP_SUMMARY%" echo ### LAB-1 host preflight
          >>"%GITHUB_STEP_SUMMARY%" echo - Commit: `%GITHUB_SHA%`
          >>"%GITHUB_STEP_SUMMARY%" echo - Ref: `%GITHUB_REF%`
          if exist "%RUNNER_TEMP%\mish-lab-host-preflight.json" (
            >>"%GITHUB_STEP_SUMMARY%" echo - Typed evidence file: **produced**
          ) else (
            >>"%GITHUB_STEP_SUMMARY%" echo - Typed evidence file: **not produced**
          )
          >>"%GITHUB_STEP_SUMMARY%" echo - Evidence domain: **Windows host/toolchain fixture only**
          >>"%GITHUB_STEP_SUMMARY%" echo - This run does **not** claim E3, Mesh, proxy serving, or product READY.

      - name: Upload typed LAB-1 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lab-host-preflight-evidence
          path: ${{ runner.temp }}\mish-lab-host-preflight.json
          if-no-files-found: error
          retention-days: 30
