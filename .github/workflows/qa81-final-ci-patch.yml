name: QA81 Final CI Contract Patch

on:
  push:
    branches: [qa/81-remediation]
    paths:
      - tools/qa81_final_ci_patch.py
      - .github/workflows/qa81-final-ci-patch.yml

permissions:
  contents: write

concurrency:
  group: qa81-final-ci-patch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: qa/81-remediation
          fetch-depth: 0
      - name: Apply exact patch
        run: |
          set -euo pipefail
          python3 tools/qa81_final_ci_patch.py
          changed="$(git status --short)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | wc -l)" -eq 3
          printf '%s\n' "$changed" | grep -Fq '.github/workflows/ci.yml'
          printf '%s\n' "$changed" | grep -Fq 'android/app/src/main/AndroidManifest.xml'
          printf '%s\n' "$changed" | grep -Fq 'crates/android-ffi/src/lib.rs'
      - name: Commit bounded patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml android/app/src/main/AndroidManifest.xml crates/android-ffi/src/lib.rs
          git commit -m 'CI: verify owned Android proxy runtime packaging'
          git push origin HEAD:qa/81-remediation
