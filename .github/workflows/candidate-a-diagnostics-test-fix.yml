name: Candidate A Diagnostics Fixture Fix

on:
  push:
    branches:
      - rotation/candidate-a-product
    paths:
      - .github/workflows/candidate-a-diagnostics-test-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: rotation/candidate-a-product
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.6.0'

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup override set 1.98.1

      - name: Migrate diagnostics timing fixture
        run: python3 tools/fix_candidate_a_diag_fixture.py

      - name: Verify migrated unit test
        run: gradle --no-daemon -p android :app:testDebugUnitTest

      - name: Verify bounded patch
        run: |
          git diff --check
          if grep -E 'airplaneEnable|radioPowerOff|cellularRequestRearm|firstPlatformCellularObservation|platformCellularObservationsAfterRearm' android/app/src/test/java/com/mobileproxymish/app/MishDiagnosticsSerializationTest.kt; then
            echo 'obsolete diagnostics timing fixture remains' >&2
            exit 1
          fi
          grep -F 'mobileDataPreconditionObservedMs = 611uL' android/app/src/test/java/com/mobileproxymish/app/MishDiagnosticsSerializationTest.kt
          grep -F 'dataEnableEffectCompletedMs = 1_020uL' android/app/src/test/java/com/mobileproxymish/app/MishDiagnosticsSerializationTest.kt
          rm tools/fix_candidate_a_diag_fixture.py
          rm .github/workflows/candidate-a-diagnostics-test-fix.yml

      - name: Commit validated fixture migration
        run: |
          git config user.name "iamaman11"
          git config user.email "44100369+iamaman11@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'fixture migration produced no changes' >&2; exit 1; }
          git commit -m "Tests: align diagnostics timing with Candidate A"
          git push origin HEAD:rotation/candidate-a-product
