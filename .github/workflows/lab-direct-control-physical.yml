name: LAB Direct CONTROL Physical Acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/lab-direct-control-physical.yml'

permissions:
  contents: read

concurrency:
  group: lab-direct-control-physical
  cancel-in-progress: false

jobs:
  build:
    name: Build self-contained Windows acceptance harness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact acceptance source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Build self-contained live harness
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/mish-direct-control-live"
          out="$RUNNER_TEMP/mish-direct-control-publish"
          mkdir -p "$dir" "$out"
          sdk_project="$(realpath sdk/dotnet/Mish.Control/Mish.Control.csproj)"

          cat >"$dir/Live.csproj" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="$sdk_project" />
            </ItemGroup>
          </Project>
          EOF

          cat >"$dir/Program.cs" <<'EOF'
          using System.Net;
          using Mish.Control;

          static void Require(bool condition, string message)
          {
              if (!condition) throw new InvalidOperationException(message);
          }

          static bool InMeshCidr(string host)
          {
              if (!IPAddress.TryParse(host, out var address)) return false;
              var bytes = address.GetAddressBytes();
              return bytes.Length == 4 &&
                  bytes[0] == 100 &&
                  (bytes[1] & 0xF0) == 96;
          }

          static void ValidateBundle(ProxyConnectionResponse bundle)
          {
              Require(bundle.Ready, $"proxy not ready: {bundle.Reason}");
              Require(bundle.Reason == ProxyConnectionReason.None, $"unexpected proxy reason: {bundle.Reason}");
              Require(bundle.Host is not null && InMeshCidr(bundle.Host), "proxy host is outside Mesh CIDR");
              Require(bundle.Ports is not null, "proxy ports unavailable");
              Require(bundle.Ports.Mixed == 1080, "mixed port mismatch");
              Require(bundle.Ports.Socks5 == 1081, "socks5 port mismatch");
              Require(bundle.Ports.Http == 3128, "http port mismatch");
              Require(!string.IsNullOrWhiteSpace(bundle.Username), "proxy username unavailable");
              Require(!string.IsNullOrWhiteSpace(bundle.Password), "proxy password unavailable");
          }

          static async Task ProxyE2EAsync(ProxyConnectionResponse bundle)
          {
              var proxy = new WebProxy($"http://{bundle.Host}:{bundle.Ports!.Http}")
              {
                  Credentials = new NetworkCredential(bundle.Username, bundle.Password),
              };
              using var handler = new HttpClientHandler
              {
                  UseProxy = true,
                  Proxy = proxy,
                  AllowAutoRedirect = false,
              };
              using var http = new HttpClient(handler)
              {
                  Timeout = TimeSpan.FromSeconds(20),
              };
              using var response = await http.GetAsync("https://example.com/");
              Require(response.IsSuccessStatusCode, $"proxy E2E HTTP {(int)response.StatusCode}");
          }

          var token = Environment.GetEnvironmentVariable("MISH_MANAGER_TOKEN");
          Require(!string.IsNullOrWhiteSpace(token) && token.Length >= 32, "manager token unavailable");

          const string poisoned = "http://127.0.0.1:9";
          foreach (var name in new[] { "HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY" })
          {
              Environment.SetEnvironmentVariable(name, poisoned);
          }
          Require(Environment.GetEnvironmentVariable("HTTPS_PROXY") == poisoned, "ambient proxy poison was not applied");

          using var client = new MishControlClient(token);

          var first = await client.GetProxyAsync();
          ValidateBundle(first);
          await ProxyE2EAsync(first);
          Console.WriteLine("MISH_DIRECT_CONTROL_GET_BEFORE=PASS");
          Console.WriteLine("MISH_DIRECT_CONTROL_PROXY_E2E_BEFORE=PASS");

          var rotation = await client.RotateIpAsync();
          Require(rotation.Terminal, "rotation was not terminal");
          Require(rotation.Reason == RotateReason.None, $"rotation reason={rotation.Reason}");
          Require(rotation.Result is RotateResult.Changed or RotateResult.Unchanged, $"rotation result={rotation.Result}");
          Require(rotation.Timing.DurationMs <= 18000, $"rotation duration exceeded manager bound: {rotation.Timing.DurationMs}");
          Console.WriteLine($"MISH_DIRECT_CONTROL_ROTATE={rotation.Result}/duration_ms={rotation.Timing.DurationMs}");

          var second = await client.GetProxyAsync();
          ValidateBundle(second);
          await ProxyE2EAsync(second);
          Console.WriteLine("MISH_DIRECT_CONTROL_GET_AFTER=PASS");
          Console.WriteLine("MISH_DIRECT_CONTROL_PROXY_E2E_AFTER=PASS");
          Console.WriteLine("MISH_DIRECT_CONTROL_AMBIENT_PROXY_BYPASS=PASS");
          EOF

          dotnet publish "$dir/Live.csproj"             --configuration Release             --runtime win-x64             --self-contained true             --output "$out"             -p:PublishSingleFile=true             -p:PublishTrimmed=false             --nologo

          test -f "$out/Live.exe"

      - name: Upload exact live harness
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: direct-control-live-win-x64
          path: ${{ runner.temp }}/mish-direct-control-publish
          if-no-files-found: error
          retention-days: 1

  physical:
    name: Ambient proxy poisoned -> SDK direct CONTROL -> DEVICE-1
    needs: build
    runs-on: [self-hosted, windows, x64, mobile-proxy-mish-lab]
    timeout-minutes: 15
    environment: cloudflare-control
    env:
      MISH_MANAGER_TOKEN: ${{ secrets.MISH_MANAGER_TOKEN }}
    steps:
      - name: Download exact live harness
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: direct-control-live-win-x64
          path: ${{ runner.temp }}\mish-direct-control-live

      - name: Run physical direct-CONTROL acceptance with poisoned ambient proxy
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
        shell: 'C:\mish-lab\tools\powershell-7.6.6\pwsh.exe -NoLogo -NoProfile -NonInteractive -Command "& ([ScriptBlock]::Create((Get-Content -Raw -LiteralPath ''{0}'')))"'
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:RUNNER_TEMP 'mish-direct-control-live\Live.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
              throw 'Self-contained live acceptance executable is missing.'
          }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "MISH_DIRECT_CONTROL_HARNESS_SHA256=$hash"
          & $exe
          if ($LASTEXITCODE -ne 0) {
              throw "Live acceptance executable failed with exit code $LASTEXITCODE."
          }
