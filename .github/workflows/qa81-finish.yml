name: QA81 Bounded Finish Patch

on:
  push:
    branches: [qa/81-remediation]
    paths:
      - .github/workflows/qa81-finish.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: qa/81-remediation
          fetch-depth: 0
      - name: Apply bounded lifecycle and CI contract patch
        shell: python
        run: |
          from pathlib import Path

          supervisor = Path('android/app/src/main/java/com/mobileproxymish/app/ProxyRuntimeSupervisor.kt')
          text = supervisor.read_text()
          old = '    private val startRequested = AtomicBoolean(false)\n'
          assert old in text
          text = text.replace(old, '')

          old = '''    fun start() {
        if (closed.get() || !startRequested.compareAndSet(false, true)) return
        mutableSnapshot.value = ProxyRuntimeSnapshot.Starting
        try {
            executor.execute(::startBlocking)
        } catch (_: RejectedExecutionException) {
            mutableSnapshot.value = ProxyRuntimeSnapshot.Failed(ProxyRuntimeFailure.ChildLaunchFailed)
        }
    }
'''
          new = '''    fun start() {
        if (closed.get()) return
        synchronized(lock) {
            when (mutableSnapshot.value) {
                ProxyRuntimeSnapshot.Starting,
                ProxyRuntimeSnapshot.Running,
                -> return

                ProxyRuntimeSnapshot.Stopped,
                is ProxyRuntimeSnapshot.Failed,
                -> mutableSnapshot.value = ProxyRuntimeSnapshot.Starting
            }
        }
        try {
            executor.execute(::startBlocking)
        } catch (_: RejectedExecutionException) {
            mutableSnapshot.value = ProxyRuntimeSnapshot.Failed(ProxyRuntimeFailure.ChildLaunchFailed)
        }
    }
'''
          assert old in text
          text = text.replace(old, new)

          old = '''            runtimeDir.mkdirs()
            if (!binaryFile.isFile || !binaryFile.canExecute()) {
'''
          new = '''            if (!runtimeDir.isDirectory && !runtimeDir.mkdirs()) {
                mutableSnapshot.value = ProxyRuntimeSnapshot.Failed(
                    ProxyRuntimeFailure.ConfigurationRejected,
                )
                return
            }
            if (!binaryFile.isFile || !binaryFile.canExecute()) {
'''
          assert old in text
          text = text.replace(old, new)

          old = '''            // sing-box has consumed the configuration; remove runtime credential material from disk.
            configFile.delete()
            child = newChild
'''
          new = '''            // sing-box has consumed the configuration. Runtime credential material must not
            // survive on disk after the child is healthy.
            if (!deleteIfPresent(configFile)) {
                terminateProcess(newChild, newPid)
                deleteIfPresent(pidFile)
                runCatching { newBridge.stop() }
                mutableSnapshot.value = ProxyRuntimeSnapshot.Failed(
                    ProxyRuntimeFailure.CleanupFailed,
                )
                return
            }
            child = newChild
'''
          assert old in text
          text = text.replace(old, new)

          old = '''    private fun cleanupStaleChild(): Boolean {
        configFile.delete()
        if (!pidFile.isFile) return true
'''
          new = '''    private fun cleanupStaleChild(): Boolean {
        if (!deleteIfPresent(configFile)) return false
        if (!pidFile.isFile) return true
'''
          assert old in text
          text = text.replace(old, new)

          old = '''        if (!procDir.exists()) {
            pidFile.delete()
            return true
        }
'''
          new = '''        if (!procDir.exists()) {
            return deleteIfPresent(pidFile)
        }
'''
          assert old in text
          text = text.replace(old, new)

          old = '''        if (procDir.exists()) return false
        pidFile.delete()
        return true
    }
'''
          new = '''        if (procDir.exists()) return false
        return deleteIfPresent(pidFile)
    }
'''
          assert old in text
          text = text.replace(old, new)

          old = '''        configFile.delete()
        pidFile.delete()
        stopping = false
        return clean
    }

    override fun close() {
'''
          new = '''        if (!deleteIfPresent(configFile)) clean = false
        if (!deleteIfPresent(pidFile)) clean = false
        stopping = false
        return clean
    }

    fun stop() {
        if (closed.get()) return
        try {
            executor.execute {
                val clean = synchronized(lock) { cleanupCurrentLocked() }
                mutableSnapshot.value = if (clean) {
                    ProxyRuntimeSnapshot.Stopped
                } else {
                    ProxyRuntimeSnapshot.Failed(ProxyRuntimeFailure.CleanupFailed)
                }
            }
        } catch (_: RejectedExecutionException) {
            mutableSnapshot.value = ProxyRuntimeSnapshot.Failed(ProxyRuntimeFailure.CleanupFailed)
        }
    }

    private fun deleteIfPresent(file: File): Boolean = !file.exists() || file.delete() || !file.exists()

    override fun close() {
'''
          assert old in text
          text = text.replace(old, new)
          supervisor.write_text(text)

          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text()
          old = '          for symbol in CellularController admissionSnapshot observeNetwork networkLost; do\n'
          new = '          for symbol in CellularController admissionSnapshot observeNetwork networkLost startBridge CellularBridgeRuntime renderProxyRuntimeConfig; do\n'
          assert old in text
          text = text.replace(old, new)

          old = '''          NATIVE="android/app/build/generated/rust-jni/$MISH_TARGET_ABI/libmish_android_ffi.so"
          test -f "$APK"
          test -f "$TEST_APK"
          test -f "$NATIVE"
          unzip -l "$APK" | grep -q "lib/$MISH_TARGET_ABI/libmish_android_ffi.so"
          unzip -l "$APK" | grep -q "lib/$MISH_TARGET_ABI/libjnidispatch.so"
'''
          new = '''          NATIVE="android/app/build/generated/rust-jni/$MISH_TARGET_ABI/libmish_android_ffi.so"
          SING_BOX="android/app/build/generated/sing-box-jni/$MISH_TARGET_ABI/libsingbox.so"
          test -f "$APK"
          test -f "$TEST_APK"
          test -f "$NATIVE"
          test -f "$SING_BOX"
          unzip -l "$APK" | grep -q "lib/$MISH_TARGET_ABI/libmish_android_ffi.so"
          unzip -l "$APK" | grep -q "lib/$MISH_TARGET_ABI/libjnidispatch.so"
          unzip -l "$APK" | grep -q "lib/$MISH_TARGET_ABI/libsingbox.so"
          PACKAGED_SING_BOX="$RUNNER_TEMP/libsingbox.so"
          unzip -p "$APK" "lib/$MISH_TARGET_ABI/libsingbox.so" > "$PACKAGED_SING_BOX"
          cmp "$SING_BOX" "$PACKAGED_SING_BOX"
          test "$(head -c 4 "$PACKAGED_SING_BOX" | od -An -tx1 | tr -d ' \\n')" = '7f454c46'
'''
          assert old in text
          text = text.replace(old, new)
          ci.write_text(text)

          changed = {line[3:] for line in __import__('subprocess').check_output(['git','status','--short'], text=True).splitlines()}
          expected = {
              'android/app/src/main/java/com/mobileproxymish/app/ProxyRuntimeSupervisor.kt',
              '.github/workflows/ci.yml',
          }
          assert changed == expected, (changed, expected)
      - name: Commit exact bounded patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml android/app/src/main/java/com/mobileproxymish/app/ProxyRuntimeSupervisor.kt
          git commit -m 'Runtime: make proxy lifecycle restartable and cleanup-verifiable'
          git push origin HEAD:qa/81-remediation
