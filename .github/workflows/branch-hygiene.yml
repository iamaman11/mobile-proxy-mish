name: MISH Evidence-Locked Branch Hygiene

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: mish-branch-hygiene
  cancel-in-progress: false

jobs:
  verify-and-prune:
    name: Exact-SHA branch audit / guarded deletion
    if: >-
      github.event.issue.number == 457 &&
      github.event.comment.user.login == 'iamaman11' &&
      (startsWith(github.event.comment.body, '/mish-maint branches-dry-run ') ||
       startsWith(github.event.comment.body, '/mish-maint branches-prune '))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MISH_BRANCH_COMMAND: ${{ github.event.comment.body }}
      MISH_COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
    steps:
      - name: Checkout protected main (never build or install PRODUCT)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Syntax check and run exact ref guard
        shell: bash
        run: |
          python3 -m py_compile tools/maintenance/branch_hygiene.py
          python3 tools/maintenance/branch_hygiene.py
      - name: Preserve bounded per-ref evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mish-branch-hygiene-${{ github.run_id }}
          path: branch-hygiene-receipt.json
          if-no-files-found: warn
          retention-days: 90
