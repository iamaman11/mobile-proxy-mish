name: Device Candidate Physical

on:
  pull_request:
    paths:
      - '.github/workflows/device-candidate-physical.yml'
      - 'lab/windows/install-device-candidate.ps1'
      - 'lab/windows/test-device-candidate.ps1'
      - 'lab/windows/toolchain.json'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Integration PR number whose current exact head should be installed on DEVICE-1'
        required: true
        type: string
      expected_head_sha:
        description: 'Optional 40-hex guard for the expected PR head'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: device-candidate-physical
  cancel-in-progress: false

jobs:
  contract:
    name: Device Candidate Consumer Contract
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse and exercise candidate verifier on Windows PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            'lab/windows/install-device-candidate.ps1',
            'lab/windows/test-device-candidate.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error "${path}: $($_.Message)" }
              throw "PowerShell parse failed for $path."
            }
          }
          ./lab/windows/test-device-candidate.ps1

  resolve:
    name: Resolve exact successful candidate
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pr_number: ${{ steps.candidate.outputs.pr_number }}
      source_sha: ${{ steps.candidate.outputs.source_sha }}
      head_branch: ${{ steps.candidate.outputs.head_branch }}
      artifact_id: ${{ steps.candidate.outputs.artifact_id }}
      artifact_name: ${{ steps.candidate.outputs.artifact_name }}
      artifact_digest: ${{ steps.candidate.outputs.artifact_digest }}
      run_id: ${{ steps.candidate.outputs.run_id }}
    steps:
      - name: Resolve current PR head and exact successful artifact
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          if [[ -n "$EXPECTED_HEAD_SHA" ]]; then
            [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          fi

          ROOT="$RUNNER_TEMP/device-candidate-resolve"
          mkdir -p "$ROOT"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$ROOT/pr.json"

          readarray -t PR_META < <(python3 - "$ROOT/pr.json" "$GITHUB_REPOSITORY" "$PR_NUMBER" "$EXPECTED_HEAD_SHA" <<'PY'
          import json
          import re
          import sys
          path, repository, requested_pr, expected = sys.argv[1:]
          pr = json.load(open(path, encoding='utf-8'))
          head = str((pr.get('head') or {}).get('sha') or '')
          head_branch = str((pr.get('head') or {}).get('ref') or '')
          head_repo = str((((pr.get('head') or {}).get('repo') or {}).get('full_name')) or '')
          base = str((pr.get('base') or {}).get('ref') or '')
          if pr.get('state') != 'open' or pr.get('draft') is not False:
              raise SystemExit('device candidate requires an open ready PR')
          if str(pr.get('number')) != requested_pr:
              raise SystemExit('resolved PR identity mismatch')
          if base != 'fix/root-policy-reconciliation':
              raise SystemExit('device candidate PR must target fix/root-policy-reconciliation')
          if head_repo != repository:
              raise SystemExit('device candidate must originate from the canonical repository')
          if not re.fullmatch(r'[0-9a-f]{40}', head):
              raise SystemExit('device candidate head SHA is invalid')
          if expected and head != expected:
              raise SystemExit('current PR head does not match expected_head_sha')
          if not head_branch:
              raise SystemExit('device candidate head branch is missing')
          print(head)
          print(head_branch)
          PY
          )
          SOURCE_SHA="${PR_META[0]}"
          HEAD_BRANCH="${PR_META[1]}"
          ARTIFACT_NAME="device-candidate-pr-$PR_NUMBER-$SOURCE_SHA"

          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$ARTIFACT_NAME&per_page=100" > "$ROOT/artifacts.json"
          readarray -t ART_META < <(python3 - "$ROOT/artifacts.json" "$ARTIFACT_NAME" "$SOURCE_SHA" "$HEAD_BRANCH" <<'PY'
          import json
          import re
          import sys
          path, name, source, branch = sys.argv[1:]
          data = json.load(open(path, encoding='utf-8'))
          matches = []
          for artifact in data.get('artifacts', []):
              run = artifact.get('workflow_run') or {}
              digest = str(artifact.get('digest') or '')
              if (
                  artifact.get('name') == name
                  and artifact.get('expired') is False
                  and run.get('head_sha') == source
                  and run.get('head_branch') == branch
                  and re.fullmatch(r'sha256:[0-9a-f]{64}', digest)
              ):
                  matches.append(artifact)
          if not matches:
              raise SystemExit('no non-expired exact-head device candidate artifact exists')
          matches.sort(key=lambda item: (str(item.get('created_at') or ''), int(item.get('id') or 0)), reverse=True)
          artifact = matches[0]
          run = artifact.get('workflow_run') or {}
          print(int(artifact['id']))
          print(int(run['id']))
          print(str(artifact['digest']))
          PY
          )
          ARTIFACT_ID="${ART_META[0]}"
          RUN_ID="${ART_META[1]}"
          ARTIFACT_DIGEST="${ART_META[2]}"

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$ROOT/run.json"
          python3 - "$ROOT/run.json" "$SOURCE_SHA" "$HEAD_BRANCH" "$PR_NUMBER" <<'PY'
          import json
          import sys
          path, source, branch, pr_number = sys.argv[1:]
          run = json.load(open(path, encoding='utf-8'))
          if run.get('name') != 'Integration Android Preflight':
              raise SystemExit('candidate artifact did not originate from Integration Android Preflight')
          if run.get('path') != '.github/workflows/integration-android-preflight.yml':
              raise SystemExit('candidate workflow path mismatch')
          if run.get('event') != 'pull_request' or run.get('status') != 'completed' or run.get('conclusion') != 'success':
              raise SystemExit('candidate workflow is not a successful completed PR run')
          if run.get('head_sha') != source or run.get('head_branch') != branch:
              raise SystemExit('candidate workflow head identity mismatch')
          prs = run.get('pull_requests') or []
          if prs and all(str(item.get('number')) != pr_number for item in prs):
              raise SystemExit('candidate workflow PR identity mismatch')
          PY

          {
            echo "pr_number=$PR_NUMBER"
            echo "source_sha=$SOURCE_SHA"
            echo "head_branch=$HEAD_BRANCH"
            echo "artifact_id=$ARTIFACT_ID"
            echo "artifact_name=$ARTIFACT_NAME"
            echo "artifact_digest=$ARTIFACT_DIGEST"
            echo "run_id=$RUN_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Publish resolved candidate summary
        shell: bash
        run: |
          {
            echo '### Exact device candidate resolved'
            echo '- PR: `#${{ steps.candidate.outputs.pr_number }}`'
            echo '- Source: `${{ steps.candidate.outputs.source_sha }}`'
            echo '- Hosted run: `${{ steps.candidate.outputs.run_id }}`'
            echo '- Artifact: `${{ steps.candidate.outputs.artifact_name }}`'
            echo '- Artifact digest: `${{ steps.candidate.outputs.artifact_digest }}`'
            echo '- Local build required: **NO**'
          } >> "$GITHUB_STEP_SUMMARY"

  physical:
    name: Install exact candidate on DEVICE-1
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected == true }}
    needs: resolve
    runs-on: [self-hosted, windows, x64, mobile-proxy-mish-lab]
    timeout-minutes: 15
    env:
      ADB_EXE: C:\mish-lab\tools\android-sdk\platform-tools\adb.exe
      ANDROID_SDK_ROOT: C:\mish-lab\tools\android-sdk
    steps:
      - name: Checkout accepted main consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true

      - name: Verify physical DEVICE-1 prerequisites
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath $env:ADB_EXE -PathType Leaf)) {
            throw "MISH_DEVICE_CANDIDATE_FAILURE|HOST_PREREQUISITE_MISSING|ADB is missing: $env:ADB_EXE"
          }
          $deviceRows = @(& $env:ADB_EXE devices | Where-Object { $_ -match '^\S+\s+device\s*$' })
          if ($LASTEXITCODE -ne 0 -or $deviceRows.Count -ne 1) {
            throw 'MISH_DEVICE_CANDIDATE_FAILURE|DEVICE_UNAVAILABLE|Exactly one authorized DEVICE-1 is required.'
          }
          $api = (& $env:ADB_EXE shell getprop ro.build.version.sdk).Trim()
          $abi = (& $env:ADB_EXE shell getprop ro.product.cpu.abi).Trim()
          if ($api -ne '30') {
            throw "MISH_DEVICE_CANDIDATE_FAILURE|DEVICE_IDENTITY_MISMATCH|DEVICE-1 API must be 30; observed $api."
          }
          if ($abi -ne 'armeabi-v7a') {
            throw "MISH_DEVICE_CANDIDATE_FAILURE|DEVICE_IDENTITY_MISMATCH|DEVICE-1 ABI must be armeabi-v7a; observed $abi."
          }
          Write-Host 'DEVICE-1 prerequisite check passed: one authorized API 30 / armeabi-v7a device.'

      - name: Download exact hosted candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.resolve.outputs.artifact_id }}
          path: ${{ runner.temp }}\mish-device-candidate
          github-token: ${{ github.token }}
          repository: iamaman11/mobile-proxy-mish
          run-id: ${{ needs.resolve.outputs.run_id }}
          merge-multiple: false

      - name: Verify, stable-sign, and install without rebuilding
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $receiptPath = "$env:RUNNER_TEMP\mish-device-candidate-install.json"
          try {
            $candidateDirectory = Join-Path `
              "$env:RUNNER_TEMP\mish-device-candidate" `
              '${{ needs.resolve.outputs.artifact_name }}'
            $manifestPath = Join-Path $candidateDirectory 'candidate.json'
            if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
              throw 'MISH_DEVICE_CANDIDATE_FAILURE|DOWNLOAD_LAYOUT_MISMATCH|Resolved artifact directory does not contain candidate.json.'
            }
            $receipt = & '.\lab\windows\install-device-candidate.ps1' `
              -CandidateDirectory $candidateDirectory `
              -ExpectedPrNumber '${{ needs.resolve.outputs.pr_number }}' `
              -ExpectedSourceSha '${{ needs.resolve.outputs.source_sha }}' `
              -AdbPath $env:ADB_EXE `
              -AndroidSdkRoot $env:ANDROID_SDK_ROOT
            $receipt | Set-Content -Encoding UTF8 -LiteralPath $receiptPath
          }
          catch {
            $message = [string]$_.Exception.Message
            $category = 'UNCLASSIFIED'
            if ($message -match 'MISH_DEVICE_CANDIDATE_FAILURE\|([^|]+)\|') {
              $category = $Matches[1]
            }
            [pscustomobject]@{
              result = 'FAIL'
              category = $category
              pr_number = [int]'${{ needs.resolve.outputs.pr_number }}'
              source_sha = '${{ needs.resolve.outputs.source_sha }}'
              application_id = 'com.mobileproxymish.app.debug'
              installed = $false
              local_build = $false
            } | ConvertTo-Json -Compress | Set-Content -Encoding UTF8 -LiteralPath $receiptPath
            throw
          }

      - name: Publish physical handoff summary
        if: ${{ always() }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $receiptPath = "$env:RUNNER_TEMP\mish-device-candidate-install.json"
          $result = 'NO_RECEIPT'
          $category = 'NONE'
          if (Test-Path -LiteralPath $receiptPath -PathType Leaf) {
            try {
              $receipt = Get-Content -Raw -LiteralPath $receiptPath | ConvertFrom-Json
              $result = [string]$receipt.result
              if ($receipt.PSObject.Properties.Name -contains 'category') {
                $category = [string]$receipt.category
              }
            }
            catch {
              $result = 'INVALID_RECEIPT'
              $category = 'RECEIPT_PARSE_FAILED'
            }
          }
          @(
            '### DEVICE-1 candidate handoff',
            '- PR: `#${{ needs.resolve.outputs.pr_number }}`',
            '- Source: `${{ needs.resolve.outputs.source_sha }}`',
            '- Artifact: `${{ needs.resolve.outputs.artifact_name }}`',
            '- Hosted build reused: **YES**',
            '- Local Gradle/Rust/NDK build: **NO**',
            '- Portable PowerShell prerequisite: **NO**',
            '- Target package: `com.mobileproxymish.app.debug`',
            "- Install result: **$result**",
            "- Failure category: `$category`"
          ) | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload bounded install receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: device-candidate-install-pr-${{ needs.resolve.outputs.pr_number }}-${{ needs.resolve.outputs.source_sha }}
          path: ${{ runner.temp }}\mish-device-candidate-install.json
          if-no-files-found: error
          retention-days: 7
