name: Candidate A Boundary Cleanup

on:
  push:
    branches:
      - rotation/candidate-a-product
    paths:
      - .github/workflows/candidate-a-boundary-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: rotation/candidate-a-product
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.98.1

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.6.0'

      - name: Normalize stored CONTROL replay for asserted cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/runtime/src/product_runtime.rs")
          text = path.read_text(encoding="utf-8")
          old = '''            let _ = generation.control().start(
                          control.public_key_spki,
                          control.signer,
                          control.cellular_request_rearm,
                      );'''
          new = '''            let _ = generation.control().start(
                          control.public_key_spki.clone(),
                          Arc::clone(&control.signer),
                          Arc::clone(&control.cellular_request_rearm),
                      );'''
          if text.count(old) != 1:
              raise SystemExit(f"stored CONTROL replay shape drift: {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Apply exact asserted boundary cleanup
        run: python3 tools/apply_candidate_a_boundary_cleanup.py

      - name: Format Rust
        run: cargo fmt --all

      - name: Verify architecture
        run: python3 tools/check_architecture.py

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Kotlin compile and lint
        run: >-
          gradle --no-daemon -p android
          :app:compileDebugKotlin
          :app:lintDebug

      - name: Verify clean final patch
        run: |
          rm -rf tools/__pycache__
          git diff --check
          test ! -e tools/apply_candidate_a_boundary_cleanup.py
          test ! -e .github/workflows/candidate-a-boundary-cleanup.yml
          test ! -e .github/workflows/candidate-a-compile.yml
          test ! -e crates/runtime/src/airplane_effect.rs
          test ! -e android/app/src/main/java/com/mobileproxymish/app/cellular/CellularRadioPowerObserver.kt
          ! grep -R --line-number -E 'CellularRequestRearmEffect|observe_radio_power_off|observeRadioPowerOff|rearmNetworkRequest|AirplaneEnabling|WaitingRadioDown|AirplaneDisabling' crates/rotation crates/runtime crates/android-ffi android/app/src/main/java
          git status --short

      - name: Commit validated boundary cleanup
        run: |
          git config user.name "iamaman11"
          git config user.email "44100369+iamaman11@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'boundary cleanup produced no changes' >&2; exit 1; }
          git commit -m "Rotation: remove airplane compatibility boundary"
          git push origin HEAD:rotation/candidate-a-product
