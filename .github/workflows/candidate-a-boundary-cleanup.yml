name: Candidate A Boundary Cleanup

on:
  push:
    branches:
      - rotation/candidate-a-product
    paths:
      - .github/workflows/candidate-a-boundary-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: rotation/candidate-a-product
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.98.1

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.6.0'

      - name: Remove stored CONTROL rearm for asserted cleanup
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          path = Path("crates/runtime/src/product_runtime.rs")
          text = path.read_text(encoding="utf-8")
          pattern = r'''            let _ = generation\.control\(\)\.start\(\n\s+control\.public_key_spki,\n\s+control\.signer,\n\s+control\.cellular_request_rearm,\n\s+\);'''
          replacement = '''            let _ = generation.control().start(
                    control.public_key_spki,
                    control.signer,
                );'''
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"stored CONTROL replay shape drift: {count}")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Remove obsolete rearm test fixture
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          path = Path("crates/runtime/src/product_runtime.rs")
          text = path.read_text(encoding="utf-8")
          fixture = r'''\n    struct TestControlRearmEffect;\n\n    impl CellularRequestRearmEffect for TestControlRearmEffect \{\n        fn rearm_cellular_request\(&self\) -> bool \{\n            true\n        \}\n    \}\n'''
          text, fixture_count = re.subn(fixture, "\n", text, count=1)
          if fixture_count != 1:
              raise SystemExit(f"rearm test fixture drift: {fixture_count}")
          arg = "                Arc::new(TestControlRearmEffect),\n"
          arg_count = text.count(arg)
          if arg_count != 3:
              raise SystemExit(f"rearm test call count drift: {arg_count}")
          text = text.replace(arg, "")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply exact asserted boundary cleanup
        id: apply_cleanup
        continue-on-error: true
        run: python3 tools/apply_candidate_a_boundary_cleanup.py

      - name: Require complete asserted transform
        run: |
          if [ "${{ steps.apply_cleanup.outcome }}" != success ]; then
            echo '--- residual product runtime rearm tokens ---'
            grep -n -C 3 -E 'CellularRequestRearmEffect|cellular_request_rearm|observe_radio_power_off|observe_platform_cellular_observation|TestControlRearmEffect' crates/runtime/src/product_runtime.rs || true
            echo '--- residual control runtime rearm tokens ---'
            grep -n -C 3 -E 'CellularRequestRearmEffect|cellular_request_rearm' crates/runtime/src/control_runtime.rs || true
            exit 1
          fi

      - name: Format Rust
        run: cargo fmt --all

      - name: Verify architecture
        run: python3 tools/check_architecture.py

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Kotlin compile and lint
        run: >-
          gradle --no-daemon -p android
          :app:compileDebugKotlin
          :app:lintDebug

      - name: Verify clean final patch
        run: |
          rm -rf tools/__pycache__
          git diff --check
          test ! -e tools/apply_candidate_a_boundary_cleanup.py
          test ! -e .github/workflows/candidate-a-boundary-cleanup.yml
          test ! -e .github/workflows/candidate-a-compile.yml
          test ! -e crates/runtime/src/airplane_effect.rs
          test ! -e android/app/src/main/java/com/mobileproxymish/app/cellular/CellularRadioPowerObserver.kt
          ! grep -R --line-number -E 'CellularRequestRearmEffect|observe_radio_power_off|observeRadioPowerOff|rearmNetworkRequest|AirplaneEnabling|WaitingRadioDown|AirplaneDisabling|TestControlRearmEffect' crates/rotation crates/runtime crates/android-ffi android/app/src/main/java
          git status --short

      - name: Commit validated boundary cleanup
        run: |
          git config user.name "iamaman11"
          git config user.email "44100369+iamaman11@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'boundary cleanup produced no changes' >&2; exit 1; }
          git commit -m "Rotation: remove airplane compatibility boundary"
          git push origin HEAD:rotation/candidate-a-product
