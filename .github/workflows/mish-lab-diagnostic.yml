name: MISH LAB Diagnostic

on:
  push:
    branches:
      - mish-lab-control

permissions:
  contents: read

concurrency:
  group: mish-lab-diagnostic
  cancel-in-progress: false

jobs:
  snapshot:
    name: Read-only DEVICE-1 snapshot
    if: github.actor == 'iamaman11'
    runs-on: [self-hosted, windows, x64, mobile-proxy-mish-lab]
    timeout-minutes: 10
    steps:
      - name: Checkout protected main diagnostics bridge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          clean: true

      - name: Verify physical DEVICE-1 prerequisites
        shell: powershell
        run: |
          $adb = 'C:\mish-lab\tools\android-sdk\platform-tools\adb.exe'
          $pwsh = 'C:\mish-lab\tools\powershell-7.6.6\pwsh.exe'
          if (-not (Test-Path -LiteralPath $adb -PathType Leaf)) { throw "Canonical ADB is missing: $adb" }
          if (-not (Test-Path -LiteralPath $pwsh -PathType Leaf)) { throw "Canonical LAB PowerShell is missing: $pwsh" }
          $deviceRows = @(& $adb devices | Where-Object { $_ -match '^\S+\s+device\s*$' })
          if ($LASTEXITCODE -ne 0 -or $deviceRows.Count -ne 1) { throw 'Exactly one authorized DEVICE-1 is required.' }
          $api = (& $adb shell getprop ro.build.version.sdk).Trim()
          $abi = (& $adb shell getprop ro.product.cpu.abi).Trim()
          if ($api -ne '30') { throw "DEVICE-1 API must be 30; observed $api" }
          if ($abi -ne 'armeabi-v7a') { throw "DEVICE-1 ABI must be armeabi-v7a; observed $abi" }
          Write-Host 'DEVICE_1_PREREQUISITES=PASS'

      - name: Verify visible sing-box against all recorded generations without root
        shell: powershell
        run: |
          $adb = 'C:\mish-lab\tools\android-sdk\platform-tools\adb.exe'
          $package = 'com.mobileproxymish.app.debug'
          $runtimePath = 'no_backup/proxy-runtime'

          $rows = @(& $adb shell ps -A 2>$null)
          if ($LASTEXITCODE -ne 0) { throw 'Non-root Android process snapshot failed.' }
          $singBoxRows = @($rows | Where-Object { $_ -match '(?i)(?:libsingbox|sing-box)' })
          Write-Host "VISIBLE_SING_BOX_PROCESS_COUNT=$($singBoxRows.Count)"

          $manifest = (@(& $adb shell run-as $package cat "$runtimePath/sing-box-current-generation" 2>$null) -join "`n").Trim()
          $currentGeneration = $null
          if ($LASTEXITCODE -eq 0 -and $manifest -match '^generation=([A-Za-z0-9_-]{24})$') {
            $currentGeneration = $Matches[1]
          }

          $names = @(& $adb shell run-as $package ls $runtimePath 2>$null)
          if ($LASTEXITCODE -ne 0) { throw 'App-owned proxy runtime directory is unavailable.' }
          $pidFiles = @($names | Where-Object { $_ -match '^sing-box-([A-Za-z0-9_-]{24})\.pid$' })
          $recordedPidCount = 0
          $visibleMatchesAny = $false
          $visibleMatchesCurrent = $false
          $visibleMatchesNonCurrent = $false

          foreach ($pidFile in $pidFiles) {
            if ($pidFile -notmatch '^sing-box-([A-Za-z0-9_-]{24})\.pid$') { continue }
            $generation = $Matches[1]
            $pidText = (@(& $adb shell run-as $package cat "$runtimePath/$pidFile" 2>$null) -join "`n").Trim()
            if ($LASTEXITCODE -ne 0 -or $pidText -notmatch '^\d+$') { continue }
            $recordedPidCount += 1
            $escapedPid = [regex]::Escape($pidText)
            $matchesVisible = @($singBoxRows | Where-Object { $_ -match "^\S+\s+$escapedPid\s+" }).Count -eq 1
            if (-not $matchesVisible) { continue }
            $visibleMatchesAny = $true
            if ($null -ne $currentGeneration -and $generation -ceq $currentGeneration) {
              $visibleMatchesCurrent = $true
            } else {
              $visibleMatchesNonCurrent = $true
            }
          }

          Write-Host "RECORDED_GENERATION_PID_COUNT=$recordedPidCount"
          Write-Host "CURRENT_GENERATION_RECORD_AVAILABLE=$($null -ne $currentGeneration)"
          Write-Host "VISIBLE_PROCESS_HAS_ANY_RECORDED_GENERATION=$visibleMatchesAny"
          Write-Host "CURRENT_GENERATION_PROCESS_MATCH=$visibleMatchesCurrent"
          Write-Host "VISIBLE_PROCESS_MATCHES_NONCURRENT_RECORDED_GENERATION=$visibleMatchesNonCurrent"

      - name: Classify retained runtime identity without root
        shell: powershell
        run: |
          $adb = 'C:\mish-lab\tools\android-sdk\platform-tools\adb.exe'
          $package = 'com.mobileproxymish.app.debug'
          $runtimePath = 'no_backup/proxy-runtime'

          $names = @(& $adb shell run-as $package ls $runtimePath 2>$null)
          if ($LASTEXITCODE -ne 0) { throw 'App-owned proxy runtime directory is unavailable.' }
          $manifest = (@(& $adb shell run-as $package cat "$runtimePath/sing-box-current-generation" 2>$null) -join "`n").Trim()
          $currentGeneration = $null
          if ($LASTEXITCODE -eq 0 -and $manifest -match '^generation=([A-Za-z0-9_-]{24})$') {
            $currentGeneration = $Matches[1]
          }

          $manifestPresent = $names -contains 'sing-box-current-generation'
          $cleanupScriptPresent = $names -contains 'sing-box-owned-cleanup.sh'
          $currentConfigPresent = $false
          $currentPidPresent = $false
          $currentLauncherPresent = $false
          $currentControlPresent = $false
          if ($null -ne $currentGeneration) {
            $currentConfigPresent = $names -contains "sing-box-$currentGeneration.json"
            $currentPidPresent = $names -contains "sing-box-$currentGeneration.pid"
            $currentLauncherPresent = $names -contains "sing-box-$currentGeneration-launch.sh"
            $currentControlPresent = $names -contains "sing-box-$currentGeneration-control.sh"
          }
          $generationFileCount = @($names | Where-Object { $_ -match '^sing-box-[A-Za-z0-9_-]{24}(?:\.json|\.pid|-launch\.sh|-control\.sh)$' }).Count

          Write-Host "RUNTIME_MANIFEST_PRESENT=$manifestPresent"
          Write-Host "CURRENT_CONFIG_PRESENT=$currentConfigPresent"
          Write-Host "CURRENT_PID_PRESENT=$currentPidPresent"
          Write-Host "CURRENT_LAUNCHER_PRESENT=$currentLauncherPresent"
          Write-Host "CURRENT_CONTROL_PRESENT=$currentControlPresent"
          Write-Host "OWNED_ORPHAN_CLEANUP_SCRIPT_PRESENT=$cleanupScriptPresent"
          Write-Host "GENERATION_RUNTIME_FILE_COUNT=$generationFileCount"

      - name: Collect and print one-shot diagnostic
        shell: powershell
        run: |
          $pwsh = 'C:\mish-lab\tools\powershell-7.6.6\pwsh.exe'
          $evidencePath = Join-Path $env:RUNNER_TEMP 'mish-device-diagnostic-v1.json'
          & $pwsh -NoLogo -NoProfile -File '.\lab\windows\collect-device-diagnostic.ps1' `
            -AdbPath 'C:\mish-lab\tools\android-sdk\platform-tools\adb.exe' `
            -PackageName 'com.mobileproxymish.app.debug' `
            -EvidencePath $evidencePath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'MISH_DIAGNOSTIC_JSON_BEGIN'
          Get-Content -Raw -LiteralPath $evidencePath
          Write-Host 'MISH_DIAGNOSTIC_JSON_END'

      - name: Collect bounded loopback CONNECT attribution
        shell: powershell
        run: |
          $pwsh = 'C:\mish-lab\tools\powershell-7.6.6\pwsh.exe'
          $evidencePath = Join-Path $env:RUNNER_TEMP 'mish-loopback-connect-diagnostic-v1.json'
          & $pwsh -NoLogo -NoProfile -File '.\lab\windows\diagnose-loopback-connect.ps1' `
            -AdbPath 'C:\mish-lab\tools\android-sdk\platform-tools\adb.exe' `
            -PackageName 'com.mobileproxymish.app.debug' `
            -EvidencePath $evidencePath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'MISH_LOOPBACK_DIAGNOSTIC_JSON_BEGIN'
          Get-Content -Raw -LiteralPath $evidencePath
          Write-Host 'MISH_LOOPBACK_DIAGNOSTIC_JSON_END'

      - name: Upload bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mish-device-diagnostic-v1
          path: ${{ runner.temp }}\mish-device-diagnostic-v1.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload bounded loopback CONNECT evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mish-loopback-connect-diagnostic-v1
          path: ${{ runner.temp }}\mish-loopback-connect-diagnostic-v1.json
          if-no-files-found: warn
          retention-days: 30
