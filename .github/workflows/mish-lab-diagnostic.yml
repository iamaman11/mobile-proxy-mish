name: MISH LAB Diagnostic

on:
  push:
    branches:
      - mish-lab-control

permissions:
  contents: read

concurrency:
  group: mish-lab-diagnostic
  cancel-in-progress: false

jobs:
  inspect:
    name: Read-only credential authority inspect
    if: github.actor == 'iamaman11'
    runs-on: [self-hosted, windows, x64, mobile-proxy-mish-lab]
    timeout-minutes: 10
    steps:
      - name: Checkout protected main diagnostics bridge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          clean: true

      - name: Inspect credential authority without secrets
        shell: powershell
        run: |
          $pwsh = 'C:\mish-lab\tools\powershell-7.6.6\pwsh.exe'
          $adb = 'C:\mish-lab\tools\android-sdk\platform-tools\adb.exe'
          if (-not (Test-Path -LiteralPath $pwsh -PathType Leaf)) { throw 'canonical pwsh missing' }
          if (-not (Test-Path -LiteralPath $adb -PathType Leaf)) { throw 'canonical adb missing' }
          & $pwsh -NoLogo -NoProfile -Command @'
          $ErrorActionPreference = 'Stop'
          Import-Module '.\lab\windows\CredentialProvisioning.psm1' -Force
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent().Name
          $localAppData = [Environment]::GetFolderPath([Environment+SpecialFolder]::LocalApplicationData)
          $store = Join-Path $localAppData 'MobileProxyMish\ClientCredentials\external-proxy.v1.dpapi'
          Write-Host "RUNNER_IDENTITY=$identity"
          Write-Host "CREDENTIAL_STORE_PRESENT=$([bool](Test-Path -LiteralPath $store -PathType Leaf))"
          try {
              $lease = Open-MishExternalProxyCredentialLease -StorePath $store
              Write-Host 'CREDENTIAL_LEASE_OPEN=PASS'
              Write-Host "CREDENTIAL_VERSION=$($lease.CredentialVersion)"
          }
          catch [System.IO.FileNotFoundException] {
              Write-Host 'CREDENTIAL_LEASE_OPEN=FAIL'
              Write-Host 'CREDENTIAL_LEASE_REASON=STORE_ABSENT'
          }
          catch [System.IO.InvalidDataException] {
              Write-Host 'CREDENTIAL_LEASE_OPEN=FAIL'
              Write-Host 'CREDENTIAL_LEASE_REASON=DPAPI_OR_ENVELOPE_INVALID'
          }
          catch {
              Write-Host 'CREDENTIAL_LEASE_OPEN=FAIL'
              Write-Host 'CREDENTIAL_LEASE_REASON=OTHER'
          }
          '@
          Write-Host "PRODUCTION_PACKAGE_PRESENT=$([bool]((& $adb shell pm path com.mobileproxymish.app 2>$null) -match '^package:'))"
          Write-Host "DEBUG_PACKAGE_PRESENT=$([bool]((& $adb shell pm path com.mobileproxymish.app.debug 2>$null) -match '^package:'))"
