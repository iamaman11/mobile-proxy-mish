name: MISH LAB Diagnostic

on:
  push:
    branches:
      - mish-lab-control

permissions:
  contents: read

jobs:
  validate:
    name: Validate control entrypoint
    runs-on: ubuntu-latest
    steps:
      - name: Confirm owner-only control branch event
        run: |
          test "${{ github.actor }}" = "iamaman11"
          test "${{ github.ref }}" = "refs/heads/mish-lab-control"
