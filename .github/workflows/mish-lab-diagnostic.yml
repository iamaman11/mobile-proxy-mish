  protocol-parity:
    name: Read-only U2 protocol parity
    if: >-
      github.event.issue.number == 163 &&
      github.event.comment.user.login == 'iamaman11' &&
      github.event.comment.body == '/mish-diag protocol-parity'
    runs-on: [self-hosted, windows, x64, mobile-proxy-mish-lab]
    timeout-minutes: 10
    env:
      ADB_EXE: C:\\mish-lab\\tools\\android-sdk\\platform-tools\\adb.exe
      CURRENT_ACCEPTED_SOURCE_SHA: '07b61e2de90bedb4c9179a5e92b9e51e309b2478'
      CURRENT_ACCEPTED_INSTALLED_APK_SHA256: 'b779fda8551a2bbe3ba06e791f92361cac88dcb878ec6755dab80882fbcd9a2f'
    steps:
      - name: Checkout protected main diagnostic bridge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          clean: true

      - name: Verify pinned PowerShell 7 runtime
        shell: 'C:\mish-lab\tools\powershell-7.6.6\pwsh.exe -NoLogo -NoProfile -NonInteractive -Command "& ([ScriptBlock]::Create((Get-Content -Raw -LiteralPath ''{0}'')))"'
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSEdition -cne 'Core' -or $PSVersionTable.PSVersion.ToString() -cne $env:DIAGNOSTIC_PWSH_VERSION) {
            throw "MISH_DIAGNOSTIC_FAILURE|POWERSHELL_RUNTIME_MISMATCH|Expected PowerShell $env:DIAGNOSTIC_PWSH_VERSION; observed $($PSVersionTable.PSEdition) $($PSVersionTable.PSVersion)"
          }

      - name: Verify physical LAB identity
        shell: 'C:\mish-lab\tools\powershell-7.6.6\pwsh.exe -NoLogo -NoProfile -NonInteractive -Command "& ([ScriptBlock]::Create((Get-Content -Raw -LiteralPath ''{0}'')))"'
        run: |
          $ErrorActionPreference = 'Stop'
          .\lab\windows\labctl.ps1 host inspect -PhysicalLab
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prove exact installed U2 protocol parity
        shell: 'C:\mish-lab\tools\powershell-7.6.6\pwsh.exe -NoLogo -NoProfile -NonInteractive -Command "& ([ScriptBlock]::Create((Get-Content -Raw -LiteralPath ''{0}'')))"'
        run: |
          $ErrorActionPreference = 'Stop'
          .\lab\windows\diagnose-protocol-parity.ps1 -AdbPath "$env:ADB_EXE" -PackageName 'com.mobileproxymish.app.debug' -ExpectedInstalledApkSha256 "$env:CURRENT_ACCEPTED_INSTALLED_APK_SHA256" -ExpectedSourceSha "$env:CURRENT_ACCEPTED_SOURCE_SHA" -EvidencePath "$env:RUNNER_TEMP\mish-protocol-parity-v1.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish protocol parity summary
        if: ${{ always() }}
        shell: 'C:\mish-lab\tools\powershell-7.6.6\pwsh.exe -NoLogo -NoProfile -NonInteractive -Command "& ([ScriptBlock]::Create((Get-Content -Raw -LiteralPath ''{0}'')))"'
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'mish-protocol-parity-v1.json'
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
            '### U2 Protocol Parity' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            'Evidence was not produced.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 0
          }
          $evidence = Get-Content -Raw -LiteralPath $path | ConvertFrom-Json
          @(
            '### U2 Protocol Parity',
            '',
            "- Acceptance: **$($evidence.acceptance_result)**",
            "- Classification: **$($evidence.classification)**",
            "- Exact installed bytes: **$($evidence.exact_installed_bytes)**",
            "- PID stable: **$($evidence.product_pid_stable)**",
            "- HTTP :3128 positive: **$($evidence.probes.http_3128_positive.result)**",
            "- HTTP :3128 wrong-auth rejection: **$($evidence.probes.http_3128_negative_auth.result)**",
            "- SOCKS5 :1081 positive: **$($evidence.probes.socks5_1081_positive.result)**",
            "- SOCKS5 :1081 wrong-auth rejection: **$($evidence.probes.socks5_1081_negative_auth.result)**",
            "- Mixed :1080 HTTP positive: **$($evidence.probes.mixed_1080_http_positive.result)**",
            "- Mixed :1080 HTTP wrong-auth rejection: **$($evidence.probes.mixed_1080_http_negative_auth.result)**",
            "- Mixed :1080 SOCKS5 positive: **$($evidence.probes.mixed_1080_socks5_positive.result)**",
            "- Mixed :1080 SOCKS5 wrong-auth rejection: **$($evidence.probes.mixed_1080_socks5_negative_auth.result)**",
            '',
            'No install, restart, network toggle, root-policy mutation or Cloudflare mutation is performed.'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload protocol parity evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mish-protocol-parity-v1-${{ github.run_id }}
          path: ${{ runner.temp }}\mish-protocol-parity-v1.json
          if-no-files-found: warn
          retention-days: 30

