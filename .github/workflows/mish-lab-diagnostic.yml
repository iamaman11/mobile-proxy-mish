          }

          function Invoke-AdbEvidence {
            param([Parameter(Mandatory)][string[]] $Arguments)
            $previous = $ErrorActionPreference
            try {
              $ErrorActionPreference = 'Continue'
              $lines = @(& $env:ADB_EXE @Arguments 2>&1 | ForEach-Object { [string]$_ })
              return [pscustomobject]@{
                ExitCode = [int]$LASTEXITCODE
                Lines = $lines
                Text = ($lines -join [Environment]::NewLine)
              }
            }
            finally {
              $ErrorActionPreference = $previous
            }
          }

          $pid = Invoke-AdbEvidence @('shell', 'pidof', $env:PACKAGE_NAME)
          $provider = Invoke-AdbEvidence @(
            'shell', 'content', 'call',
            '--uri', "content://$env:PACKAGE_NAME.diagnostics",
            '--method', 'snapshot_v2'
          )
          $exitInfo = Invoke-AdbEvidence @('shell', 'dumpsys', 'activity', 'exit-info', $env:PACKAGE_NAME)
          $logcat = Invoke-AdbEvidence @('logcat', '-d', '-v', 'threadtime', '-t', '1200')

          $boundedLog = @(
            $logcat.Lines |
              Where-Object {
                $_ -match [regex]::Escape($env:PACKAGE_NAME) -or
                $_ -match 'AndroidRuntime|FATAL EXCEPTION|Fatal signal|am_crash|am_kill|ContentProvider'
              } |
              Select-Object -Last 300
          )

          $root = Join-Path $env:RUNNER_TEMP 'mish-provider-state'
          New-Item -ItemType Directory -Path $root -Force | Out-Null

          [IO.File]::WriteAllText((Join-Path $root 'provider-call.txt'), $provider.Text, [Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllText((Join-Path $root 'exit-info.txt'), $exitInfo.Text, [Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllLines((Join-Path $root 'bounded-logcat.txt'), $boundedLog, [Text.UTF8Encoding]::new($false))

          $pidText = $pid.Text.Trim()
          $providerHasPayload = $provider.Text -match 'payload_b64=[A-Za-z0-9+/=]+'
          $fatalMarkers = @($boundedLog | Where-Object { $_ -match 'FATAL EXCEPTION|Fatal signal|am_crash' }).Count
          $summary = [ordered]@{
            schema = 'mish.lab.provider-state/v1'
            collected_at_utc = [DateTimeOffset]::UtcNow.ToString('o')
            package = $env:PACKAGE_NAME
            process_running = ($pid.ExitCode -eq 0 -and $pidText -match '^\d+
