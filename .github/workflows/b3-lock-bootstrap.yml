name: B3 Lock Bootstrap

on:
  push:
    branches: [b3/proxy-sing-box-contract]

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: b3/proxy-sing-box-contract
          persist-credentials: true

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup override set 1.98.1

      - name: Generate Cargo.lock and retire this workflow
        run: |
          set -euo pipefail
          cargo generate-lockfile
          git rm .github/workflows/b3-lock-bootstrap.yml
          git add Cargo.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "B3: refresh Cargo.lock and retire bootstrap"
          git push origin HEAD:b3/proxy-sing-box-contract
