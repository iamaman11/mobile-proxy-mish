name: Cloudflare Live Preflight

on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-live-preflight.yml'
      - 'config/deployment/mesh-device-cidr.txt'

permissions:
  contents: read

concurrency:
  group: cloudflare-live-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Cloudflare Live Preflight
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        github.event_name != 'issue_comment' ||
        (
          github.event.issue.number == 163 &&
          github.event.comment.user.login == 'iamaman11' &&
          github.event.comment.body == '/mish-diag cloudflare-live'
        )
      )
    runs-on: ubuntu-latest
    environment: cloudflare-plan
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WINDOWS_PROFILE_MATCH: ${{ secrets.CLOUDFLARE_WINDOWS_PROFILE_MATCH }}
    steps:
      - name: Checkout accepted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Verify accepted-main execution boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Validate protected inputs and canonical Mesh CIDR
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$WINDOWS_PROFILE_MATCH"
          mesh_cidr="$(tr -d '\r\n' < config/deployment/mesh-device-cidr.txt)"
          test -n "$mesh_cidr"
          if [[ ! "$mesh_cidr" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/[0-9]+$ ]]; then
            echo '::error::Canonical Mesh CIDR has an unexpected shape.'
            exit 1
          fi
          echo "EXPECTED_MESH_CIDR=$mesh_cidr" >> "$GITHUB_ENV"

      - name: Resolve exactly one Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          response="$RUNNER_TEMP/cloudflare-accounts.json"
          trap 'rm -f "$response"' EXIT

          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            'https://api.cloudflare.com/client/v4/accounts?per_page=50&page=1' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Accept: application/json' \
            -o "$response"

          if ! jq -e '.success == true and (.result | type == "array")' "$response" >/dev/null; then
            echo '::error::Cloudflare account scope could not be read.'
            exit 1
          fi

          returned="$(jq -r '.result | length' "$response")"
          total="$(jq -r '.result_info.total_count // (.result | length)' "$response")"
          if [[ "$returned" != '1' || "$total" != '1' ]]; then
            echo "::error::Expected protected token to resolve exactly one Cloudflare account; returned=${returned}, total=${total}."
            exit 1
          fi

          account_id="$(jq -r '.result[0].id // empty' "$response")"
          if [[ ! "$account_id" =~ ^[0-9A-Fa-f]{32}$ ]]; then
            echo '::error::Resolved Cloudflare account identifier has an unexpected shape.'
            exit 1
          fi
          echo "::add-mask::$account_id"
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"

      - name: Observe exact Windows Mesh profile through official API
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          response="$RUNNER_TEMP/cloudflare-device-policies.json"
          trap 'rm -f "$response"' EXIT

          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/devices/policies?per_page=100&page=1" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Accept: application/json' \
            -o "$response"

          if ! jq -e '.success == true and (.result | type == "array")' "$response" >/dev/null; then
            echo '::error::Cloudflare device-profile list could not be read.'
            exit 1
          fi

          returned="$(jq -r '.result | length' "$response")"
          total="$(jq -r '.result_info.total_count // (.result | length)' "$response")"
          if (( total > returned )); then
            echo '::error::Cloudflare device-profile response exceeds the bounded first page.'
            exit 1
          fi

          projection="$(jq -c \
            --arg expected_match "$WINDOWS_PROFILE_MATCH" \
            --arg expected_cidr "$EXPECTED_MESH_CIDR" '
              [.result[] | select(.name == "adds" and .match == $expected_match)] as $p
              | {
                  matching_profile_count: ($p | length),
                  non_default: (($p | length) == 1 and (($p[0].default // false) == false)),
                  enabled: (($p | length) == 1 and ($p[0].enabled == true)),
                  mode_switch_locked: (($p | length) == 1 and ($p[0].allow_mode_switch == false)),
                  auto_fallback_disabled: (($p | length) == 1 and ($p[0].disable_auto_fallback == true)),
                  protocol_masque: (($p | length) == 1 and ($p[0].tunnel_protocol == "masque")),
                  tunnel_only: (($p | length) == 1 and ($p[0].service_mode_v2.mode == "warp_tunnel_only")),
                  include_count: (if ($p | length) == 1 then (($p[0].include // []) | length) else 0 end),
                  expected_cidr_present: (if ($p | length) == 1 then ([($p[0].include // [])[] | select(.address == $expected_cidr)] | length) > 0 else false end),
                  expected_cidr_host_empty: (if ($p | length) == 1 then ([($p[0].include // [])[] | select(.address == $expected_cidr and ((.host // "") == ""))] | length) > 0 else false end)
                }
            ' "$response")"
          echo "Cloudflare profile safe projection: ${projection}"

          if jq -e \
            --arg expected_match "$WINDOWS_PROFILE_MATCH" \
            --arg expected_cidr "$EXPECTED_MESH_CIDR" '
              [.result[] |
                select(
                  .name == "adds" and
                  .match == $expected_match and
                  ((.default // false) == false)
                )
              ] as $p
              | ($p | length) == 1
              and ($p[0].enabled == true)
              and ($p[0].allow_mode_switch == false)
              and ($p[0].disable_auto_fallback == true)
              and ($p[0].tunnel_protocol == "masque")
              and ($p[0].service_mode_v2.mode == "warp_tunnel_only")
              and (($p[0].include // []) as $inc |
                ($inc | length) == 1
                and $inc[0].address == $expected_cidr
                and (($inc[0].host // "") == ""))
            ' "$response" >/dev/null; then
            echo 'PROFILE_OK=true' >> "$GITHUB_ENV"
          else
            echo 'PROFILE_OK=false' >> "$GITHUB_ENV"
            echo '::warning::Exact Windows Mesh profile does not satisfy the accepted live contract.'
          fi

      - name: Observe global Zero Trust device settings through official API
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          response="$RUNNER_TEMP/cloudflare-device-settings.json"
          trap 'rm -f "$response"' EXIT

          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/devices/settings" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Accept: application/json' \
            -o "$response"

          if ! jq -e '.success == true and (.result | type == "object")' "$response" >/dev/null; then
            echo '::error::Cloudflare global device settings could not be read.'
            exit 1
          fi

          projection="$(jq -c '{
            unique_virtual_ip: (.result.use_zt_virtual_ip == true),
            gateway_tcp: (.result.gateway_proxy_enabled == true),
            gateway_udp: (.result.gateway_udp_proxy_enabled == true)
          }' "$response")"
          echo "Cloudflare device-settings safe projection: ${projection}"

          if jq -e '
            .result.use_zt_virtual_ip == true and
            .result.gateway_proxy_enabled == true and
            .result.gateway_udp_proxy_enabled == true
          ' "$response" >/dev/null; then
            echo 'DEVICE_SETTINGS_OK=true' >> "$GITHUB_ENV"
          else
            echo 'DEVICE_SETTINGS_OK=false' >> "$GITHUB_ENV"
            echo '::warning::Cloudflare global device settings do not satisfy Mesh TCP/UDP/virtual-IP requirements.'
          fi

      - name: Observe WARP-to-WARP connectivity through official API
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          response="$RUNNER_TEMP/cloudflare-connectivity-settings.json"
          trap 'rm -f "$response"' EXIT

          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/zerotrust/connectivity_settings" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Accept: application/json' \
            -o "$response"

          if ! jq -e '.success == true and (.result | type == "object")' "$response" >/dev/null; then
            echo '::error::Cloudflare connectivity settings could not be read.'
            exit 1
          fi

          projection="$(jq -c '{offramp_warp_enabled: (.result.offramp_warp_enabled == true)}' "$response")"
          echo "Cloudflare connectivity safe projection: ${projection}"

          if jq -e '.result.offramp_warp_enabled == true' "$response" >/dev/null; then
            echo 'CONNECTIVITY_OK=true' >> "$GITHUB_ENV"
          else
            echo 'CONNECTIVITY_OK=false' >> "$GITHUB_ENV"
            echo '::warning::Cloudflare WARP-to-WARP/off-ramp is not enabled.'
          fi

      - name: Publish aggregate fail-closed verdict
        shell: bash
        run: |
          set -euo pipefail
          profile_ok="${PROFILE_OK:-false}"
          device_settings_ok="${DEVICE_SETTINGS_OK:-false}"
          connectivity_ok="${CONNECTIVITY_OK:-false}"
          {
            echo '### Cloudflare Live Preflight'
            echo '- Read-only official API observations only.'
            echo '- Read-only verification performs no Cloudflare configuration mutation.'
            echo "- Exact Windows profile: **${profile_ok}**"
            echo "- Device TCP/UDP/virtual-IP settings: **${device_settings_ok}**"
            echo "- WARP-to-WARP/off-ramp: **${connectivity_ok}**"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$profile_ok" != 'true' || "$device_settings_ok" != 'true' || "$connectivity_ok" != 'true' ]]; then
            echo "::error::Cloudflare Live Preflight failed: profile=${profile_ok}, device_settings=${device_settings_ok}, connectivity=${connectivity_ok}."
            exit 1
          fi

          echo 'Cloudflare Live Preflight: PASS.'
