name: Device Cycle

on:
  pull_request:
    paths:
      - '.github/workflows/device-cycle.yml'
      - '.github/workflows/integration-android-preflight.yml'
      - 'lab/windows/install-device-candidate.ps1'
      - 'lab/windows/verify-installed-candidate.ps1'
      - 'lab/windows/test-device-candidate.ps1'
      - 'lab/windows/start-device-app.ps1'
      - 'lab/windows/collect-device-diagnostic.ps1'
      - 'lab/windows/DeviceDiagnosticClassification.psm1'
      - 'lab/windows/diagnose-loopback-connect.ps1'
      - 'lab/windows/diagnose-capacity-resources.ps1'
      - 'lab/windows/diagnose-recovery-lifecycle.ps1'
      - 'lab/windows/test-recovery-lifecycle-probe-contract.ps1'
      - 'lab/windows/diagnose-dns-lifetime-live.ps1'
      - 'lab/windows/test-dns-lifetime-live-probe-contract.ps1'
      - 'lab/windows/new-device-cycle-report.ps1'
      - 'lab/windows/test-device-cycle.ps1'
      - 'tools/check_device_cycle_contract.py'
      - 'tools/check_delivery_contract.py'
      - 'docs/architecture/DEVELOPMENT_PIPELINE.md'
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read

concurrency:
  group: device-cycle
  cancel-in-progress: false

env:
  PACKAGE_NAME: com.mobileproxymish.app.debug
  ADB_EXE: C:\\mish-lab\\tools\\android-sdk\\platform-tools\\adb.exe
  ANDROID_SDK_ROOT: C:\\mish-lab\\tools\\android-sdk
  DEVICE_CYCLE_PWSH_VERSION: '7.6.6'

jobs:
  contract:
    name: Device Cycle Contract
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Exercise orchestration and installer contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\lab\windows\test-device-candidate.ps1
          .\lab\windows\test-device-cycle.ps1
          .\lab\windows\test-recovery-lifecycle-probe-contract.ps1
          .\lab\windows\test-dns-lifetime-live-probe-contract.ps1
          python .\tools\check_device_cycle_contract.py
          python .\tools\check_delivery_contract.py

  resolve:
    name: Resolve explicit cycle request and completed build
    if: >-
      ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request != null &&
          github.actor == 'iamaman11' && startsWith(github.event.comment.body, '/mish-cycle ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      eligible: ${{ steps.resolve.outputs.eligible }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      control_sha: ${{ steps.resolve.outputs.control_sha }}
      producer_blob_sha: ${{ steps.resolve.outputs.producer_blob_sha }}
      mode: ${{ steps.resolve.outputs.mode }}
      probe: ${{ steps.resolve.outputs.probe }}
      artifact_id: ${{ steps.resolve.outputs.artifact_id }}
      artifact_name: ${{ steps.resolve.outputs.artifact_name }}
      artifact_digest: ${{ steps.resolve.outputs.artifact_digest }}
      hosted_run_id: ${{ steps.resolve.outputs.hosted_run_id }}
    steps:
      - name: Resolve exact manual request and build provenance
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          mapfile -t request < <(python3 - <<'PY'
          import os, re
          parts = os.environ['COMMENT_BODY'].strip().split()
          if len(parts) < 3 or parts[0] != '/mish-cycle':
              raise SystemExit('expected /mish-cycle <mode> <40-hex-sha> [probe]')
          mode, source = parts[1], parts[2]
          if mode not in {'full', 'install_only', 'diagnose_only', 'probe_only'}:
              raise SystemExit('invalid device-cycle mode')
          if not re.fullmatch(r'[0-9a-f]{40}', source):
              raise SystemExit('device-cycle requires an explicit exact 40-hex PRODUCT SHA')
          if mode == 'probe_only':
              if len(parts) != 4 or parts[3] != 'loopback_connect':
                  raise SystemExit('probe_only supports only the current-function loopback_connect probe')
              probe = parts[3]
          elif mode == 'full':
              if len(parts) == 3:
                  probe = 'none'
              elif len(parts) == 4 and parts[3] in {'capacity_resources', 'recovery_lifecycle', 'dns_lifetime_live'}:
                  probe = parts[3]
              else:
                  raise SystemExit('full accepts only the explicit optional capacity_resources probe, recovery_lifecycle, or dns_lifetime_live')
          else:
              if len(parts) != 3:
                  raise SystemExit('install_only/diagnose_only do not accept a probe')
              probe = 'none'
          print(mode)
          print(source)
          print(probe)
          PY
          )
          MODE="${request[0]}"
          EXPECTED_SHA="${request[1]}"
          PROBE="${request[2]}"
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]

          root="$RUNNER_TEMP/device-cycle-resolve"
          mkdir -p "$root"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$root/pr.json"
          mapfile -t prmeta < <(python3 - "$root/pr.json" "$GITHUB_REPOSITORY" "$PR_NUMBER" "$EXPECTED_SHA" "$MODE" <<'PY'
          import json, re, sys
          path, repository, requested_pr, expected, mode = sys.argv[1:]
          pr = json.load(open(path, encoding='utf-8'))
          head = str((pr.get('head') or {}).get('sha') or '')
          branch = str((pr.get('head') or {}).get('ref') or '')
          head_repo = str((((pr.get('head') or {}).get('repo') or {}).get('full_name')) or '')
          base = str((pr.get('base') or {}).get('ref') or '')
          state = str(pr.get('state') or '')
          merged = bool(pr.get('merged'))
          if state not in {'open', 'closed'} or (state == 'closed' and not merged):
              raise SystemExit('device cycle requires an open or merged PR')
          if str(pr.get('number')) != requested_pr:
              raise SystemExit('device cycle PR identity mismatch')
          if head_repo != repository:
              raise SystemExit('device cycle requires the canonical repository head')
          if not re.fullmatch(r'[0-9a-f]{40}', head) or head != expected:
              raise SystemExit('device cycle PR head does not match the explicitly requested SHA')
          if not branch:
              raise SystemExit('device cycle PR head branch is missing')
          if mode in {'full', 'install_only'}:
              if base != 'main':
                  raise SystemExit('installing a device candidate requires base main')
              if state == 'open':
                  if pr.get('draft') is not False:
                      raise SystemExit('installing a device candidate requires a ready PR')
              elif not merged:
                  raise SystemExit('installing a device candidate requires an open PR to main unless a merged PR is proven PRODUCT-identical to current protected main')
          print(head)
          print(branch)
          print('merged' if merged else 'open')
          PY
          )
          SOURCE_SHA="${prmeta[0]}"
          HEAD_BRANCH="${prmeta[1]}"
          PR_LIFECYCLE="${prmeta[2]}"

          if [[ "$PR_LIFECYCLE" == 'merged' && ( "$MODE" == 'full' || "$MODE" == 'install_only' ) ]]; then
            ACCEPTED_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha // empty')"
            if ! [[ "$ACCEPTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo 'current protected-main SHA could not be resolved' >&2
              exit 1
            fi
            if [[ "$ACCEPTED_MAIN_SHA" != "$GITHUB_SHA" ]]; then
              echo 'device cycle control is not the current protected-main SHA; request a fresh cycle' >&2
              exit 1
            fi

            SOURCE_TREE_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$SOURCE_SHA" --jq '.tree.sha // empty')"
            MAIN_TREE_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$ACCEPTED_MAIN_SHA" --jq '.tree.sha // empty')"
            if ! [[ "$SOURCE_TREE_SHA" =~ ^[0-9a-f]{40}$ && "$MAIN_TREE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo 'PRODUCT source-tree identity could not be resolved' >&2
              exit 1
            fi
            gh api "repos/$GITHUB_REPOSITORY/git/trees/$SOURCE_TREE_SHA" > "$root/source-tree.json"
            gh api "repos/$GITHUB_REPOSITORY/git/trees/$MAIN_TREE_SHA" > "$root/main-tree.json"
            python3 - "$root/source-tree.json" "$root/main-tree.json" <<'PY'
          import json, sys
          source_path, main_path = sys.argv[1:]
          source = json.load(open(source_path, encoding='utf-8'))
          main = json.load(open(main_path, encoding='utf-8'))
          required = ('android', 'crates', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'config', 'contracts')
          def identity(tree):
              return {
                  item['path']: (item.get('mode'), item.get('type'), item.get('sha'))
                  for item in tree.get('tree', [])
                  if item.get('path') in required
              }
          source_id = identity(source)
          main_id = identity(main)
          if set(source_id) != set(required) or set(main_id) != set(required):
              raise SystemExit('merged PR install cannot prove the complete PRODUCT input identity')
          mismatches = [name for name in required if source_id[name] != main_id[name]]
          if mismatches:
              raise SystemExit('merged PR install requires current protected-main PRODUCT identity; mismatched paths: ' + ','.join(mismatches))
          print('POST_MERGE_PRODUCT_IDENTITY=EXACT_MATCH')
          PY
          fi

          ARTIFACT_ID=''
          ARTIFACT_NAME=''
          ARTIFACT_DIGEST=''
          HOSTED_RUN_ID=''
          PRODUCER_BLOB_SHA='NOT_REQUIRED'

          if [[ "$MODE" == 'full' || "$MODE" == 'install_only' ]]; then
            PRODUCER_PATH='.github/workflows/integration-android-preflight.yml'
            PRODUCT_PRODUCER_SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/$PRODUCER_PATH?ref=$SOURCE_SHA" --jq '.sha // empty')"
            CONTROL_PRODUCER_SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/$PRODUCER_PATH?ref=$GITHUB_SHA" --jq '.sha // empty')"
            if ! [[ "$PRODUCT_PRODUCER_SHA" =~ ^[0-9a-f]{40}$ && "$CONTROL_PRODUCER_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo 'candidate producer workflow identity could not be resolved at PRODUCT_SHA and CONTROL_SHA' >&2
              exit 1
            fi
            if [[ "$PRODUCT_PRODUCER_SHA" != "$CONTROL_PRODUCER_SHA" ]]; then
              echo 'candidate producer workflow differs from accepted protected-main producer' >&2
              exit 1
            fi
            PRODUCER_BLOB_SHA="$CONTROL_PRODUCER_SHA"

            ARTIFACT_NAME="device-candidate-pr-$PR_NUMBER-$SOURCE_SHA"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$ARTIFACT_NAME&per_page=100" > "$root/artifacts.json"
            mapfile -t artifact < <(python3 - "$root/artifacts.json" "$ARTIFACT_NAME" "$SOURCE_SHA" "$HEAD_BRANCH" <<'PY'
          import json, re, sys
          path, name, source, branch = sys.argv[1:]
          data = json.load(open(path, encoding='utf-8'))
          matches = []
          for item in data.get('artifacts', []):
              run = item.get('workflow_run') or {}
              digest = str(item.get('digest') or '')
              if (
                  item.get('name') == name
                  and item.get('expired') is False
                  and run.get('head_sha') == source
                  and run.get('head_branch') == branch
                  and re.fullmatch(r'sha256:[0-9a-f]{64}', digest)
              ):
                  matches.append(item)
          if not matches:
              raise SystemExit('no completed exact-head device candidate artifact exists; build first, then explicitly request the cycle')
          matches.sort(key=lambda item: (str(item.get('created_at') or ''), int(item.get('id') or 0)), reverse=True)
          chosen = matches[0]
          print(int(chosen['id']))
          print(int((chosen.get('workflow_run') or {})['id']))
          print(str(chosen['digest']))
          PY
            )
            ARTIFACT_ID="${artifact[0]}"
            HOSTED_RUN_ID="${artifact[1]}"
            ARTIFACT_DIGEST="${artifact[2]}"

            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$HOSTED_RUN_ID" > "$root/run.json"
            python3 - "$root/run.json" "$SOURCE_SHA" "$HEAD_BRANCH" "$PR_NUMBER" <<'PY'
          import json, sys
          path, source, branch, pr_number = sys.argv[1:]
          run = json.load(open(path, encoding='utf-8'))
          if run.get('name') != 'Integration Android Preflight':
              raise SystemExit('candidate artifact did not originate from Integration Android Preflight')
          if run.get('path') != '.github/workflows/integration-android-preflight.yml':
              raise SystemExit('candidate workflow path mismatch')
          if run.get('event') != 'pull_request' or run.get('status') != 'completed' or run.get('conclusion') != 'success':
              raise SystemExit('candidate build is not a completed successful PR preflight')
          if run.get('head_sha') != source or run.get('head_branch') != branch:
              raise SystemExit('candidate build head identity mismatch')
          prs = run.get('pull_requests') or []
          if prs and all(str(item.get('number')) != pr_number for item in prs):
              raise SystemExit('candidate build PR identity mismatch')
          PY
          fi

          {
            echo 'eligible=true'
            echo "pr_number=$PR_NUMBER"
            echo "source_sha=$SOURCE_SHA"
            echo "control_sha=$GITHUB_SHA"
            echo "producer_blob_sha=$PRODUCER_BLOB_SHA"
            echo "mode=$MODE"
            echo "probe=$PROBE"
            echo "artifact_id=$ARTIFACT_ID"
            echo "artifact_name=$ARTIFACT_NAME"
            echo "artifact_digest=$ARTIFACT_DIGEST"
            echo "hosted_run_id=$HOSTED_RUN_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Publish resolved explicit request
        shell: bash
        run: |
          {
            echo '### Explicit DEVICE-1 cycle request'
            echo '- Trigger: **manual analysis decision (`/mish-cycle`)**'
            echo '- PR: `#${{ steps.resolve.outputs.pr_number }}`'
            echo '- PRODUCT SHA: `${{ steps.resolve.outputs.source_sha }}`'
            echo '- CONTROL SHA: `${{ steps.resolve.outputs.control_sha }}`'
            echo '- Accepted producer policy: `${{ steps.resolve.outputs.producer_blob_sha }}`'
            echo '- Mode: `${{ steps.resolve.outputs.mode }}`'
            echo '- Explicit probe: `${{ steps.resolve.outputs.probe }}`'
            echo '- Completed hosted build: `${{ steps.resolve.outputs.hosted_run_id }}`'
            echo '- Automatic start after build/main: **NO**'
          } >> "$GITHUB_STEP_SUMMARY"

  install:
    name: Install -> verify installed exact bytes
    needs: resolve
    if: ${{ needs.resolve.outputs.eligible == 'true' && (needs.resolve.outputs.mode == 'full' || needs.resolve.outputs.mode == 'install_only') }}
    runs-on: [self-hosted, windows, x64, mobile-proxy-mish-lab]
    timeout-minutes: 15
    outputs:
      install_run_id: ${{ steps.identity.outputs.install_run_id }}
    steps:
      - name: Checkout exact control implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.control_sha }}
          persist-credentials: false
          clean: true

      - name: Verify pinned PowerShell 7 runtime
        shell: 'C:\\mish-lab\\tools\\powershell-7.6.6\\pwsh.exe -NoLogo -NoProfile -NonInteractive -Command "& ([ScriptBlock]::Create((Get-Content -Raw -LiteralPath ''{0}'')))"'
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSEdition -cne 'Core' -or $PSVersionTable.PSVersion.ToString() -cne $env:DEVICE_CYCLE_PWSH_VERSION) {
            throw "MISH_DEVICE_CYCLE_FAILURE|POWERSHELL_RUNTIME_MISMATCH|Expected PowerShell $env:DEVICE_CYCLE_PWSH_VERSION; observed $($PSVersionTable.PSEdition) $($PSVersionTable.PSVersion)"
          }
          Write-Host "DEVICE_CYCLE_PWSH=$($PSVersionTable.PSVersion)"

      - name: Verify physical DEVICE-1 prerequisites
        shell: 'C:\\mish-lab\\tools\\powershell-7.6.6\\pwsh.exe -NoLogo -NoProfile -NonInteractive -Command "& ([ScriptBlock]::Create((Get-Content -Raw -LiteralPath ''{0}'')))"'
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath $env:ADB_EXE -PathType Leaf)) {
            throw "MISH_DEVICE_CYCLE_FAILURE|HOST_PREREQUISITE_MISSING|ADB is missing: $env:ADB_EXE"
          }
          $deviceRows = @(& $env:ADB_EXE devices | Where-Object { $_ -match '^\S+\s+device\s*$' })
          if ($LASTEXITCODE -ne 0 -or $deviceRows.Count -ne 1) {
            throw 'MISH_DEVICE_CYCLE_FAILURE|DEVICE_UNAVAILABLE|Exactly one authorized DEVICE-1 is required.'
          }
          $api = (& $env:ADB_EXE shell getprop ro.build.version.sdk).Trim()
          $abi = (& $env:ADB_EXE shell getprop ro.product.cpu.abi).Trim()
          if ($api -ne '30') {
            throw "MISH_DEVICE_CYCLE_FAILURE|DEVICE_IDENTITY_MISMATCH|DEVICE-1 API must be 30; observed API=$api"
          }
          if ($abi -ne 'armeabi-v7a') {
            throw "MISH_DEVICE_CYCLE_FAILURE|DEVICE_IDENTITY_MISMATCH|DEVICE-1 ABI must be armeabi-v7a; observed ABI=$abi"
          }

      - name: Download exact completed hosted candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.resolve.outputs.artifact_id }}
          path: ${{ runner.temp }}\\mish-device-candidate
          github-token: ${{ github.token }}
          repository: iamaman11/mobile-proxy-mish
          run-id: ${{ needs.resolve.outputs.hosted_run_id }}
          merge-multiple: false

      - name: Install exact signed candidate without rebuilding
        shell: 'C:\\mish-lab\\tools\\powershell-7.6.6\\pwsh.exe -NoLogo -NoProfile -NonInteractive -Command "& ([ScriptBlock]::Create((Get-Content -Raw -LiteralPath ''{0}'')))"'
        run: |
          $ErrorActionPreference = 'Stop'
          $receiptPath = "$env:RUNNER_TEMP\\mish-device-candidate-install.json"
          try {
            $candidateDirectory = Join-Path "$env:RUNNER_TEMP\\mish-device-candidate" '${{ needs.resolve.outputs.artifact_name }}'
            $manifestPath = Join-Path $candidateDirectory 'candidate.json'
            if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
              throw 'MISH_DEVICE_CYCLE_FAILURE|DOWNLOAD_LAYOUT_MISMATCH|Resolved artifact directory does not contain candidate.json.'
            }
            $receipt = & '.\\lab\\windows\\install-device-candidate.ps1' `
              -CandidateDirectory $candidateDirectory `
              -ExpectedPrNumber '${{ needs.resolve.outputs.pr_number }}' `
              -ExpectedSourceSha '${{ needs.resolve.outputs.source_sha }}' `
              -AdbPath $env:ADB_EXE `
              -AndroidSdkRoot $env:ANDROID_SDK_ROOT
            $receipt | Set-Content -Encoding UTF8 -LiteralPath $receiptPath
          }
          catch {
            $message = [string]$_
            $category = 'INSTALL_FAILED'
            if ($message -match 'MISH_DEVICE_CANDIDATE_FAILURE\|([^|]+)\|') {
              $category = $Matches[1]
            }
            [pscustomobject]@{
              result = 'FAIL'
              category = $category
              pr_number = [int]'${{ needs.resolve.outputs.pr_number }}'
              source_sha = '${{ needs.resolve.outputs.source_sha }}'
              installed = $null
              installed_state = 'UNKNOWN'
              local_build = $false
            } | ConvertTo-Json -Compress | Set-Content -Encoding UTF8 -LiteralPath $receiptPath
            throw
          }

      - name: Verify installed APK bytes and signing identity
        shell: 'C:\\mish-lab\\tools\\powershell-7.6.6\\pwsh.exe -NoLogo -NoProfile -NonInteractive -Command "& ([ScriptBlock]::Create((Get-Content -Raw -LiteralPath ''{0}'')))"'
        run: |
          $ErrorActionPreference = 'Stop'
          .\\lab\\windows\\verify-installed-candidate.ps1 `
            -InstallReceiptPath "$env:RUNNER_TEMP\\mish-device-candidate-install.json" `
            -AdbPath $env:ADB_EXE `
            -AndroidSdkRoot $env:ANDROID_SDK_ROOT `
            -ReceiptPath "$env:RUNNER_TEMP\\mish-device-install-verification-v1.json" | Out-Host

      - name: Record in-run install identity
        id: identity
        shell: 'C:\\mish-lab\\tools\\powershell-7.6.6\\pwsh.exe -NoLogo -NoProfile -NonInteractive -Command "& ([ScriptBlock]::Create((Get-Content -Raw -LiteralPath ''{0}'')))"'
        run: |
          "install_run_id=$env:GITHUB_RUN_ID" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_OUTPUT

      - name: Upload bounded install evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mish-device-install-${{ needs.resolve.outputs.pr_number }}-${{ needs.resolve.outputs.source_sha }}
          path: |
            ${{ runner.temp }}\\mish-device-candidate-install.json
            ${{ runner.temp }}\\mish-device-install-verification-v1.json
          if-no-files-found: warn
          retention-days: 7

  diagnose:
    name: Launch -> canonical diagnostic -> STOP
    needs: [resolve, install]
    if: >-
      ${{ always() && needs.resolve.outputs.eligible == 'true' && needs.resolve.outputs.mode != 'install_only' &&
          (needs.resolve.outputs.mode != 'full' || needs.install.result == 'success') }}
    runs-on: [self-hosted, windows, x64, mobile-proxy-mish-lab]
    timeout-minutes: 15
    outputs:
      cycle_result: ${{ steps.report.outputs.cycle_result }}
      classification: ${{ steps.report.outputs.classification }}
      exact_candidate_acceptance: ${{ steps.report.outputs.exact_candidate_acceptance }}
    steps:
      - name: Checkout exact control implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.control_sha }}
          persist-credentials: false
          clean: true

      - name: Verify pinned PowerShell 7 runtime
        shell: 'C:\\mish-lab\\tools\\powershell-7.6.6\\pwsh.exe -NoLogo -NoProfile -NonInteractive -Command "& ([ScriptBlock]::Create((Get-Content -Raw -LiteralPath ''{0}'')))"'
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSEdition -cne 'Core' -or $PSVersionTable.PSVersion.ToString() -cne $env:DEVICE_CYCLE_PWSH_VERSION) {
            throw "MISH_DEVICE_CYCLE_FAILURE|POWERSHELL_RUNTIME_MISMATCH|Expected PowerShell $env:DEVICE_CYCLE_PWSH_VERSION; observed $($PSVersionTable.PSEdition) $($PSVersionTable.PSVersion)"
          }
          Write-Host "DEVICE_CYCLE_PWSH=$($PSVersionTable.PSVersion)"

      - name: Verify physical DEVICE-1 prerequisites
        shell: 'C:\\mish-lab\\tools\\powershell-7.6.6\\pwsh.exe -NoLogo -NoProfile -NonInteractive -Command "& ([ScriptBlock]::Create((Get-Content -Raw -LiteralPath ''{0}'')))"'
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath $env:ADB_EXE -PathType Leaf)) {
            throw 'MISH_DEVICE_CYCLE_FAILURE|ADB_MISSING|Canonical ADB is unavailable.'
          }
          $devices = @(& $env:ADB_EXE devices | Where-Object { $_ -match '^\S+\s+device\s*$' })
          if ($LASTEXITCODE -ne 0 -or $devices.Count -ne 1) {
            throw 'MISH_DEVICE_CYCLE_FAILURE|DEVICE_UNAVAILABLE|Exactly one authorized DEVICE-1 is required.'
          }
          $api = (& $env:ADB_EXE shell getprop ro.build.version.sdk).Trim()
          $abi = (& $env:ADB_EXE shell getprop ro.product.cpu.abi).Trim()
          if ($api -ne '30' -or $abi -ne 'armeabi-v7a') {
            throw "MISH_DEVICE_CYCLE_FAILURE|DEVICE_IDENTITY_MISMATCH|Observed API=$api ABI=$abi"
          }
          Write-Host 'DEVICE_CYCLE_PREREQUISITES=PASS'

      - name: Explicitly restart app and wait for bounded stable state
        if: ${{ needs.resolve.outputs.mode != 'probe_only' }}
        shell: 'C:\\mish-lab\\tools\\powershell-7.6.6\\pwsh.exe -NoLogo -NoProfile -NonInteractive -Command "& ([ScriptBlock]::Create((Get-Content -Raw -LiteralPath ''{0}'')))"'
        run: |
          $ErrorActionPreference = 'Stop'
          .\\lab\\windows\\start-device-app.ps1 `
            -AdbPath $env:ADB_EXE `
            -PackageName $env:PACKAGE_NAME `
            -ComponentName "$env:PACKAGE_NAME/com.mobileproxymish.app.MainActivity" `
            -ReceiptPath "$env:RUNNER_TEMP\\mish-device-start-v1.json"

      - name: Collect one canonical current-L8 diagnostic snapshot
        id: baseline
        if: ${{ needs.resolve.outputs.mode != 'probe_only' }}
        continue-on-error: true
        shell: 'C:\\mish-lab\\tools\\powershell-7.6.6\\pwsh.exe -NoLogo -NoProfile -NonInteractive -Command "& ([ScriptBlock]::Create((Get-Content -Raw -LiteralPath ''{0}'')))"'
        run: |
          $ErrorActionPreference = 'Stop'
          .\\lab\\windows\\collect-device-diagnostic.ps1 `
            -AdbPath $env:ADB_EXE `
            -PackageName $env:PACKAGE_NAME `
            -EvidencePath "$env:RUNNER_TEMP\\mish-device-diagnostic-v2.json"

      - name: Explicit current-function probe only - loopback CONNECT
        if: ${{ needs.resolve.outputs.mode == 'probe_only' && needs.resolve.outputs.probe == 'loopback_connect' }}
        continue-on-error: true
        shell: 'C:\\mish-lab\\tools\\powershell-7.6.6\\pwsh.exe -NoLogo -NoProfile -NonInteractive -Command "& ([ScriptBlock]::Create((Get-Content -Raw -LiteralPath ''{0}'')))"'
        run: |
          $ErrorActionPreference = 'Stop'
          .\\lab\\windows\\diagnose-loopback-connect.ps1 `
            -AdbPath $env:ADB_EXE `
            -PackageName $env:PACKAGE_NAME `
            -EvidencePath "$env:RUNNER_TEMP\\mish-targeted-probe-v1.json"

      - name: Explicit U2 capacity/resources - external Mesh
        if: ${{ needs.resolve.outputs.mode == 'full' && needs.resolve.outputs.probe == 'capacity_resources' && steps.baseline.outcome == 'success' }}
        continue-on-error: true
        shell: 'C:\\mish-lab\\tools\\powershell-7.6.6\\pwsh.exe -NoLogo -NoProfile -NonInteractive -Command "& ([ScriptBlock]::Create((Get-Content -Raw -LiteralPath ''{0}'')))"'
        run: |
          $ErrorActionPreference = 'Stop'
          .\\lab\\windows\\diagnose-capacity-resources.ps1 `
            -AdbPath $env:ADB_EXE `
            -PackageName $env:PACKAGE_NAME `
            -EvidencePath "$env:RUNNER_TEMP\\mish-targeted-probe-v1.json"

      - name: Explicit U3 DNS lifetime - live same-process observation
        if: ${{ needs.resolve.outputs.mode == 'full' && needs.resolve.outputs.probe == 'dns_lifetime_live' && steps.baseline.outcome == 'success' }}
        continue-on-error: true
        shell: 'C:\\mish-lab\\tools\\powershell-7.6.6\\pwsh.exe -NoLogo -NoProfile -NonInteractive -Command "& ([ScriptBlock]::Create((Get-Content -Raw -LiteralPath ''{0}'')))"'
        run: |
          $ErrorActionPreference = 'Stop'
          .\lab\windows\diagnose-dns-lifetime-live.ps1 `
            -AdbPath $env:ADB_EXE `
            -PackageName $env:PACKAGE_NAME `
            -EvidencePath "$env:RUNNER_TEMP\\mish-targeted-probe-v1.json"

      - name: Download exact candidate harness for recovery lifecycle
        if: ${{ needs.resolve.outputs.mode == 'full' && needs.resolve.outputs.probe == 'recovery_lifecycle' && steps.baseline.outcome == 'success' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.resolve.outputs.artifact_id }}
          path: ${{ runner.temp }}\\mish-recovery-candidate
          github-token: ${{ github.token }}
          repository: iamaman11/mobile-proxy-mish
          run-id: ${{ needs.resolve.outputs.hosted_run_id }}
          merge-multiple: false

      - name: Explicit U2 recovery/lifecycle - Mesh loss + exact Cellular E3 + restart
        if: ${{ needs.resolve.outputs.mode == 'full' && needs.resolve.outputs.probe == 'recovery_lifecycle' && steps.baseline.outcome == 'success' }}
        continue-on-error: true
        shell: 'C:\\mish-lab\\tools\\powershell-7.6.6\\pwsh.exe -NoLogo -NoProfile -NonInteractive -Command "& ([ScriptBlock]::Create((Get-Content -Raw -LiteralPath ''{0}'')))"'
        run: |
          $ErrorActionPreference = 'Stop'
          $candidateDirectory = Join-Path "$env:RUNNER_TEMP\\mish-recovery-candidate" '${{ needs.resolve.outputs.artifact_name }}'
          .\\lab\\windows\\diagnose-recovery-lifecycle.ps1 `
            -CandidateDirectory $candidateDirectory `
            -ExpectedSourceSha '${{ needs.resolve.outputs.source_sha }}' `
            -AdbPath $env:ADB_EXE `
            -PackageName $env:PACKAGE_NAME `
            -ComponentName "$env:PACKAGE_NAME/com.mobileproxymish.app.MainActivity" `
            -InitialLaunchReceiptPath "$env:RUNNER_TEMP\\mish-device-start-v1.json" `
            -PostRestartReceiptPath "$env:RUNNER_TEMP\\mish-device-post-recovery-start-v1.json" `
            -PostRestartDiagnosticPath "$env:RUNNER_TEMP\\mish-device-post-recovery-diagnostic-v2.json" `
            -EvidencePath "$env:RUNNER_TEMP\\mish-targeted-probe-v1.json"

      - name: Build observational cycle report
        id: report
        if: ${{ always() }}
        shell: 'C:\\mish-lab\\tools\\powershell-7.6.6\\pwsh.exe -NoLogo -NoProfile -NonInteractive -Command "& ([ScriptBlock]::Create((Get-Content -Raw -LiteralPath ''{0}'')))"'
        env:
          MODE: ${{ needs.resolve.outputs.mode }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          CONTROL_SHA: ${{ needs.resolve.outputs.control_sha }}
          HOSTED_RUN_ID: ${{ needs.resolve.outputs.hosted_run_id }}
          INSTALL_RUN_ID: ${{ needs.install.outputs.install_run_id }}
          REQUESTED_PROBE: ${{ needs.resolve.outputs.probe }}
        run: |
          $ErrorActionPreference = 'Stop'
          $targeted = "$env:RUNNER_TEMP\\mish-targeted-probe-v1.json"
          if (-not (Test-Path -LiteralPath $targeted -PathType Leaf)) { $targeted = '' }
          .\\lab\\windows\\new-device-cycle-report.ps1 `
            -Mode $env:MODE `
            -PrNumber ([int]$env:PR_NUMBER) `
            -SourceSha $env:SOURCE_SHA `
            -ControlSha $env:CONTROL_SHA `
            -HostedRunId $env:HOSTED_RUN_ID `
            -InstallRunId $env:INSTALL_RUN_ID `
            -LaunchReceiptPath "$env:RUNNER_TEMP\\mish-device-start-v1.json" `
            -DiagnosticEvidencePath "$env:RUNNER_TEMP\\mish-device-diagnostic-v2.json" `
            -RequestedProbe $env:REQUESTED_PROBE `
            -TargetedEvidencePath $targeted `
            -OutputPath "$env:RUNNER_TEMP\\mish-device-cycle-v1.json" | Out-Host
          $report = Get-Content -Raw -LiteralPath "$env:RUNNER_TEMP\\mish-device-cycle-v1.json" | ConvertFrom-Json
          "cycle_result=$([string]$report.cycle_result)" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_OUTPUT
          "classification=$([string]$report.classification)" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_OUTPUT
          "exact_candidate_acceptance=$([string]$report.exact_candidate_acceptance)" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_OUTPUT

      - name: Upload one cycle evidence bundle
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mish-device-cycle-${{ needs.resolve.outputs.pr_number }}-${{ needs.resolve.outputs.source_sha }}
          path: |
            ${{ runner.temp }}\\mish-device-cycle-v1.json
            ${{ runner.temp }}\\mish-device-start-v1.json
            ${{ runner.temp }}\\mish-device-diagnostic-v2.json
            ${{ runner.temp }}\\mish-targeted-probe-v1.json
            ${{ runner.temp }}\\mish-device-post-recovery-start-v1.json
            ${{ runner.temp }}\\mish-device-post-recovery-diagnostic-v2.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish cycle summary and stop for analysis
        if: ${{ always() }}
        shell: 'C:\\mish-lab\\tools\\powershell-7.6.6\\pwsh.exe -NoLogo -NoProfile -NonInteractive -Command "& ([ScriptBlock]::Create((Get-Content -Raw -LiteralPath ''{0}'')))"'
        run: |
          $reportPath = "$env:RUNNER_TEMP\\mish-device-cycle-v1.json"
          if (Test-Path -LiteralPath $reportPath -PathType Leaf) {
            $report = Get-Content -Raw -LiteralPath $reportPath | ConvertFrom-Json
            @(
              '### DEVICE-1 cycle',
              '- Trigger: **explicit analysis decision**',
              '- PR: `#${{ needs.resolve.outputs.pr_number }}`',
              '- PRODUCT SHA: `${{ needs.resolve.outputs.source_sha }}`',
              '- CONTROL SHA: `${{ needs.resolve.outputs.control_sha }}`',
              '- Mode: `${{ needs.resolve.outputs.mode }}`',
              "- Execution/evidence result: **$([string]$report.cycle_result)**",
              "- Classification: $([string]$report.classification)",
              "- Exact candidate acceptance: **$([string]$report.exact_candidate_acceptance)**",
              '- Explicit probe: `${{ needs.resolve.outputs.probe }}`',
              "- Targeted acceptance: $([string]$report.targeted_probe.acceptance_result)",
              '- Automatic cycle start: **NO**',
              '- Automatic repair/probe decision: **NO**',
              '- Next action: **STOP_FOR_ANALYSIS**',
            ) | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_STEP_SUMMARY
          }

      - name: Enforce observed result
        if: ${{ always() }}
        shell: 'C:\\mish-lab\\tools\\powershell-7.6.6\\pwsh.exe -NoLogo -NoProfile -NonInteractive -Command "& ([ScriptBlock]::Create((Get-Content -Raw -LiteralPath ''{0}'')))"'
        run: |
          $path = "$env:RUNNER_TEMP\\mish-device-cycle-v1.json"
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
            throw 'MISH_DEVICE_CYCLE_FAILURE|REPORT_MISSING|Cycle report was not produced.'
          }
          $report = Get-Content -Raw -LiteralPath $path | ConvertFrom-Json
          if ([string]$report.cycle_result -cne 'PASS') {
            throw "MISH_DEVICE_CYCLE_RESULT|$([string]$report.cycle_result)|$([string]$report.classification)"
          }
