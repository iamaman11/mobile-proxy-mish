name: U5 Lock Preview

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**/Cargo.toml'
      - '.github/workflows/u5-lock-preview.yml'

permissions:
  contents: read

jobs:
  lock-preview:
    if: github.head_ref == 'u5/rust-tokio-convergence-rotation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve lockfile without changing CI contract
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 >/dev/null
          echo '--- BEGIN CARGO LOCK DIFF ---'
          git diff -- Cargo.lock
          echo '--- END CARGO LOCK DIFF ---'
