name: Integration Android Preflight

on:
  pull_request:
    branches: [fix/root-policy-reconciliation]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: integration-android-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  android-preflight:
    name: Android Compile + Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.6.0'

      - name: Install pinned Rust Android tooling for target ABI
        shell: bash
        run: |
          set -euo pipefail
          TARGET_ABI="$(sed -n 's/^mishTargetAbi=//p' android/gradle.properties)"
          case "$TARGET_ABI" in
            armeabi-v7a) RUST_TARGET='armv7-linux-androideabi' ;;
            arm64-v8a) RUST_TARGET='aarch64-linux-android' ;;
            *) echo "Unsupported mishTargetAbi: $TARGET_ABI" >&2; exit 1 ;;
          esac
          rustup toolchain install 1.98.1 --profile minimal
          rustup override set 1.98.1
          rustup target add "$RUST_TARGET"
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Install pinned Android NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK root is not configured}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          NDK_PATH="$SDK_ROOT/ndk/29.0.14206865"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "ndk;29.0.14206865"
          test -d "$NDK_PATH"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Compile debug Kotlin
        run: gradle --no-daemon -p android :app:compileDebugKotlin

      - name: Lint debug
        run: gradle --no-daemon -p android :app:lintDebug
