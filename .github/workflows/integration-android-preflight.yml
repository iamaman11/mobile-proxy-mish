name: Integration Android Preflight

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/integration-android-preflight.yml'
      - 'android/**'
      - 'crates/**'
      - 'docs/architecture/**'
      - 'tools/check_architecture.py'
      - 'tools/verify_android_candidate.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'

permissions:
  contents: read

concurrency:
  group: integration-android-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: '1.98.1'
  CARGO_NDK_VERSION: '4.1.2'
  ANDROID_NDK_VERSION: '29.0.14206865'
  GRADLE_VERSION: '9.6.0'
  CACHE_MODE: ${{ github.event.pull_request.draft && 'static' || 'full' }}

jobs:
  android-gate:
    name: Android Fast -> Full Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify preflight build scope
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"

          build_required=false
          changed_count=0
          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            changed_count=$((changed_count + 1))
            case "$path" in
              android/*|crates/*|Cargo.toml|Cargo.lock|rust-toolchain.toml|tools/verify_android_candidate.py)
                build_required=true
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          if [[ "$changed_count" -eq 0 ]]; then
            echo 'preflight classification found no changed files' >&2
            exit 1
          fi

          echo "build_required=$build_required" >> "$GITHUB_OUTPUT"
          echo "BUILD_REQUIRED=$build_required"

      - name: Architecture constitution
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_architecture.py

      - name: Set up JDK 17
        if: ${{ steps.scope.outputs.build_required == 'true' }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Gradle
        if: ${{ steps.scope.outputs.build_required == 'true' }}
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Restore Rust build cache
        if: ${{ steps.scope.outputs.build_required == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-ndk
            target
          key: integration-android-${{ runner.os }}-${{ env.CACHE_MODE }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'Cargo.toml', 'crates/**/Cargo.toml', 'crates/**/*.rs') }}
          restore-keys: |
            integration-android-${{ runner.os }}-full-rust-${{ env.RUST_TOOLCHAIN }}-
            integration-android-${{ runner.os }}-static-rust-${{ env.RUST_TOOLCHAIN }}-

      - name: Set up host Rust toolchain
        if: ${{ steps.scope.outputs.build_required == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup override set "$RUST_TOOLCHAIN"

      - name: Fast Kotlin compile and lint
        if: ${{ steps.scope.outputs.build_required == 'true' }}
        run: >-
          gradle --no-daemon -p android
          :app:compileDebugKotlin
          :app:lintDebug

      - name: Rust workspace quality gate
        if: ${{ steps.scope.outputs.build_required == 'true' && (github.event.pull_request.draft == false || contains(github.event.pull_request.body, '[full-hosted]')) }}
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Set up Android Rust toolchain
        if: ${{ steps.scope.outputs.build_required == 'true' && (github.event.pull_request.draft == false || contains(github.event.pull_request.body, '[full-hosted]')) }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET_ABI="$(sed -n 's/^mishTargetAbi=//p' android/gradle.properties)"
          case "$TARGET_ABI" in
            armeabi-v7a) RUST_TARGET='armv7-linux-androideabi' ;;
            arm64-v8a) RUST_TARGET='aarch64-linux-android' ;;
            *) echo "Unsupported mishTargetAbi: $TARGET_ABI" >&2; exit 1 ;;
          esac
          rustup target add "$RUST_TARGET" --toolchain "$RUST_TOOLCHAIN"
          if ! cargo ndk --version 2>/dev/null | grep -Fq "$CARGO_NDK_VERSION"; then
            cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
          fi
          echo "MISH_TARGET_ABI=$TARGET_ABI" >> "$GITHUB_ENV"

      - name: Set up pinned Android NDK
        if: ${{ steps.scope.outputs.build_required == 'true' && (github.event.pull_request.draft == false || contains(github.event.pull_request.body, '[full-hosted]')) }}
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK root is not configured}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          NDK_PATH="$SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          test -x "$SDKMANAGER"
          if [[ ! -d "$NDK_PATH" ]]; then
            "$SDKMANAGER" "ndk;$ANDROID_NDK_VERSION"
          fi
          test -d "$NDK_PATH"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Unit test and assemble host gate
        if: ${{ steps.scope.outputs.build_required == 'true' && (github.event.pull_request.draft == false || contains(github.event.pull_request.body, '[full-hosted]')) }}
        run: >-
          gradle --no-daemon -p android
          :app:testDebugUnitTest
          :app:assembleDebug
          :app:assembleDebugAndroidTest

      - name: Verify exact PRODUCT candidate contract
        if: ${{ steps.scope.outputs.build_required == 'true' && (github.event.pull_request.draft == false || contains(github.event.pull_request.body, '[full-hosted]')) }}
        run: python3 tools/verify_android_candidate.py

      - name: Stage exact-head device candidate
        if: ${{ steps.scope.outputs.build_required == 'true' && github.event.pull_request.draft == false }}
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/device-candidate"
          mkdir -p "$ROOT"
          PRODUCT_SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          TEST_SRC="android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          PRODUCT_DST="$ROOT/mobile-proxy-mish-debug.apk"
          TEST_DST="$ROOT/mobile-proxy-mish-debug-androidTest.apk"
          cp "$PRODUCT_SRC" "$PRODUCT_DST"
          cp "$TEST_SRC" "$TEST_DST"
          PRODUCT_SHA="$(sha256sum "$PRODUCT_DST" | awk '{print $1}')"
          TEST_SHA="$(sha256sum "$TEST_DST" | awk '{print $1}')"
          python3 - "$ROOT/candidate.json" "$PR_NUMBER" "$SOURCE_SHA" "$BASE_SHA" "$PRODUCT_SHA" "$TEST_SHA" "$MISH_TARGET_ABI" <<'PY'
          import json
          import sys
          path, pr, source, base, product_sha, test_sha, abi = sys.argv[1:]
          payload = {
              "schema": "mish-device-candidate-v1",
              "pr_number": int(pr),
              "source_sha": source,
              "base_sha": base,
              "application_id": "com.mobileproxymish.app.debug",
              "target_abi": abi,
              "product_apk": {
                  "name": "mobile-proxy-mish-debug.apk",
                  "sha256": product_sha,
              },
              "android_test_apk": {
                  "name": "mobile-proxy-mish-debug-androidTest.apk",
                  "sha256": test_sha,
              },
          }
          with open(path, "w", encoding="utf-8", newline="\n") as handle:
              json.dump(payload, handle, sort_keys=True, separators=(",", ":"))
              handle.write("\n")
          PY

      - name: Upload exact-head device candidate
        if: ${{ steps.scope.outputs.build_required == 'true' && github.event.pull_request.draft == false }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: device-candidate-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/device-candidate
          if-no-files-found: error
          retention-days: 7

      - name: Publish device candidate summary
        if: ${{ steps.scope.outputs.build_required == 'true' && github.event.pull_request.draft == false }}
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo '### Device candidate ready'
            echo "- Source SHA: \`$SOURCE_SHA\`"
            echo "- Artifact: \`device-candidate-pr-${{ github.event.pull_request.number }}-$SOURCE_SHA\`"
            echo '- Local build required: **NO**'
            echo '- Install target: **com.mobileproxymish.app.debug**'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Static-only preflight summary
        if: ${{ steps.scope.outputs.build_required != 'true' }}
        shell: bash
        run: |
          {
            echo '### Static-only architecture preflight'
            echo '- PRODUCT build required: **NO**'
            echo '- Android/Rust build: **SKIPPED**'
            echo '- Device candidate staged: **NO**'
            echo '- Architecture constitution: **PASS**'
          } >> "$GITHUB_STEP_SUMMARY"
